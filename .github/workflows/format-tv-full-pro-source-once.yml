name: Format TV FULL PRO Source Once

on:
  workflow_dispatch:
  push:
    branches:
      - android-tv-full-pro-clean-source
    paths:
      - '.github/workflows/format-tv-full-pro-source-once.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout clean source
        uses: actions/checkout@v4
        with:
          ref: android-tv-full-pro-clean-source

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Format source exactly as validator
        run: dart format lib

      - name: Persist formatted source and remove this workflow
        shell: bash
        run: |
          rm -f .github/workflows/format-tv-full-pro-source-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A lib .github/workflows/format-tv-full-pro-source-once.yml
          git diff --cached --check
          git commit -m "Persist final Dart formatting for TV FULL PRO"
          git push origin HEAD:android-tv-full-pro-clean-source
