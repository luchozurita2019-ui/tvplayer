name: Build macOS Payment Status V1

on:
  push:
    branches:
      - mac-payment-status-v1
    paths:
      - 'lib/main.dart'
      - 'lib/screens/remote_access_gate.dart'
      - 'lib/services/remote_provisioning_service.dart'
      - '.github/workflows/build-macos-payment-status-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos-payment-status-v1:
    runs-on: macos-latest
    steps:
      - name: Checkout payment-status branch
        uses: actions/checkout@v4
        with:
          ref: mac-payment-status-v1

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Format changed Dart files
        run: dart format --output=none --set-exit-if-changed lib/main.dart lib/screens/remote_access_gate.dart lib/services/remote_provisioning_service.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze source
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Generate native macOS project
        run: flutter create --platforms=macos .

      - name: Brand application as TV FULL PRO
        run: |
          CONFIG=macos/Runner/Configs/AppInfo.xcconfig
          sed -i '' 's/^PRODUCT_NAME = .*/PRODUCT_NAME = TV FULL PRO/' "$CONFIG" || true
          cat "$CONFIG"

      - name: Enable outgoing Internet access
        run: |
          for file in macos/Runner/DebugProfile.entitlements macos/Runner/Release.entitlements; do
            /usr/libexec/PlistBuddy -c "Add :com.apple.security.network.client bool true" "$file" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :com.apple.security.network.client true" "$file"
          done

      - name: Set macOS deployment target
        run: |
          sed -i '' 's/MACOSX_DEPLOYMENT_TARGET = 10.14/MACOSX_DEPLOYMENT_TARGET = 10.15/g' macos/Runner.xcodeproj/project.pbxproj || true

      - name: Build release app
        run: flutter build macos --release

      - name: Prepare application
        run: |
          mkdir -p dist
          APP_PATH=$(find build/macos/Build/Products/Release -maxdepth 1 -name "*.app" | head -n 1)
          echo "Application: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "No macOS .app was produced"
            exit 1
          fi
          cp -R "$APP_PATH" "dist/TV FULL PRO.app"

      - name: Create PKG installer
        run: |
          pkgbuild \
            --component "dist/TV FULL PRO.app" \
            --install-location /Applications \
            --identifier com.tvfull.pro.payment.status.v1 \
            --version 1.0.0 \
            "dist/TV-FULL-PRO-macOS-Payment-Status-V1.pkg"

      - name: Create DMG installer
        run: |
          mkdir -p dmg-root
          cp -R "dist/TV FULL PRO.app" dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create \
            -volname "TV FULL PRO" \
            -srcfolder dmg-root \
            -ov \
            -format UDZO \
            "dist/TV-FULL-PRO-macOS-Payment-Status-V1.dmg"

      - name: SHA-256
        run: |
          shasum -a 256 "dist/TV-FULL-PRO-macOS-Payment-Status-V1.pkg"
          shasum -a 256 "dist/TV-FULL-PRO-macOS-Payment-Status-V1.dmg"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TV-FULL-PRO-macOS-Payment-Status-V1
          path: |
            dist/TV-FULL-PRO-macOS-Payment-Status-V1.pkg
            dist/TV-FULL-PRO-macOS-Payment-Status-V1.dmg
          if-no-files-found: error
