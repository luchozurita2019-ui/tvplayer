name: Apply premium player UI

on:
  push:
    branches:
      - performance-engine-v38-hotplayer-baseline
    paths:
      - tooling/apply_premium_player_ui.py
      - .github/workflows/apply-premium-player-ui.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: performance-engine-v38-hotplayer-baseline
          fetch-depth: 0

      - name: Apply premium UI
        run: python3 tooling/apply_premium_player_ui.py

      - name: Commit player screen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/player_screen.dart
          git commit -m "feat: redesign player with premium TV FULL overlay"
          git push origin HEAD:performance-engine-v38-hotplayer-baseline
