nname: Build macOS Installer
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Habilitar soporte de escritorio para macOS
        run: flutter config --enable-macos-desktop
      - name: Generar el proyecto nativo de macOS (carpeta macos/)
        run: flutter create --platforms=macos .
      - name: Ajustar deployment target de macOS (media_kit requiere 10.15+)
        run: |
          sed -i '' 's/MACOSX_DEPLOYMENT_TARGET = 10.14/MACOSX_DEPLOYMENT_TARGET = 10.15/g' macos/Runner.xcodeproj/project.pbxproj
      - name: Instalar dependencias
        run: flutter pub get
      - name: Compilar la app (release)
        run: flutter build macos --release
      - name: Empaquetar como .dmg instalable
        run: |
          brew install create-dmg
          mkdir -p dist
          create-dmg \
            --volname "IPTV Player" \
            --window-size 600 400 \
            --icon-size 100 \
            --app-drop-link 450 200 \
            "dist/IPTV-Player-Installer.dmg" \
            "build/macos/Build/Products/Release/iptv_player.app"
      - name: Subir el instalador como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: IPTV-Player-Installer
          path: dist/IPTV-Player-Installer.dmg
          if-no-files-found: error
