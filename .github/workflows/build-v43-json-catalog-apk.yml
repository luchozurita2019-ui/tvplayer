name: Build V43 JSON Catalog Compatibility Test

on:
  push:
    branches:
      - experiment/json-catalog-loader
    paths:
      - 'lib/services/json_catalog_service.dart'
      - 'tool/apply_json_remote_patch.py'
      - 'v43_json_catalog_url.txt'
      - '.github/workflows/build-v43-json-catalog-apk.yml'

permissions:
  contents: write

env:
  BUILD_NAME: '1.4.11'
  BUILD_NUMBER: '43'
  CERT_SHA256: '40de9b14a83adb7b070e316a241e7f5a7f5b1705fdc43b5f495b0e1e3fcab02a'

jobs:
  build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout JSON experiment branch
        uses: actions/checkout@v4
        with:
          ref: experiment/json-catalog-loader
          fetch-depth: 0

      - name: Load JSON catalog URL
        shell: bash
        run: |
          set -euo pipefail
          test -s v43_json_catalog_url.txt
          value="$(tr -d '\r\n' < v43_json_catalog_url.txt)"
          test -n "$value"
          echo "TV_FULL_JSON_CATALOG_URL=$value" >> "$GITHUB_ENV"

      - name: Apply isolated JSON catalog patch
        run: python3 tool/apply_json_remote_patch.py

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze JSON catalog integration
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Configure historical TV FULL signing
        shell: bash
        env:
          TV_FULL_KEYSTORE_BASE64: ${{ secrets.TV_FULL_KEYSTORE_BASE64 }}
          TV_FULL_KEYSTORE_PASSWORD: ${{ secrets.TV_FULL_KEYSTORE_PASSWORD }}
          TV_FULL_KEY_ALIAS: ${{ secrets.TV_FULL_KEY_ALIAS }}
          TV_FULL_KEY_PASSWORD: ${{ secrets.TV_FULL_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$TV_FULL_KEYSTORE_BASE64"
          test -n "$TV_FULL_KEYSTORE_PASSWORD"
          test -n "$TV_FULL_KEY_ALIAS"
          test -n "$TV_FULL_KEY_PASSWORD"
          printf '%s' "$TV_FULL_KEYSTORE_BASE64" | base64 --decode > android/tvfull-release.jks
          cat > android/key.properties <<EOF
          storeFile=tvfull-release.jks
          storePassword=$TV_FULL_KEYSTORE_PASSWORD
          keyAlias=$TV_FULL_KEY_ALIAS
          keyPassword=$TV_FULL_KEY_PASSWORD
          EOF

      - name: Build signed ARM32 and ARM64 APKs
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --release --split-per-abi \
            --target-platform android-arm,android-arm64 \
            --build-name="$BUILD_NAME" \
            --build-number="$BUILD_NUMBER" \
            --dart-define=TV_FULL_ANDROID_TV=true \
            --dart-define="TV_FULL_JSON_CATALOG_URL=$TV_FULL_JSON_CATALOG_URL"

      - name: Verify APK identity
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk artifact/TV-FULL-PRO-ARM32.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk artifact/TV-FULL-PRO-ARM64.apk
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          test -x "$AAPT"

          verify_apk() {
            local apk="$1"
            local expected_code="$2"
            "$APKSIGNER" verify --verbose --print-certs "$apk" > "$apk.signature.txt"
            local normalized
            normalized="$(tr -d ':' < "$apk.signature.txt" | tr '[:upper:]' '[:lower:]')"
            printf '%s' "$normalized" | grep -q "$CERT_SHA256"
            "$AAPT" dump badging "$apk" > "$apk.badging.txt"
            local package_line
            package_line="$(grep '^package:' "$apk.badging.txt" | head -n 1)"
            [[ "$package_line" == *"name='com.tvfull.pro.tv.v10safe'"* ]]
            [[ "$package_line" == *"versionName='1.4.11'"* ]]
            [[ "$package_line" == *"versionCode='$expected_code'"* ]]
          }

          verify_apk artifact/TV-FULL-PRO-ARM32.apk '1043'
          verify_apk artifact/TV-FULL-PRO-ARM64.apk '2043'

          echo "arm32_sha=$(sha256sum artifact/TV-FULL-PRO-ARM32.apk | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "arm64_sha=$(sha256sum artifact/TV-FULL-PRO-ARM64.apk | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "arm32_size=$(stat -c '%s' artifact/TV-FULL-PRO-ARM32.apk)" >> "$GITHUB_OUTPUT"
          echo "arm64_size=$(stat -c '%s' artifact/TV-FULL-PRO-ARM64.apk)" >> "$GITHUB_OUTPUT"

      - name: Publish isolated V43 JSON catalog release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="tv-full-pro-v43-json-test-${GITHUB_RUN_ID}"
          gh release create "$TAG" \
            artifact/TV-FULL-PRO-ARM32.apk \
            artifact/TV-FULL-PRO-ARM64.apk \
            --prerelease \
            --target experiment/json-catalog-loader \
            --title 'TV FULL PRO 1.4.11+43 - JSON catalog test' \
            --notes 'Isolated compatibility test: TV clasica 2 loads the remote JSON catalog once, stores it through the existing catalog cache, and passes each direct URL plus declared HTTP headers to the existing Media3 player.'
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "base=https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}" >> "$GITHUB_OUTPUT"

      - name: Point official installer to V43 test
        env:
          PUBLIC_BASE: ${{ steps.publish.outputs.base }}
          ARM32_SHA: ${{ steps.meta.outputs.arm32_sha }}
          ARM64_SHA: ${{ steps.meta.outputs.arm64_sha }}
          ARM32_SIZE: ${{ steps.meta.outputs.arm32_size }}
          ARM64_SIZE: ${{ steps.meta.outputs.arm64_size }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin android-tv-full-pro-clean-source
          git checkout -B installer-v43-json-test origin/android-tv-full-pro-clean-source
          cat > tv_full_installer/latest.json <<EOF
          {
            "versionName": "1.4.11",
            "versionCode": 43,
            "packageName": "com.tvfull.pro.tv.v10safe",
            "certificateSha256": "$CERT_SHA256",
            "arm32": {
              "url": "$PUBLIC_BASE/TV-FULL-PRO-ARM32.apk",
              "sha256": "$ARM32_SHA",
              "size": $ARM32_SIZE
            },
            "arm64": {
              "url": "$PUBLIC_BASE/TV-FULL-PRO-ARM64.apk",
              "sha256": "$ARM64_SHA",
              "size": $ARM64_SIZE
            }
          }
          EOF
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tv_full_installer/latest.json
          git commit -m 'Point installer to V43 JSON catalog compatibility test'
          git push origin HEAD:android-tv-full-pro-clean-source

      - name: Remove signing material
        if: always()
        run: rm -f android/key.properties android/tvfull-release.jks

      - name: Upload verification bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TV-FULL-PRO-V43-JSON-TEST
          path: artifact/
          if-no-files-found: warn
          retention-days: 30
