name: Build Lista TV 3 V51 test

on:
  push:
    branches:
      - experiment/lista-tv-3-v50-clean
    paths:
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/build-lista-tv3-test.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_NAME: '1.4.19'
  BUILD_NUMBER: '3051'
  CERT_SHA256: '40de9b14a83adb7b070e316a241e7f5a7f5b1705fdc43b5f495b0e1e3fcab02a'
  DYNAMIC_CONFIG: '{"name":"Lista TV 3","server":"https://ghsoudpjlnjmhiragkrm.supabase.co","resolver":{"path":"/functions/v1/tvf-lista3-resolve","method":"POST","timeoutMs":18000,"form":{"id":"{id}","channelCode":"{id}","name":"{name}","playCode":"{path}","path":"{path}","androidId":"{androidId}","device":"{androidId}","globalIndex":"{globalIndex}"}}}'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout experimental source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: |
          flutter pub get
          git diff --exit-code -- pubspec.lock

      - name: Enable existing provider ClearKey HLS compatibility
        run: |
          python3 .github/scripts/enable_provider_clearkey_hls.py
          git diff --check

      - name: Analyze Lista TV 3 changes
        run: dart analyze lib test

      - name: Run tests
        run: flutter test --no-pub --reporter expanded

      - name: Configure historical TV FULL signing
        shell: bash
        env:
          TV_FULL_KEYSTORE_BASE64: ${{ secrets.TV_FULL_KEYSTORE_BASE64 }}
          TV_FULL_KEYSTORE_PASSWORD: ${{ secrets.TV_FULL_KEYSTORE_PASSWORD }}
          TV_FULL_KEY_ALIAS: ${{ secrets.TV_FULL_KEY_ALIAS }}
          TV_FULL_KEY_PASSWORD: ${{ secrets.TV_FULL_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$TV_FULL_KEYSTORE_BASE64"
          test -n "$TV_FULL_KEYSTORE_PASSWORD"
          test -n "$TV_FULL_KEY_ALIAS"
          test -n "$TV_FULL_KEY_PASSWORD"
          umask 077
          printf '%s' "$TV_FULL_KEYSTORE_BASE64" | base64 --decode > android/tvfull-release.jks
          cat > android/key.properties <<EOF
          storeFile=tvfull-release.jks
          storePassword=$TV_FULL_KEYSTORE_PASSWORD
          keyAlias=$TV_FULL_KEY_ALIAS
          keyPassword=$TV_FULL_KEY_PASSWORD
          EOF

      - name: Build signed ARM32 and ARM64 test APKs
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --release --split-per-abi \
            --target-platform android-arm,android-arm64 \
            --build-name="$BUILD_NAME" \
            --build-number="$BUILD_NUMBER" \
            --dart-define=TV_FULL_ANDROID_TV=true \
            --dart-define=TV_FULL_DYNAMIC_SOURCE_JSON="$DYNAMIC_CONFIG"

      - name: Prepare and verify test artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk artifact/TV-FULL-PRO-V51-LISTA-TV3-ARM32.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk artifact/TV-FULL-PRO-V51-LISTA-TV3-ARM64.apk
          sha256sum artifact/*.apk > artifact/SHA256SUMS.txt

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs artifact/TV-FULL-PRO-V51-LISTA-TV3-ARM32.apk | tee artifact/CERTIFICATE-ARM32.txt
          "$APKSIGNER" verify --verbose --print-certs artifact/TV-FULL-PRO-V51-LISTA-TV3-ARM64.apk | tee artifact/CERTIFICATE-ARM64.txt

          EXPECTED="$(printf '%s' "$CERT_SHA256" | tr '[:upper:]' '[:lower:]')"
          grep -Fqi "certificate SHA-256 digest: $EXPECTED" artifact/CERTIFICATE-ARM32.txt
          grep -Fqi "certificate SHA-256 digest: $EXPECTED" artifact/CERTIFICATE-ARM64.txt

      - name: Upload signed test APKs
        uses: actions/upload-artifact@v4
        with:
          name: TV-FULL-PRO-V51-LISTA-TV3-TEST
          path: artifact/
          if-no-files-found: error
          retention-days: 14

      - name: Remove signing material
        if: always()
        run: rm -f android/key.properties android/tvfull-release.jks
