name: Apply parental and sidebar patch

on:
  push:
    branches:
      - performance-engine-v38-hotplayer-baseline
    paths:
      - tooling/apply_parental_sidebar_v1.py
      - .github/workflows/apply-parental-sidebar-v1.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: performance-engine-v38-hotplayer-baseline
          fetch-depth: 0

      - name: Apply patch
        run: python3 tooling/apply_parental_sidebar_v1.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/channel_list_screen.dart lib/screens/home_screen.dart lib/services/artwork_cache_service.dart pubspec.yaml
          git commit -m "feat: add parental control and resizable categories"
          git push origin HEAD:performance-engine-v38-hotplayer-baseline
