name: Build macOS Remote Test V1

on:
  push:
    branches:
      - mac-remote-provisioning-v1
    paths:
      - '.github/scripts/apply_macos_remote_provisioning.py'
      - '.github/workflows/build-macos-remote-test-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos-remote:
    runs-on: macos-latest
    steps:
      - name: Checkout macOS remote branch
        uses: actions/checkout@v4
        with:
          ref: mac-remote-provisioning-v1
          fetch-depth: 0

      - name: Apply macOS remote provisioning patch
        run: python3 .github/scripts/apply_macos_remote_provisioning.py

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Format changed Dart files
        run: dart format lib/providers/iptv_provider.dart lib/services/remote_provisioning_service.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze source
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Verify source scope
        run: |
          CHANGED=$(git diff --name-only)
          echo "$CHANGED"
          BAD=$(echo "$CHANGED" | grep -vE '^(lib/providers/iptv_provider\.dart|lib/services/remote_provisioning_service\.dart)$' || true)
          if [ -n "$BAD" ]; then
            echo "Unexpected changed files:"
            echo "$BAD"
            exit 1
          fi

      - name: Commit functional macOS remote integration
        run: |
          if git diff --quiet; then
            echo "No functional changes to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib/providers/iptv_provider.dart lib/services/remote_provisioning_service.dart
            git commit -m "Add macOS remote playlist provisioning"
            git push origin HEAD:mac-remote-provisioning-v1
          fi

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Generate native macOS project
        run: flutter create --platforms=macos .

      - name: Enable outgoing Internet access
        run: |
          for file in macos/Runner/DebugProfile.entitlements macos/Runner/Release.entitlements; do
            /usr/libexec/PlistBuddy -c "Add :com.apple.security.network.client bool true" "$file" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :com.apple.security.network.client true" "$file"
          done

      - name: Set macOS deployment target
        run: |
          sed -i '' 's/MACOSX_DEPLOYMENT_TARGET = 10.14/MACOSX_DEPLOYMENT_TARGET = 10.15/g' macos/Runner.xcodeproj/project.pbxproj || true

      - name: Build release app
        run: flutter build macos --release

      - name: Package DMG
        run: |
          mkdir -p dist
          APP_PATH=$(find build/macos/Build/Products/Release -maxdepth 1 -name "*.app" | head -n 1)
          echo "Application: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "No macOS .app was produced"
            exit 1
          fi
          hdiutil create \
            -volname "TV FULL PRO Remote Test" \
            -srcfolder "$APP_PATH" \
            -ov \
            -format UDZO \
            dist/TV-FULL-PRO-macOS-Remote-Test-V1.dmg

      - name: SHA-256
        run: shasum -a 256 dist/TV-FULL-PRO-macOS-Remote-Test-V1.dmg

      - name: Upload macOS test artifact
        uses: actions/upload-artifact@v4
        with:
          name: TV-FULL-PRO-macOS-Remote-Test-V1
          path: dist/TV-FULL-PRO-macOS-Remote-Test-V1.dmg
          if-no-files-found: error
