name: Apply TV FULL PRO 1.4.2 Release

on:
  push:
    branches:
      - android-tv-full-pro-clean-source
    paths:
      - '.github/scripts/apply_tv_full_release_v34.py'
      - '.github/workflows/apply-tv-full-release-v34.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout TV FULL PRO branch
        uses: actions/checkout@v4
        with:
          ref: android-tv-full-pro-clean-source

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply release patch
        run: python3 .github/scripts/apply_tv_full_release_v34.py

      - name: Resolve dependencies
        run: flutter pub get

      - name: Format changed Dart files
        run: dart format lib test

      - name: Analyze source
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Commit release source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pubspec.yaml lib test
          git commit -m 'Prepare TV FULL PRO 1.4.2+34' || true
          git pull --rebase origin android-tv-full-pro-clean-source
          git push origin HEAD:android-tv-full-pro-clean-source
