name: Build Android TV V4 MPV Android Baseline

on:
  workflow_dispatch:
  push:
    branches:
      - android-tv-mpv-android-baseline-v4
    paths:
      - 'pubspec.yaml'
      - 'lib/**'
      - '.github/scripts/apply_mpv_android_baseline_v4.py'
      - '.github/workflows/build-android-tv-mpv-baseline-v4.yml'

permissions:
  contents: read

jobs:
  build-android-tv-v4:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout V4 branch
        uses: actions/checkout@v4
        with:
          ref: android-tv-mpv-android-baseline-v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Apply mpv-android playback baseline
        run: python3 .github/scripts/apply_mpv_android_baseline_v4.py

      - name: Format patched source
        run: dart format lib/screens/player_screen.dart

      - name: Analyze source
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Verify MPV Android markers
        shell: bash
        run: |
          grep -q "hwdec: 'mediacodec,mediacodec-copy'" lib/screens/player_screen.dart
          grep -q "setProperty('video-sync', 'audio')" lib/screens/player_screen.dart
          grep -q "setProperty('framedrop', 'vo')" lib/screens/player_screen.dart
          grep -q "media_kit_video: ^2.0.1" pubspec.yaml

      - name: Generate Android project
        run: flutter create --platforms=android .

      - name: Configure Android TV V4 test package
        shell: bash
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i '/<manifest/a\    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-feature android:name="android.software.leanback" android:required="true" />\n    <uses-feature android:name="android.hardware.touchscreen" android:required="false" />\n    <uses-feature android:name="android.hardware.faketouch" android:required="false" />' "$MANIFEST"
          fi
          sed -i 's/android:label="iptv_player"/android:label="TV FULL PRO V4 MPV"/' "$MANIFEST"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          if 'android:usesCleartextTraffic' not in s:
              s = s.replace('<application', '<application android:usesCleartextTraffic="true"', 1)
          if 'android:banner=' not in s:
              s = s.replace('android:label="TV FULL PRO V4 MPV"', 'android:label="TV FULL PRO V4 MPV"\n        android:banner="@mipmap/ic_launcher"', 1)
          if 'android:screenOrientation=' not in s:
              s = s.replace('android:name=".MainActivity"', 'android:name=".MainActivity"\n            android:screenOrientation="landscape"', 1)
          if 'android.intent.category.LEANBACK_LAUNCHER' not in s:
              s = s.replace('<category android:name="android.intent.category.LAUNCHER"/>', '<category android:name="android.intent.category.LAUNCHER"/>\n                <category android:name="android.intent.category.LEANBACK_LAUNCHER"/>', 1)
          p.write_text(s)

          g = Path('android/app/build.gradle.kts')
          gs = g.read_text().replace('applicationId = "com.example.iptv_player"', 'applicationId = "com.tvfull.pro.tv.v4mpv"')
          g.write_text(gs)
          PY

      - name: Build split release APKs
        run: flutter build apk --release --split-per-abi --dart-define=TV_FULL_ANDROID_TV=true

      - name: Verify APK package and signatures
        shell: bash
        run: |
          BUILD_TOOLS="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          AAPT="$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            echo "===== $apk ====="
            "$AAPT" dump badging "$apk" | head -8
            "$APKSIGNER" verify --verbose "$apk"
          done

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p artifact
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk artifact/TV-FULL-PRO-V4-MPV-ARM32.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk artifact/TV-FULL-PRO-V4-MPV-ARM64.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk artifact/TV-FULL-PRO-V4-MPV-X86_64.apk
          sha256sum artifact/*.apk > artifact/SHA256.txt
          git rev-parse HEAD > artifact/COMMIT.txt

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: TV-FULL-PRO-V4-MPV-Android-Baseline
          path: artifact/
          retention-days: 30
