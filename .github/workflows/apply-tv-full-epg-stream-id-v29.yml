name: Apply TV FULL PRO EPG stream-id v29

on:
  push:
    branches:
      - android-tv-full-pro-clean-source
    paths:
      - '.github/epg-stream-id-v29-request.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout TV FULL PRO source
        uses: actions/checkout@v4
        with:
          ref: android-tv-full-pro-clean-source

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply Xtream stream_id EPG fix
        run: python .github/scripts/apply_tv_full_epg_stream_id_v29.py

      - name: Resolve dependencies
        run: flutter pub get

      - name: Format touched Dart files
        run: dart format lib/models/channel.dart lib/services/xtream_live_fast_service.dart lib/services/xtream_service.dart lib/services/live_epg_service.dart test/channel_xtream_stream_id_test.dart

      - name: Verify touched formatting
        run: dart format --output=none --set-exit-if-changed lib/models/channel.dart lib/services/xtream_live_fast_service.dart lib/services/xtream_service.dart lib/services/live_epg_service.dart test/channel_xtream_stream_id_test.dart

      - name: Check patch whitespace
        run: git diff --check

      - name: Static analysis
        run: flutter analyze

      - name: Run automated tests
        run: flutter test

      - name: Compile Android TV debug validation
        run: flutter build apk --debug --dart-define=TV_FULL_ANDROID_TV=true --target-platform android-arm64

      - name: Verify EPG and performance guardrails
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^version: 1.3.7+29$' pubspec.yaml
          grep -q 'final String? xtreamStreamId' lib/models/channel.dart
          grep -q "'xtreamStreamId': id" lib/services/xtream_live_fast_service.dart
          grep -q "xtreamStreamId: _cleanText(item\['xtreamStreamId'\])" lib/services/xtream_live_fast_service.dart
          grep -q 'xtreamStreamId: streamId' lib/services/xtream_service.dart
          grep -q 'channel.xtreamStreamId' lib/services/live_epg_service.dart
          grep -q 'static const int _cacheVersion = 4' lib/services/xtream_live_fast_service.dart
          grep -q 'Guía no informada' lib/widgets/tv_live_premium_catalog.dart
          ! grep -q 'Programación no disponible' lib/widgets/tv_live_premium_catalog.dart
          ! grep -q 'iptv-org.github.io/api/logos.json' lib/services/channel_logo_resolver_service.dart
          grep -q 'LIVE_STARTUP_MAX_WAIT_MS = 25000L' android/app/src/main/kotlin/com/example/iptv_player/MainActivity.kt
          grep -q 'LIVE_STARTUP_NO_PROGRESS_MS = 9000L' android/app/src/main/kotlin/com/example/iptv_player/MainActivity.kt
          grep -q 'connectTimeout(4, TimeUnit.SECONDS)' android/app/src/main/kotlin/com/example/iptv_player/MainActivity.kt

      - name: Commit TV FULL PRO 1.3.7+29
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/models/channel.dart lib/services/xtream_live_fast_service.dart lib/services/xtream_service.dart lib/services/live_epg_service.dart lib/widgets/tv_live_premium_catalog.dart pubspec.yaml test/channel_xtream_stream_id_test.dart
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'TV FULL PRO 1.3.7+29: preserve Xtream stream id for EPG'
          git push origin HEAD:android-tv-full-pro-clean-source
