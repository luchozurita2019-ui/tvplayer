name: Apply slow connection home profile v1

on:
  push:
    branches:
      - performance-engine-v38-hotplayer-baseline
    paths:
      - tooling/fix_slow_connection_home_profile_v1.py
      - .github/workflows/apply-slow-connection-home-profile-v1.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: performance-engine-v38-hotplayer-baseline
      - name: Apply patch
        run: python tooling/fix_slow_connection_home_profile_v1.py
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/home_screen.dart
          git commit -m "fix: show slow connection profile on home"
          git push
