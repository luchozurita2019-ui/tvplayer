name: Fix TV FULL PRO cacheExtent Once

on:
  push:
    branches:
      - android-tv-full-pro-clean-source
    paths:
      - '.github/workflows/fix-scroll-cache-extent-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: android-tv-full-pro-clean-source

      - name: Replace invalid ScrollCacheExtent API
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          targets = [
              Path('lib/screens/android_media3_texture_player_screen.dart'),
              Path('lib/screens/channel_list_screen.dart'),
              Path('lib/screens/xtream_live_screen.dart'),
              Path('lib/screens/xtream_movies_screen.dart'),
              Path('lib/screens/xtream_series_screen.dart'),
          ]
          pattern = re.compile(r'scrollCacheExtent:\s*const ScrollCacheExtent\.pixels\((\d+(?:\.\d+)?)\),')
          changed = 0
          for path in targets:
              text = path.read_text()
              new, count = pattern.subn(r'cacheExtent: \1,', text)
              if count:
                  path.write_text(new)
                  changed += count
          if changed != 5:
              raise SystemExit(f'Expected 5 cacheExtent fixes, got {changed}')
          print(f'Fixed {changed} cacheExtent declarations')
          PY

      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/fix-scroll-cache-extent-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A lib .github/workflows/fix-scroll-cache-extent-once.yml
          git diff --cached --check
          git commit -m "Use supported Flutter cacheExtent API"
          git push origin HEAD:android-tv-full-pro-clean-source
