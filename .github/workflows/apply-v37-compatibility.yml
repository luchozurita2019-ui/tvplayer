name: Apply V3.7 compatibility patch

on:
  push:
    branches:
      - performance-engine-v37-compatibility
    paths:
      - tooling/apply_v37_patch.py
      - .github/workflows/apply-v37-compatibility.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: performance-engine-v37-compatibility

      - name: Apply patch
        run: python3 tooling/apply_v37_patch.py

      - name: Commit patched player
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/player_screen.dart
          git commit -m "feat: adaptive playback compatibility V3.7"
          git push origin performance-engine-v37-compatibility
