name: Validate TV FULL PRO Clean

on:
  workflow_dispatch:
  push:
    branches:
      - android-tv-full-pro-clean-source
    paths:
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - '.github/workflows/validate-tv-full-pro-clean.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout clean source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Parse Dart formatting
        run: dart format --output=none lib

      - name: Analyze complete Dart source
        run: flutter analyze

      - name: Compile Android Kotlin sources
        working-directory: android
        run: ./gradlew :app:compileReleaseKotlin --stacktrace
