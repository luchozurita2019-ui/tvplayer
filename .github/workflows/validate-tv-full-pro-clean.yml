# one-time integrated formatting and validation pass
name: Validate TV FULL PRO Clean

on:
  push:
    branches:
      - android-tv-full-pro-clean-source
    paths:
      - '.github/workflows/validate-tv-full-pro-clean.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout clean source
        uses: actions/checkout@v4
        with:
          ref: android-tv-full-pro-clean-source

      - name: Record validation run id
        shell: bash
        run: |
          printf '%s\n' "$GITHUB_RUN_ID" > .github/last-clean-validation-run.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/last-clean-validation-run.txt
          git commit -m "Record clean validation run $GITHUB_RUN_ID" || true
          git push origin HEAD:android-tv-full-pro-clean-source

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Fix compact movie metadata color
        shell: bash
        run: sed -i 's/Colors\.white46/Color(0x75FFFFFF)/g' lib/screens/xtream_movies_screen.dart

      - name: Format complete Dart source
        run: dart format lib

      - name: Analyze complete Dart source
        run: flutter analyze

      - name: Compile Android TV integration
        run: >-
          flutter build apk --debug
          --dart-define=TV_FULL_ANDROID_TV=true
          --target-platform android-arm64

      - name: Persist validated formatting and restore normal validator
        shell: bash
        run: |
          git show 1160c48c9cd5e156803bf162fb15631fd4b96ae7:.github/workflows/validate-tv-full-pro-clean.yml > .github/workflows/validate-tv-full-pro-clean.yml
          git add lib .github/workflows/validate-tv-full-pro-clean.yml
          git commit -m "Validate integrated TV FULL PRO source" || true
          git push origin HEAD:android-tv-full-pro-clean-source
