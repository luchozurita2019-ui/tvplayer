# validate integrated TV FULL PRO source after D-pad audit
name: Validate TV FULL PRO Clean

on:
  workflow_dispatch:
  push:
    branches:
      - android-tv-full-pro-clean-source
    paths:
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - '.github/workflows/validate-tv-full-pro-clean.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout clean source
        uses: actions/checkout@v4
        with:
          ref: android-tv-full-pro-clean-source

      - name: Record current validation run
        shell: bash
        run: |
          printf '%s\n' "$GITHUB_RUN_ID" > .github/current-clean-validation-run.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/current-clean-validation-run.txt
          git commit -m "Record current clean validation $GITHUB_RUN_ID" || true
          git push origin HEAD:android-tv-full-pro-clean-source

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Apply compact LIVE HUD and normalize Dart
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('lib/screens/android_media3_texture_player_screen.dart')
          text = path.read_text()
          if "label: const Text('Catálogo')" not in text:
              replacement = r'''  Widget _liveHud() => SafeArea(
                child: Align(
                  alignment: Alignment.bottomCenter,
                  child: Container(
                    height: 54,
                    margin: const EdgeInsets.fromLTRB(18, 0, 18, 14),
                    padding: const EdgeInsets.symmetric(horizontal: 12),
                    decoration: BoxDecoration(
                      color: const Color(0xE80A1017),
                      borderRadius: BorderRadius.circular(10),
                      border: Border.all(color: Colors.white12),
                    ),
                    child: Row(
                      children: [
                        SizedBox(
                          width: 34,
                          height: 34,
                          child: ClipRRect(
                            borderRadius: BorderRadius.circular(7),
                            child: CachedArtworkImage(
                              url: _channel.logoUrl,
                              fit: BoxFit.contain,
                              cacheWidth: 68,
                              cacheHeight: 68,
                              prefetchExtent: 0,
                              fallback: const Icon(Icons.live_tv_rounded, size: 20),
                            ),
                          ),
                        ),
                        const SizedBox(width: 10),
                        Expanded(
                          child: Text(
                            _channel.name,
                            maxLines: 1,
                            overflow: TextOverflow.ellipsis,
                            style: const TextStyle(
                              fontSize: 14,
                              fontWeight: FontWeight.w800,
                            ),
                          ),
                        ),
                        Container(width: 1, height: 24, color: Colors.white12),
                        const SizedBox(width: 10),
                        const Icon(Icons.circle, size: 8, color: Colors.redAccent),
                        const SizedBox(width: 5),
                        const Text(
                          'LIVE',
                          style: TextStyle(
                            color: Colors.redAccent,
                            fontSize: 11,
                            fontWeight: FontWeight.w900,
                          ),
                        ),
                        const SizedBox(width: 12),
                        SizedBox(
                          height: 34,
                          child: OutlinedButton.icon(
                            style: OutlinedButton.styleFrom(
                              padding: const EdgeInsets.symmetric(horizontal: 10),
                              visualDensity: VisualDensity.compact,
                            ),
                            onPressed: _openChannelList,
                            icon: const Icon(Icons.list_rounded, size: 18),
                            label: const Text('Catálogo'),
                          ),
                        ),
                      ],
                    ),
                  ),
                ),
              );

            Widget _channelDrawer() => Align('''
              patched, count = re.subn(
                  r"  Widget _liveHud\(\) => SafeArea\([\s\S]*?\n  Widget _channelDrawer\(\) => Align\(",
                  replacement,
                  text,
                  count=1,
              )
              if count != 1:
                  raise SystemExit('No se encontró el bloque LIVE HUD esperado')
              patched = patched.replace('width: 390,', 'width: 350,', 1)
              path.write_text(patched)
          PY
          dart format lib
          if ! git diff --quiet -- lib; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib
            git commit -m "Apply compact TV FULL PRO LIVE interface"
            git push origin HEAD:android-tv-full-pro-clean-source
          fi

      - name: Analyze complete Dart source
        run: flutter analyze

      - name: Compile Android TV integration
        run: >-
          flutter build apk --debug
          --dart-define=TV_FULL_ANDROID_TV=true
          --target-platform android-arm64

      - name: Record successful validation
        shell: bash
        run: |
          git pull --rebase origin android-tv-full-pro-clean-source
          printf '%s\n' "$GITHUB_RUN_ID" > .github/last-clean-validation-run.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/last-clean-validation-run.txt
          git commit -m "Record clean validation run $GITHUB_RUN_ID" || true
          git push origin HEAD:android-tv-full-pro-clean-source
