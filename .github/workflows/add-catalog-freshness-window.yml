name: Add Catalog Freshness Window

on:
  workflow_dispatch:
  push:
    branches:
      - android-tv-full-pro-clean-source
    paths:
      - '.github/workflows/add-catalog-freshness-window.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout clean source
        uses: actions/checkout@v4
        with:
          ref: android-tv-full-pro-clean-source

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies first
        run: flutter pub get

      - name: Add freshness windows
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          changes = {
            'lib/screens/xtream_live_screen.dart': [
              (
                "class _XtreamLiveScreenState extends State<XtreamLiveScreen> {\n  late Future<_LiveData> _future;",
                "class _XtreamLiveScreenState extends State<XtreamLiveScreen> {\n  static const Duration _cacheFreshFor = Duration(minutes: 3);\n\n  late Future<_LiveData> _future;",
              ),
              (
                "      if (cached != null && cached.channels.isNotEmpty) {\n        final channels = _normalizeXtreamChannels(cached.channels);\n        unawaited(_refreshXtream());\n        return _LiveData(channels);\n      }",
                "      if (cached != null && cached.channels.isNotEmpty) {\n        final channels = _normalizeXtreamChannels(cached.channels);\n        if (DateTime.now().difference(cached.savedAt) >= _cacheFreshFor) {\n          unawaited(_refreshXtream());\n        }\n        return _LiveData(channels);\n      }",
              ),
            ],
            'lib/screens/xtream_movies_screen.dart': [
              (
                "class _XtreamMoviesScreenState extends State<XtreamMoviesScreen> {\n  late Future<_MovieData> _future;",
                "class _XtreamMoviesScreenState extends State<XtreamMoviesScreen> {\n  static const Duration _cacheFreshFor = Duration(minutes: 15);\n\n  late Future<_MovieData> _future;",
              ),
              (
                "      if (cached != null && cached.movies.isNotEmpty) {\n        unawaited(_refreshXtream());\n        return _MovieData.xtream(cached.connection, cached.movies);\n      }",
                "      if (cached != null && cached.movies.isNotEmpty) {\n        if (DateTime.now().difference(cached.savedAt) >= _cacheFreshFor) {\n          unawaited(_refreshXtream());\n        }\n        return _MovieData.xtream(cached.connection, cached.movies);\n      }",
              ),
            ],
            'lib/screens/xtream_series_screen.dart': [
              (
                "class _XtreamSeriesScreenState extends State<XtreamSeriesScreen> {\n  late Future<_SeriesData> _future;",
                "class _XtreamSeriesScreenState extends State<XtreamSeriesScreen> {\n  static const Duration _cacheFreshFor = Duration(minutes: 15);\n\n  late Future<_SeriesData> _future;",
              ),
              (
                "      if (cached != null && cached.series.isNotEmpty) {\n        unawaited(_refreshXtream());\n        return _SeriesData.xtream(cached.connection, cached.series);\n      }",
                "      if (cached != null && cached.series.isNotEmpty) {\n        if (DateTime.now().difference(cached.savedAt) >= _cacheFreshFor) {\n          unawaited(_refreshXtream());\n        }\n        return _SeriesData.xtream(cached.connection, cached.series);\n      }",
              ),
            ],
          }

          for filename, replacements in changes.items():
            path = Path(filename)
            text = path.read_text()
            for old, new in replacements:
              if old not in text:
                raise SystemExit(f'Missing expected marker in {filename}: {old[:100]}')
              text = text.replace(old, new, 1)
            path.write_text(text)
          PY

      - name: Format changed files
        run: >-
          dart format
          lib/screens/xtream_live_screen.dart
          lib/screens/xtream_movies_screen.dart
          lib/screens/xtream_series_screen.dart

      - name: Remove one-off patcher and commit
        shell: bash
        run: |
          rm -f .github/workflows/add-catalog-freshness-window.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/xtream_live_screen.dart lib/screens/xtream_movies_screen.dart lib/screens/xtream_series_screen.dart .github/workflows/add-catalog-freshness-window.yml
          git commit -m "Avoid redundant fresh Xtream catalog refreshes"
          git push origin HEAD:android-tv-full-pro-clean-source
