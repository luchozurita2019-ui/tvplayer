name: Apply TV FULL Installer 1.0.1

on:
  push:
    branches:
      - android-tv-full-pro-clean-source
    paths:
      - '.github/tv-full-installer-v101-request.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: android-tv-full-pro-clean-source

      - name: Apply installer 1.0.1 patch
        run: python .github/scripts/apply_tv_full_installer_v101.py

      - name: Validate patch
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode = 2' tv_full_installer/app/build.gradle.kts
          grep -q 'versionName = "1.0.1"' tv_full_installer/app/build.gradle.kts
          grep -q 'ACTION_MANAGE_UNKNOWN_APP_SOURCES' tv_full_installer/app/src/main/java/com/tvfull/pro/installer/MainActivity.java
          grep -q 'pendingDownloadAfterPermission' tv_full_installer/app/src/main/java/com/tvfull/pro/installer/MainActivity.java
          grep -q 'PERMITIR INSTALACIÓN' tv_full_installer/app/src/main/java/com/tvfull/pro/installer/MainActivity.java
          grep -q 'ImageView logo' tv_full_installer/app/src/main/java/com/tvfull/pro/installer/MainActivity.java
          grep -q '#F6C64A' tv_full_installer/app/src/main/res/drawable/ic_launcher.xml
          grep -q '#16C7FF' tv_full_installer/app/src/main/res/drawable/ic_launcher.xml
          grep -q 'REQUEST_INSTALL_PACKAGES' tv_full_installer/app/src/main/AndroidManifest.xml
          git diff --check

      - name: Commit installer update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tv_full_installer/app/src/main/java/com/tvfull/pro/installer/MainActivity.java \
                  tv_full_installer/app/src/main/res/drawable/ic_launcher.xml \
                  tv_full_installer/app/build.gradle.kts
          git commit -m 'TV FULL Installer 1.0.1: premium icon and install permission flow'
          git push origin HEAD:android-tv-full-pro-clean-source
