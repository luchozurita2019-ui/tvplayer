name: Build Android TV V6 Live + Media3 VOD V8

on:
  workflow_dispatch:
  push:
    branches:
      - android-tv-v6-vod-media3-v8
    paths:
      - '.github/workflows/build-android-tv-v6-vod-media3-v8.yml'
      - '.github/scripts/apply_android_media3_texture_v6.py'
      - '.github/scripts/apply_android_media3_vod_v8.py'

permissions:
  contents: read

jobs:
  build-v8:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout V8 branch
        uses: actions/checkout@v4
        with:
          ref: android-tv-v6-vod-media3-v8

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --platforms=android .

      - name: Apply proven V6 live engine
        run: python3 .github/scripts/apply_android_media3_texture_v6.py

      - name: Apply native Media3 VOD and Series engine
        run: python3 .github/scripts/apply_android_media3_vod_v8.py

      - name: Format playback files
        run: dart format lib/screens/player_screen.dart lib/screens/android_media3_texture_player_screen.dart lib/screens/android_media3_vod_player_screen.dart

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze VOD player
        run: dart analyze --no-fatal-warnings lib/screens/android_media3_vod_player_screen.dart

      - name: Build ARM32 plus ARM64 release APK
        shell: bash
        run: |
          for attempt in 1 2; do
            echo "V8 build attempt $attempt/2"
            if flutter build apk --release --target-platform android-arm,android-arm64 --dart-define=TV_FULL_ANDROID_TV=true; then
              exit 0
            fi
            if [ "$attempt" = "1" ]; then
              sleep 10
            fi
          done
          exit 1

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p artifact
          cp build/app/outputs/flutter-apk/app-release.apk artifact/TV-FULL-PRO-V8-LIVE-V6-MEDIA3-VOD-COMPAT.apk
          sha256sum artifact/TV-FULL-PRO-V8-LIVE-V6-MEDIA3-VOD-COMPAT.apk > artifact/SHA256.txt
          git rev-parse HEAD > artifact/COMMIT.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TV-FULL-PRO-V8-LIVE-V6-MEDIA3-VOD-COMPAT
          path: artifact/
          retention-days: 30
