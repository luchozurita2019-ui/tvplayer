name: Apply TV FULL PRO visible logo priority v30

on:
  push:
    branches:
      - android-tv-full-pro-clean-source
    paths:
      - '.github/visible-logo-priority-v30-request.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout TV FULL PRO source
        uses: actions/checkout@v4
        with:
          ref: android-tv-full-pro-clean-source

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply visible-first logo optimization
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/apply_tv_full_visible_logo_priority_v30.py
          sed -i 's/scrollCacheExtent: 0,/scrollCacheExtent: const ScrollCacheExtent.pixels(0),/' lib/widgets/tv_live_premium_catalog.dart

      - name: Resolve dependencies
        run: flutter pub get

      - name: Format touched Dart files
        run: dart format lib/widgets/cached_artwork_image.dart lib/widgets/tv_live_premium_catalog.dart

      - name: Verify touched formatting
        run: dart format --output=none --set-exit-if-changed lib/widgets/cached_artwork_image.dart lib/widgets/tv_live_premium_catalog.dart

      - name: Check patch whitespace
        run: git diff --check

      - name: Static analysis
        run: flutter analyze

      - name: Run automated tests
        run: flutter test

      - name: Compile Android TV debug validation
        run: flutter build apk --debug --dart-define=TV_FULL_ANDROID_TV=true --target-platform android-arm64

      - name: Verify performance guardrails
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^version: 1.3.8+30$' pubspec.yaml
          grep -q 'Scrollable.maybeOf(context)?.position' lib/widgets/cached_artwork_image.dart
          grep -q '_isInLoadViewport' lib/widgets/cached_artwork_image.dart
          grep -q 'scrollCacheExtent: const ScrollCacheExtent.pixels(0)' lib/widgets/tv_live_premium_catalog.dart
          grep -q 'addAutomaticKeepAlives: false' lib/widgets/tv_live_premium_catalog.dart
          grep -q 'Duration(milliseconds: 520)' lib/widgets/tv_live_premium_catalog.dart
          grep -q 'priority: 300' lib/widgets/tv_live_premium_catalog.dart
          grep -q 'priority: _focused ? 220 : 120' lib/widgets/tv_live_premium_catalog.dart
          grep -q 'xtreamStreamId' lib/models/channel.dart
          grep -q 'Guía no informada' lib/widgets/tv_live_premium_catalog.dart
          ! grep -q 'iptv-org.github.io/api/logos.json' lib/services/channel_logo_resolver_service.dart
          grep -q 'LIVE_STARTUP_MAX_WAIT_MS = 25000L' android/app/src/main/kotlin/com/example/iptv_player/MainActivity.kt
          grep -q 'LIVE_STARTUP_NO_PROGRESS_MS = 9000L' android/app/src/main/kotlin/com/example/iptv_player/MainActivity.kt
          grep -q 'MAX_LIVE_ENDED_RECOVERIES = 5' android/app/src/main/kotlin/com/example/iptv_player/MainActivity.kt
          grep -q 'connectTimeout(4, TimeUnit.SECONDS)' android/app/src/main/kotlin/com/example/iptv_player/MainActivity.kt

      - name: Commit TV FULL PRO 1.3.8+30
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/widgets/cached_artwork_image.dart lib/widgets/tv_live_premium_catalog.dart pubspec.yaml
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'TV FULL PRO 1.3.8+30: prioritize visible LIVE logos'
          git push origin HEAD:android-tv-full-pro-clean-source
