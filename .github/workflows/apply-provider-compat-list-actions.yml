name: Apply provider compatibility and list actions

on:
  push:
    branches:
      - performance-engine-v38-hotplayer-baseline
    paths:
      - .github/workflows/apply-provider-compat-list-actions.yml

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: performance-engine-v38-hotplayer-baseline

      - name: Apply patch
        run: python3 tooling/apply_provider_compat_and_list_actions.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/models/channel.dart lib/services/server_compatibility_service.dart lib/screens/player_screen.dart lib/providers/iptv_provider.dart lib/screens/home_screen.dart
          git commit -m "feat: improve provider compatibility and list management"
          git push origin HEAD:performance-engine-v38-hotplayer-baseline
