name: Fix premium player slider

on:
  push:
    branches:
      - performance-engine-v38-hotplayer-baseline
    paths:
      - tooling/fix_premium_player_slider.py
      - .github/workflows/fix-premium-player-slider.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: performance-engine-v38-hotplayer-baseline
          fetch-depth: 0

      - name: Apply slider fix
        run: python3 tooling/fix_premium_player_slider.py

      - name: Commit player fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/widgets/live_video_view.dart
          git commit -m "fix: compile premium player VOD slider"
          git push origin HEAD:performance-engine-v38-hotplayer-baseline
