name: Promote TV FULL PRO V39 to Updater

on:
  push:
    branches:
      - android-tv-full-pro-clean-source
    paths:
      - '.github/promote-v39-to-updater-request.txt'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout stable source
        uses: actions/checkout@v4
        with:
          ref: android-tv-full-pro-clean-source
          fetch-depth: 0

      - name: Verify V39 build succeeded
        env:
          GH_TOKEN: ${{ github.token }}
          V39_RUN_ID: '34163392000'
        shell: bash
        run: |
          set -euo pipefail
          STATUS="$(gh run view "$V39_RUN_ID" --repo "$GITHUB_REPOSITORY" --json status --jq '.status')"
          CONCLUSION="$(gh run view "$V39_RUN_ID" --repo "$GITHUB_REPOSITORY" --json conclusion --jq '.conclusion // ""')"
          echo "V39 run: status=$STATUS conclusion=$CONCLUSION"
          test "$STATUS" = "completed"
          test "$CONCLUSION" = "success"

      - name: Download verified V39 APKs
        env:
          GH_TOKEN: ${{ github.token }}
          V39_RUN_ID: '34163392000'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v39
          gh run download "$V39_RUN_ID" --repo "$GITHUB_REPOSITORY" --name TV-FULL-PRO-V39-PHOTO-MATCH --dir /tmp/v39
          test -f /tmp/v39/TV-FULL-PRO-V39-ARM32.apk
          test -f /tmp/v39/TV-FULL-PRO-V39-ARM64.apk
          test -f /tmp/v39/TV-FULL-PRO-V39-ARM32.apk.signature.txt
          test -f /tmp/v39/TV-FULL-PRO-V39-ARM64.apk.signature.txt
          grep -qi '40de9b14a83adb7b070e316a241e7f5a7f5b1705fdc43b5f495b0e1e3fcab02a' /tmp/v39/TV-FULL-PRO-V39-ARM32.apk.signature.txt
          grep -qi '40de9b14a83adb7b070e316a241e7f5a7f5b1705fdc43b5f495b0e1e3fcab02a' /tmp/v39/TV-FULL-PRO-V39-ARM64.apk.signature.txt

      - name: Verify V39 source identity
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin ui/full-pro-photo-match-v39
          git show origin/ui/full-pro-photo-match-v39:pubspec.yaml | grep -q '^version: 1.4.7+39$'

      - name: Prepare stable APK metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          ARM32=/tmp/v39/TV-FULL-PRO-V39-ARM32.apk
          ARM64=/tmp/v39/TV-FULL-PRO-V39-ARM64.apk
          echo "arm32_sha=$(sha256sum "$ARM32" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "arm64_sha=$(sha256sum "$ARM64" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "arm32_size=$(stat -c '%s' "$ARM32")" >> "$GITHUB_OUTPUT"
          echo "arm64_size=$(stat -c '%s' "$ARM64")" >> "$GITHUB_OUTPUT"

      - name: Publish stable APK files
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/v39/TV-FULL-PRO-V39-ARM32.apk /tmp/v39/TV-FULL-PRO-ARM32.apk
          cp /tmp/v39/TV-FULL-PRO-V39-ARM64.apk /tmp/v39/TV-FULL-PRO-ARM64.apk

          BASE='https://github.com/luchozurita2019-ui/tvplayer/releases/download/tv-full-pro-latest'
          if gh release upload tv-full-pro-latest \
               /tmp/v39/TV-FULL-PRO-ARM32.apk \
               /tmp/v39/TV-FULL-PRO-ARM64.apk \
               --clobber --repo "$GITHUB_REPOSITORY"; then
            echo "base=$BASE" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          WORKTREE="$(mktemp -d)"
          git worktree add --detach "$WORKTREE" HEAD
          cd "$WORKTREE"
          git checkout --orphan tv-full-apk-stable-next
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/v39/TV-FULL-PRO-ARM32.apk TV-FULL-PRO-ARM32.apk
          cp /tmp/v39/TV-FULL-PRO-ARM64.apk TV-FULL-PRO-ARM64.apk
          git add TV-FULL-PRO-ARM32.apk TV-FULL-PRO-ARM64.apk
          git commit -m 'TV FULL PRO 1.4.7+39 stable APKs'
          git push --force origin HEAD:tv-full-apk-stable
          BASE='https://raw.githubusercontent.com/luchozurita2019-ui/tvplayer/tv-full-apk-stable'
          curl -L --fail --silent --show-error --range 0-32 "$BASE/TV-FULL-PRO-ARM32.apk" >/dev/null
          curl -L --fail --silent --show-error --range 0-32 "$BASE/TV-FULL-PRO-ARM64.apk" >/dev/null
          echo "base=$BASE" >> "$GITHUB_OUTPUT"

      - name: Promote validated V39 source and updater manifest
        env:
          PUBLIC_BASE: ${{ steps.publish.outputs.base }}
          ARM32_SHA: ${{ steps.meta.outputs.arm32_sha }}
          ARM64_SHA: ${{ steps.meta.outputs.arm64_sha }}
          ARM32_SIZE: ${{ steps.meta.outputs.arm32_size }}
          ARM64_SIZE: ${{ steps.meta.outputs.arm64_size }}
        shell: bash
        run: |
          set -euo pipefail
          git checkout android-tv-full-pro-clean-source
          git reset --hard origin/android-tv-full-pro-clean-source
          git fetch origin ui/full-pro-photo-match-v39
          git checkout origin/ui/full-pro-photo-match-v39 -- lib pubspec.yaml test/interface
          grep -q '^version: 1.4.7+39$' pubspec.yaml

          cat > tv_full_installer/latest.json <<EOF
          {
            "versionName": "1.4.7",
            "versionCode": 39,
            "packageName": "com.tvfull.pro.tv.v10safe",
            "certificateSha256": "40de9b14a83adb7b070e316a241e7f5a7f5b1705fdc43b5f495b0e1e3fcab02a",
            "arm32": {
              "url": "$PUBLIC_BASE/TV-FULL-PRO-ARM32.apk",
              "sha256": "$ARM32_SHA",
              "size": $ARM32_SIZE
            },
            "arm64": {
              "url": "$PUBLIC_BASE/TV-FULL-PRO-ARM64.apk",
              "sha256": "$ARM64_SHA",
              "size": $ARM64_SIZE
            }
          }
          EOF

          printf '%s\n' \
            'TV FULL PRO 1.4.7+39 promoted to stable updater.' \
            'verified_build_run=34163392000' \
            "arm32_sha256=$ARM32_SHA" \
            "arm64_sha256=$ARM64_SHA" \
            > .github/v39-updater-promoted.txt

          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib pubspec.yaml test/interface tv_full_installer/latest.json .github/v39-updater-promoted.txt
          git commit -m 'Promote TV FULL PRO 1.4.7+39 to stable updater'
          git push origin HEAD:android-tv-full-pro-clean-source

      - name: Verify public updater manifest
        env:
          ARM32_SHA: ${{ steps.meta.outputs.arm32_sha }}
          ARM64_SHA: ${{ steps.meta.outputs.arm64_sha }}
        shell: bash
        run: |
          set -euo pipefail
          URL='https://raw.githubusercontent.com/luchozurita2019-ui/tvplayer/android-tv-full-pro-clean-source/tv_full_installer/latest.json'
          for attempt in $(seq 1 20); do
            BODY="$(curl -L --fail --silent --show-error "$URL" || true)"
            if printf '%s' "$BODY" | grep -q '"versionCode": 39' && \
               printf '%s' "$BODY" | grep -q "$ARM32_SHA" && \
               printf '%s' "$BODY" | grep -q "$ARM64_SHA"; then
              echo 'Updater manifest 1.4.7+39 is public and verified.'
              exit 0
            fi
            sleep 5
          done
          echo 'Updater manifest was not observable after promotion.'
          exit 1
