name: Promote TV FULL PRO V38 to Updater

on:
  push:
    branches:
      - android-tv-full-pro-clean-source
    paths:
      - '.github/promote-v38-to-updater-request.txt'

permissions:
  contents: write
  actions: read

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout stable updater branch
        uses: actions/checkout@v4
        with:
          ref: android-tv-full-pro-clean-source
          fetch-depth: 0

      - name: Download exact verified V38 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/v38
          mkdir -p /tmp/v38
          gh run download 34620225215 --repo "$GITHUB_REPOSITORY" --name TV-FULL-PRO-V38-CANDIDATE --dir /tmp/v38
          test -f /tmp/v38/TV-FULL-PRO-V38-ARM32.apk
          test -f /tmp/v38/TV-FULL-PRO-V38-ARM64.apk
          test -f /tmp/v38/TV-FULL-PRO-V38-ARM32.apk.signature.txt
          test -f /tmp/v38/TV-FULL-PRO-V38-ARM64.apk.signature.txt
          test -f /tmp/v38/CANDIDATE-IDENTITY.txt

      - name: Verify exact V38 identity hashes sizes and historical certificate
        shell: bash
        run: |
          set -euo pipefail
          ARM32=/tmp/v38/TV-FULL-PRO-V38-ARM32.apk
          ARM64=/tmp/v38/TV-FULL-PRO-V38-ARM64.apk
          test "$(sha256sum "$ARM32" | awk '{print $1}')" = 'f35f777f69970c05908816bd81d2029358351fd5835c9aa75cc9a898874e525c'
          test "$(sha256sum "$ARM64" | awk '{print $1}')" = '4250e80c009943b0cb9e1211a7735474ea506edfd639546cf1839b202cbaf24c'
          test "$(stat -c '%s' "$ARM32")" = '34942221'
          test "$(stat -c '%s' "$ARM64")" = '38649143'
          grep -Fq 'Candidate: 1.4.6+38' /tmp/v38/CANDIDATE-IDENTITY.txt
          grep -Fq 'Preserves V37 LIVE/zapping/HLS/error/lifecycle/UI improvements' /tmp/v38/CANDIDATE-IDENTITY.txt
          grep -qi '40de9b14a83adb7b070e316a241e7f5a7f5b1705fdc43b5f495b0e1e3fcab02a' /tmp/v38/TV-FULL-PRO-V38-ARM32.apk.signature.txt
          grep -qi '40de9b14a83adb7b070e316a241e7f5a7f5b1705fdc43b5f495b0e1e3fcab02a' /tmp/v38/TV-FULL-PRO-V38-ARM64.apk.signature.txt
          cp "$ARM32" /tmp/v38/TV-FULL-PRO-ARM32.apk
          cp "$ARM64" /tmp/v38/TV-FULL-PRO-ARM64.apk

      - name: Publish V38 APK files to updater release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload tv-full-pro-latest \
            /tmp/v38/TV-FULL-PRO-ARM32.apk \
            /tmp/v38/TV-FULL-PRO-ARM64.apk \
            --clobber --repo "$GITHUB_REPOSITORY"

      - name: Publish V38 installer manifest only
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin android-tv-full-pro-clean-source
          git checkout android-tv-full-pro-clean-source
          git reset --hard origin/android-tv-full-pro-clean-source
          cat > tv_full_installer/latest.json <<'EOF'
          {
            "versionName": "1.4.6",
            "versionCode": 38,
            "packageName": "com.tvfull.pro.tv.v10safe",
            "certificateSha256": "40de9b14a83adb7b070e316a241e7f5a7f5b1705fdc43b5f495b0e1e3fcab02a",
            "arm32": {
              "url": "https://github.com/luchozurita2019-ui/tvplayer/releases/download/tv-full-pro-latest/TV-FULL-PRO-ARM32.apk",
              "sha256": "f35f777f69970c05908816bd81d2029358351fd5835c9aa75cc9a898874e525c",
              "size": 34942221
            },
            "arm64": {
              "url": "https://github.com/luchozurita2019-ui/tvplayer/releases/download/tv-full-pro-latest/TV-FULL-PRO-ARM64.apk",
              "sha256": "4250e80c009943b0cb9e1211a7735474ea506edfd639546cf1839b202cbaf24c",
              "size": 38649143
            }
          }
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tv_full_installer/latest.json
          git commit -m 'Publish TV FULL PRO 1.4.6+38 in stable installer'
          git push origin HEAD:android-tv-full-pro-clean-source

      - name: Verify public V38 installer
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST='https://raw.githubusercontent.com/luchozurita2019-ui/tvplayer/android-tv-full-pro-clean-source/tv_full_installer/latest.json'
          ARM32='https://github.com/luchozurita2019-ui/tvplayer/releases/download/tv-full-pro-latest/TV-FULL-PRO-ARM32.apk'
          ARM64='https://github.com/luchozurita2019-ui/tvplayer/releases/download/tv-full-pro-latest/TV-FULL-PRO-ARM64.apk'
          BODY=''
          for attempt in $(seq 1 20); do
            BODY="$(curl -L --fail --silent --show-error "$MANIFEST" || true)"
            if printf '%s' "$BODY" | grep -q '"versionCode": 38'; then
              break
            fi
            sleep 3
          done
          printf '%s' "$BODY" | grep -q '"versionName": "1.4.6"'
          printf '%s' "$BODY" | grep -q 'f35f777f69970c05908816bd81d2029358351fd5835c9aa75cc9a898874e525c'
          printf '%s' "$BODY" | grep -q '4250e80c009943b0cb9e1211a7735474ea506edfd639546cf1839b202cbaf24c'
          curl -L --fail --silent --show-error "$ARM32" -o /tmp/public-arm32.apk
          curl -L --fail --silent --show-error "$ARM64" -o /tmp/public-arm64.apk
          test "$(sha256sum /tmp/public-arm32.apk | awk '{print $1}')" = 'f35f777f69970c05908816bd81d2029358351fd5835c9aa75cc9a898874e525c'
          test "$(sha256sum /tmp/public-arm64.apk | awk '{print $1}')" = '4250e80c009943b0cb9e1211a7735474ea506edfd639546cf1839b202cbaf24c'
