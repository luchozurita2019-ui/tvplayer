name: Finalize TV FULL PRO Source Cleanup

on:
  workflow_dispatch:
  push:
    branches:
      - android-tv-full-pro-clean-source
    paths:
      - '.github/workflows/cleanup-tv-full-pro-source.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout clean source
        uses: actions/checkout@v4
        with:
          ref: android-tv-full-pro-clean-source

      - name: Record cleanup run id
        shell: bash
        run: |
          printf '%s\n' "$GITHUB_RUN_ID" > .github/last-cleanup-run.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/last-cleanup-run.txt
          git commit -m "Record final cleanup run $GITHUB_RUN_ID" || exit 0
          git push origin HEAD:android-tv-full-pro-clean-source

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Final source normalization
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/screens/xtream_series_screen.dart')
          text = path.read_text()
          text = text.replace('color: const Color(0xA6FFFFFF)', 'color: Color(0xA6FFFFFF)')
          text = text.replace('color: const Color(0x73FFFFFF)', 'color: Color(0x73FFFFFF)')
          path.write_text(text)
          PY
          dart format lib

      - name: Remove one-time cleanup machinery
        shell: bash
        run: |
          rm -f .github/last-cleanup-run.txt
          rm -f .github/workflows/cleanup-tv-full-pro-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A lib .github
          git diff --cached --check
          git commit -m "Finalize clean TV FULL PRO source"
          git push origin HEAD:android-tv-full-pro-clean-source
