name: Tune Xtream fast catalog v1

on:
  push:
    branches:
      - performance-engine-v38-hotplayer-baseline
    paths:
      - .github/workflows/tune-xtream-fast-catalog-v1.yml

permissions:
  contents: write

jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: performance-engine-v38-hotplayer-baseline
          fetch-depth: 0

      - name: Apply tuning
        run: python3 .github/scripts/tune_xtream_fast_catalog_v1.py

      - name: Verify tuning
        run: |
          git diff --check
          test "$(git diff --name-only | grep '^lib/' | wc -l | tr -d ' ')" = "1"
          grep -q "_writePreparedCache" lib/services/xtream_fast_catalog_service.dart
          grep -q "Duration(seconds: 6)" lib/services/xtream_fast_catalog_service.dart

      - name: Commit tuning and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/services/xtream_fast_catalog_service.dart
          git rm .github/scripts/tune_xtream_fast_catalog_v1.py
          git rm .github/workflows/tune-xtream-fast-catalog-v1.yml
          git commit -m "Tune fast Xtream cache persistence"
          git push origin HEAD:performance-engine-v38-hotplayer-baseline
