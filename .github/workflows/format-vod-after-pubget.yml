name: Format VOD After Pub Get

on:
  workflow_dispatch:
  push:
    branches:
      - android-tv-full-pro-clean-source
    paths:
      - '.github/workflows/format-vod-after-pubget.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout clean source
        uses: actions/checkout@v4
        with:
          ref: android-tv-full-pro-clean-source

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Format VOD with project language context
        run: dart format lib/screens/tv_full_vod_player_screen.dart

      - name: Remove one-off formatter and commit
        shell: bash
        run: |
          rm -f .github/workflows/format-vod-after-pubget.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/tv_full_vod_player_screen.dart .github/workflows/format-vod-after-pubget.yml
          git commit -m "Normalize VOD watchdog formatting after pub get"
          git push origin HEAD:android-tv-full-pro-clean-source
