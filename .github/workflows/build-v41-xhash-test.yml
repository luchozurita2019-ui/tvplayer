name: Build V41 X-Hash Compatibility Test

on:
  push:
    branches:
      - feature/dynamic-stream-resolver-v40-protocol-final
    paths:
      - '.github/v41-xhash-build-request.txt'

permissions:
  contents: write

env:
  BUILD_NAME: '1.4.9'
  BUILD_NUMBER: '41'
  CERT_SHA256: '40de9b14a83adb7b070e316a241e7f5a7f5b1705fdc43b5f495b0e1e3fcab02a'
  DYNAMIC_CONFIG: '{"name":"TV clásica 2","server":"http://tv.m3uts.xyz","username":"m","password":"m","catalogHeaders":{"User-Agent":"Dalvik/2.1.0"},"resolver":{"path":"/stream/gen/{id}","method":"POST","form":{"id":"{id}","cast":"false","device":"{androidId}","code":""}},"playbackHeaders":{"X-App":"di","X-Version":"10/1.0.9","User-Agent":"Magma Player/10"}}'

jobs:
  build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout protocol branch
        uses: actions/checkout@v4
        with:
          ref: feature/dynamic-stream-resolver-v40-protocol-final
          fetch-depth: 0

      - name: Load X-Hash test value from branch file
        shell: bash
        run: |
          set -euo pipefail
          test -s v41_xhash.txt
          normalized="$(tr '\r\n\t' '   ' < v41_xhash.txt | sed -E 's/^[[:space:]]*X-Hash:[[:space:]]*//' | awk '{print $1}')"
          test -n "$normalized"
          [[ "$normalized" != 'PEGAR_AQUI_SOLO_EL_X_HASH' ]]
          if [[ "$normalized" == X-Hash:* || "$normalized" == X-Did:* ]]; then
            echo 'X-Hash test value format is invalid.' >&2
            exit 1
          fi
          echo "::add-mask::$normalized"
          echo "TV_FULL_DYNAMIC_X_HASH_SANITIZED=$normalized" >> "$GITHUB_ENV"
          echo "X-Hash test value accepted (length=${#normalized})"

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze and test dynamic protocol
        shell: bash
        run: |
          set -euo pipefail
          flutter analyze --no-fatal-warnings --no-fatal-infos
          flutter test test/dynamic_stream_service_test.dart

      - name: Configure historical TV FULL signing
        shell: bash
        env:
          TV_FULL_KEYSTORE_BASE64: ${{ secrets.TV_FULL_KEYSTORE_BASE64 }}
          TV_FULL_KEYSTORE_PASSWORD: ${{ secrets.TV_FULL_KEYSTORE_PASSWORD }}
          TV_FULL_KEY_ALIAS: ${{ secrets.TV_FULL_KEY_ALIAS }}
          TV_FULL_KEY_PASSWORD: ${{ secrets.TV_FULL_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$TV_FULL_KEYSTORE_BASE64"
          test -n "$TV_FULL_KEYSTORE_PASSWORD"
          test -n "$TV_FULL_KEY_ALIAS"
          test -n "$TV_FULL_KEY_PASSWORD"
          printf '%s' "$TV_FULL_KEYSTORE_BASE64" | base64 --decode > android/tvfull-release.jks
          cat > android/key.properties <<EOF
          storeFile=tvfull-release.jks
          storePassword=$TV_FULL_KEYSTORE_PASSWORD
          keyAlias=$TV_FULL_KEY_ALIAS
          keyPassword=$TV_FULL_KEY_PASSWORD
          EOF

      - name: Build signed ARM32 and ARM64 APKs with X-Hash
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TV_FULL_DYNAMIC_X_HASH_SANITIZED"
          flutter build apk --release --split-per-abi \
            --target-platform android-arm,android-arm64 \
            --build-name="$BUILD_NAME" \
            --build-number="$BUILD_NUMBER" \
            --dart-define=TV_FULL_ANDROID_TV=true \
            --dart-define="TV_FULL_DYNAMIC_SOURCE_JSON=$DYNAMIC_CONFIG" \
            --dart-define="TV_FULL_DYNAMIC_X_HASH=$TV_FULL_DYNAMIC_X_HASH_SANITIZED"

      - name: Verify APK identity
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk artifact/TV-FULL-PRO-ARM32.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk artifact/TV-FULL-PRO-ARM64.apk
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          test -x "$AAPT"

          verify_apk() {
            local apk="$1"
            local expected_code="$2"
            "$APKSIGNER" verify --verbose --print-certs "$apk" > "$apk.signature.txt"
            local normalized
            normalized="$(tr -d ':' < "$apk.signature.txt" | tr '[:upper:]' '[:lower:]')"
            printf '%s' "$normalized" | grep -q "$CERT_SHA256"
            "$AAPT" dump badging "$apk" > "$apk.badging.txt"
            local package_line
            package_line="$(grep '^package:' "$apk.badging.txt" | head -n 1)"
            echo "$package_line"
            [[ "$package_line" == *"name='com.tvfull.pro.tv.v10safe'"* ]]
            [[ "$package_line" == *"versionName='1.4.9'"* ]]
            [[ "$package_line" == *"versionCode='$expected_code'"* ]]
          }

          verify_apk artifact/TV-FULL-PRO-ARM32.apk '1041'
          verify_apk artifact/TV-FULL-PRO-ARM64.apk '2041'

          echo "arm32_sha=$(sha256sum artifact/TV-FULL-PRO-ARM32.apk | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "arm64_sha=$(sha256sum artifact/TV-FULL-PRO-ARM64.apk | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "arm32_size=$(stat -c '%s' artifact/TV-FULL-PRO-ARM32.apk)" >> "$GITHUB_OUTPUT"
          echo "arm64_size=$(stat -c '%s' artifact/TV-FULL-PRO-ARM64.apk)" >> "$GITHUB_OUTPUT"

      - name: Publish isolated V41 X-Hash test release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="tv-full-pro-v41-xhash-test-${GITHUB_RUN_ID}"
          gh release create "$TAG" \
            artifact/TV-FULL-PRO-ARM32.apk \
            artifact/TV-FULL-PRO-ARM64.apk \
            --prerelease \
            --target feature/dynamic-stream-resolver-v40-protocol-final \
            --title 'TV FULL PRO 1.4.9+41 - X-Hash test' \
            --notes 'Compatibility test using provider-supplied X-Hash from isolated test branch. Same TV FULL package and historical signing certificate.'
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "base=https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}" >> "$GITHUB_OUTPUT"

      - name: Point official installer to V41 test
        env:
          PUBLIC_BASE: ${{ steps.publish.outputs.base }}
          ARM32_SHA: ${{ steps.meta.outputs.arm32_sha }}
          ARM64_SHA: ${{ steps.meta.outputs.arm64_sha }}
          ARM32_SIZE: ${{ steps.meta.outputs.arm32_size }}
          ARM64_SIZE: ${{ steps.meta.outputs.arm64_size }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin android-tv-full-pro-clean-source
          git checkout -B installer-v41-xhash-test origin/android-tv-full-pro-clean-source
          cat > tv_full_installer/latest.json <<EOF
          {
            "versionName": "1.4.9",
            "versionCode": 41,
            "packageName": "com.tvfull.pro.tv.v10safe",
            "certificateSha256": "$CERT_SHA256",
            "arm32": {
              "url": "$PUBLIC_BASE/TV-FULL-PRO-ARM32.apk",
              "sha256": "$ARM32_SHA",
              "size": $ARM32_SIZE
            },
            "arm64": {
              "url": "$PUBLIC_BASE/TV-FULL-PRO-ARM64.apk",
              "sha256": "$ARM64_SHA",
              "size": $ARM64_SIZE
            }
          }
          EOF
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tv_full_installer/latest.json
          git commit -m 'Point installer to V41 X-Hash compatibility test'
          git push origin HEAD:android-tv-full-pro-clean-source

      - name: Remove signing material
        if: always()
        run: rm -f android/key.properties android/tvfull-release.jks

      - name: Upload verification bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TV-FULL-PRO-V41-XHASH-TEST
          path: artifact/
          if-no-files-found: warn
          retention-days: 30
