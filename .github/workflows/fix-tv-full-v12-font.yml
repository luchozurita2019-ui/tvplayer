name: Fix TV FULL PRO +12 Font

on:
  push:
    branches:
      - android-tv-full-pro-clean-source
    paths:
      - '.github/workflows/fix-tv-full-v12-font.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TV FULL PRO source
        uses: actions/checkout@v4
        with:
          ref: android-tv-full-pro-clean-source

      - name: Use supported Flutter font weight
        run: |
          set -euo pipefail
          grep -q 'FontWeight.w750' lib/screens/xtream_series_screen.dart
          sed -i 's/FontWeight\.w750/FontWeight.w800/g' lib/screens/xtream_series_screen.dart
          grep -q 'FontWeight.w800' lib/screens/xtream_series_screen.dart
          if grep -q 'FontWeight.w750' lib/screens/xtream_series_screen.dart; then
            exit 1
          fi

      - name: Commit exact analyzer fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/xtream_series_screen.dart
          git commit -m "Fix Series poster font weight" || true
          git push origin HEAD:android-tv-full-pro-clean-source
