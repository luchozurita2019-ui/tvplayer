name: Build isolated V67 Installer

on:
  push:
    branches:
      - android-tv-full-pro-v67-isolated-installer
    paths:
      - 'tv_full_installer/**'
      - '.github/workflows/build-v67-isolated-installer.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout isolated installer branch
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configure installer signing
        shell: bash
        env:
          TV_FULL_KEYSTORE_BASE64: ${{ secrets.TV_FULL_KEYSTORE_BASE64 }}
          TV_FULL_KEYSTORE_PASSWORD: ${{ secrets.TV_FULL_KEYSTORE_PASSWORD }}
          TV_FULL_KEY_ALIAS: ${{ secrets.TV_FULL_KEY_ALIAS }}
          TV_FULL_KEY_PASSWORD: ${{ secrets.TV_FULL_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$TV_FULL_KEYSTORE_BASE64"
          test -n "$TV_FULL_KEYSTORE_PASSWORD"
          test -n "$TV_FULL_KEY_ALIAS"
          test -n "$TV_FULL_KEY_PASSWORD"
          umask 077
          printf '%s' "$TV_FULL_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tvfull-installer-test.jks"
          echo "TV_FULL_INSTALLER_KEYSTORE=$RUNNER_TEMP/tvfull-installer-test.jks" >> "$GITHUB_ENV"
          echo "TV_FULL_KEYSTORE_PASSWORD=$TV_FULL_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "TV_FULL_KEY_ALIAS=$TV_FULL_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "TV_FULL_KEY_PASSWORD=$TV_FULL_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build isolated installer
        run: gradle -p tv_full_installer --no-daemon clean assembleRelease

      - name: Verify isolated installer
        shell: bash
        run: |
          set -euo pipefail
          APK="tv_full_installer/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" | tee "$RUNNER_TEMP/installer.badging.txt"
          grep -Fq "package: name='com.tvfull.pro.installer.v67test'" "$RUNNER_TEMP/installer.badging.txt"
          mkdir -p artifact
          cp "$APK" artifact/TV-FULL-INSTALLER-V67-TEST.apk
          sha256sum artifact/TV-FULL-INSTALLER-V67-TEST.apk > artifact/SHA256SUMS.txt

      - name: Publish isolated installer release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="tv-full-installer-v67-isolated-test"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG"             artifact/TV-FULL-INSTALLER-V67-TEST.apk             artifact/SHA256SUMS.txt             --prerelease             --target "$GITHUB_SHA"             --title "TV FULL Installer TEST V67"             --notes "Installer aislado para pruebas V67. No modifica el Installer principal, que permanece en V50."

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: TV-FULL-INSTALLER-V67-TEST
          path: artifact/
          if-no-files-found: error
          retention-days: 14

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/tvfull-installer-test.jks"
