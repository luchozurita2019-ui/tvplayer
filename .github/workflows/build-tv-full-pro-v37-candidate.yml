name: Build TV FULL PRO V37 Candidate

on:
  push:
    branches:
      - candidate/v37-complete-improvements
    paths:
      - '.github/v37-build-request.txt'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout V37 candidate
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify exact candidate identity
        shell: bash
        run: |
          set -euo pipefail
          grep -qx 'version: 1.4.5+37' pubspec.yaml
          dart format --output=none --set-exit-if-changed lib
          flutter analyze
          flutter test

      - name: Configure historical release signing
        shell: bash
        env:
          TV_FULL_KEYSTORE_BASE64: ${{ secrets.TV_FULL_KEYSTORE_BASE64 }}
          TV_FULL_KEYSTORE_PASSWORD: ${{ secrets.TV_FULL_KEYSTORE_PASSWORD }}
          TV_FULL_KEY_ALIAS: ${{ secrets.TV_FULL_KEY_ALIAS }}
          TV_FULL_KEY_PASSWORD: ${{ secrets.TV_FULL_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$TV_FULL_KEYSTORE_BASE64"
          test -n "$TV_FULL_KEYSTORE_PASSWORD"
          test -n "$TV_FULL_KEY_ALIAS"
          test -n "$TV_FULL_KEY_PASSWORD"
          printf '%s' "$TV_FULL_KEYSTORE_BASE64" | base64 --decode > android/tvfull-release.jks
          cat > android/key.properties <<EOF
          storeFile=tvfull-release.jks
          storePassword=$TV_FULL_KEYSTORE_PASSWORD
          keyAlias=$TV_FULL_KEY_ALIAS
          keyPassword=$TV_FULL_KEY_PASSWORD
          EOF

      - name: Build signed ARM32 and ARM64 candidate APKs
        run: >-
          flutter build apk --release --split-per-abi
          --dart-define=TV_FULL_ANDROID_TV=true
          --target-platform android-arm,android-arm64

      - name: Verify package, certificate and hashes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk artifact/TV-FULL-PRO-V37-CANDIDATE-ARM32.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk artifact/TV-FULL-PRO-V37-CANDIDATE-ARM64.apk

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          for apk in artifact/*.apk; do
            "$APKSIGNER" verify --verbose --print-certs "$apk" > "$apk.signature.txt"
            grep -qi '40de9b14a83adb7b070e316a241e7f5a7f5b1705fdc43b5f495b0e1e3fcab02a' "$apk.signature.txt"
            sha256sum "$apk" > "$apk.sha256.txt"
          done

          printf '%s\n' \
            'TV FULL PRO V37 CANDIDATE' \
            'Base: V36 1.4.4+36 / 9766496746e877421fb1dd0a11130d867fd035ab' \
            'Candidate: 1.4.5+37' \
            'NOT PUBLISHED TO STABLE INSTALLER' \
            > artifact/CANDIDATE-IDENTITY.txt

      - name: Remove signing material
        if: always()
        run: rm -f android/key.properties android/tvfull-release.jks

      - name: Upload candidate APKs only
        uses: actions/upload-artifact@v4
        with:
          name: TV-FULL-PRO-V37-CANDIDATE
          path: artifact/
          if-no-files-found: error
          retention-days: 14
