name: Apply focused V3 patch

on:
  push:
    branches:
      - performance-engine-v3-network-fix-pro
    paths:
      - '.github/workflows/apply-v34-pro.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: performance-engine-v3-network-fix-pro
          fetch-depth: 0

      - name: Apply patch
        run: python3 tooling/apply_v34_patch.py

      - name: Remove temporary helpers
        run: |
          rm .github/workflows/apply-v34-pro.yml
          rm tooling/apply_v34_patch.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: stable playback with integrated live controls"
          git push origin HEAD:performance-engine-v3-network-fix-pro
