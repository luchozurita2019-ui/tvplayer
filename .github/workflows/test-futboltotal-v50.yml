name: Test Fútbol Total V62 integration

on:
  push:
    branches:
      - feature/v62-futboltotal-performance
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: dart analyze lib test

      - name: Test
        run: flutter test --no-pub --reporter expanded
