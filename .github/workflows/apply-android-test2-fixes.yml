name: Build Android Test 2

on:
  push:
    branches:
      - android-test2-fixes-patcher
    paths:
      - '.github/workflows/apply-android-test2-fixes.yml'

jobs:
  build-android-test2:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: performance-engine-v38-hotplayer-baseline

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze current source
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Generate Android project
        run: flutter create --platforms=android .

      - name: Allow Internet and HTTP IPTV providers
        shell: bash
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i '/<manifest/a\    <uses-permission android:name="android.permission.INTERNET" />' "$MANIFEST"
          fi
          if ! grep -q 'usesCleartextTraffic' "$MANIFEST"; then
            sed -i 's/<application/<application android:usesCleartextTraffic="true"/' "$MANIFEST"
          fi

      - name: Build release APK with one network retry
        shell: bash
        run: |
          for attempt in 1 2; do
            echo "Android build attempt $attempt"
            if flutter build apk --release; then
              exit 0
            fi
            if [ "$attempt" -eq 2 ]; then
              exit 1
            fi
            echo "Transient dependency download failure; retrying in 8 seconds..."
            sleep 8
          done

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/TV-FULL-PRO-Android-Test2.apk
          sha256sum dist/TV-FULL-PRO-Android-Test2.apk | tee dist/SHA256.txt

      - name: Upload Android Test 2
        uses: actions/upload-artifact@v4
        with:
          name: TV-FULL-PRO-Android-Test2
          path: dist/
          if-no-files-found: error
          retention-days: 30
