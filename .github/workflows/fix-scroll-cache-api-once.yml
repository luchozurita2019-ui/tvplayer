name: Fix Flutter Scroll Cache API Once

on:
  workflow_dispatch:
  push:
    branches:
      - android-tv-full-pro-clean-source
    paths:
      - '.github/workflows/fix-scroll-cache-api-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout clean source
        uses: actions/checkout@v4
        with:
          ref: android-tv-full-pro-clean-source

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Update ScrollCacheExtent API
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
              'lib/screens/android_media3_texture_player_screen.dart': ('scrollCacheExtent: 70,', 'scrollCacheExtent: const ScrollCacheExtent.pixels(70),'),
              'lib/screens/channel_list_screen.dart': ('scrollCacheExtent: 80,', 'scrollCacheExtent: const ScrollCacheExtent.pixels(80),'),
              'lib/screens/xtream_live_screen.dart': ('scrollCacheExtent: 80,', 'scrollCacheExtent: const ScrollCacheExtent.pixels(80),'),
              'lib/screens/xtream_movies_screen.dart': ('scrollCacheExtent: 90,', 'scrollCacheExtent: const ScrollCacheExtent.pixels(90),'),
              'lib/screens/xtream_series_screen.dart': ('scrollCacheExtent: 90,', 'scrollCacheExtent: const ScrollCacheExtent.pixels(90),'),
          }
          for path, (old, new) in replacements.items():
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one {old!r}')
              p.write_text(text.replace(old, new, 1))
          PY
          dart format lib

      - name: Persist source and remove this workflow
        shell: bash
        run: |
          rm -f .github/workflows/fix-scroll-cache-api-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A lib .github/workflows/fix-scroll-cache-api-once.yml
          git diff --cached --check
          git commit -m "Use Flutter ScrollCacheExtent API in TV FULL PRO"
          git push origin HEAD:android-tv-full-pro-clean-source
