name: Apply source portal patch

on:
  push:
    branches:
      - feature-source-types-v1
    paths:
      - '.github/workflows/apply-source-portal.yml'
      - 'tooling/apply_source_portal_patch.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature-source-types-v1
          fetch-depth: 0

      - name: Apply patch
        run: python3 tooling/apply_source_portal_patch.py

      - name: Remove temporary helpers
        run: rm tooling/apply_source_portal_patch.py .github/workflows/apply-source-portal.yml

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/home_screen.dart tooling/apply_source_portal_patch.py .github/workflows/apply-source-portal.yml
          git commit -m "feat: integrate IPTV source portal into home"
          git push origin HEAD:feature-source-types-v1
