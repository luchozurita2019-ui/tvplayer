name: Apply v40 catalog engine

on:
  push:
    branches: [ v40-catalog-engine-patcher ]
    paths:
      - '.github/workflows/v40-catalog-engine-patcher.yml'

permissions:
  contents: write

jobs:
  apply-v40:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patcher
        uses: actions/checkout@v4
        with:
          ref: v40-catalog-engine-patcher
          path: patcher

      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: performance-engine-v38-hotplayer-baseline
          fetch-depth: 0
          path: work

      - name: Guard expected baseline
        working-directory: work
        run: |
          test "$(git rev-parse HEAD)" = "eb549d45f18af84bfb5eae3fccf94ff36c116183" || {
            echo "Working branch moved unexpectedly; refusing to overwrite it."
            exit 1
          }

      - name: Apply v40 cleanup
        working-directory: work
        run: python3 ../patcher/.github/scripts/apply_v40.py

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Format and validate source
        working-directory: work
        run: |
          dart format \
            lib/services/artwork_cache_service.dart \
            lib/services/xtream_fast_catalog_service.dart
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
          git diff --check

      - name: Commit cleanup to working branch
        working-directory: work
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/services/artwork_cache_service.dart \
            lib/services/xtream_fast_catalog_service.dart
          git commit -m "Clean legacy artwork cache in v40"
          git push origin HEAD:performance-engine-v38-hotplayer-baseline
