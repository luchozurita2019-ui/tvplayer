name: Normalize TV FULL PRO Format After Pub Get Once

on:
  push:
    branches:
      - android-tv-full-pro-clean-source
    paths:
      - '.github/workflows/format-tv-full-pro-after-pubget-once.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout clean source
        uses: actions/checkout@v4
        with:
          ref: android-tv-full-pro-clean-source

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve project language version
        run: flutter pub get

      - name: Format with resolved project language version
        run: dart format lib

      - name: Persist formatting and lockfile
        shell: bash
        run: |
          rm -f .github/workflows/format-tv-full-pro-after-pubget-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A lib pubspec.lock .github/workflows/format-tv-full-pro-after-pubget-once.yml
          git diff --cached --check
          git commit -m "Normalize TV FULL PRO format after pub get"
          git push origin HEAD:android-tv-full-pro-clean-source
