name: Apply Stable Playback UI Patch

on:
  push:
    branches: [performance-engine-v3-stable-rebase]
    paths:
      - '.github/workflows/apply-stable-rebase.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: performance-engine-v3-stable-rebase
          fetch-depth: 0

      - name: Apply minimal patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/screens/player_screen.dart')
          s = p.read_text()

          marker = "import '../widgets/channel_tile.dart';"
          addition = "import '../widgets/stable_video_view.dart';"
          if addition not in s:
              s = s.replace(marker, marker + "\n" + addition)

          old = 'Video(controller: _controller),'
          new = 'StableVideoView(player: _player, controller: _controller),'
          if old not in s:
              raise SystemExit('No se encontró Video(controller: _controller) para reemplazar')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Remove temporary workflow
        run: rm .github/workflows/apply-stable-rebase.yml

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/player_screen.dart .github/workflows/apply-stable-rebase.yml
          git commit -m "player: keep V2 transport and add passive diagnostics UI"
          git push origin HEAD:performance-engine-v3-stable-rebase
