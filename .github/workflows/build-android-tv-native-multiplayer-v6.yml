name: Build Android TV V6 Native MultiPlayer

on:
  workflow_dispatch:
  push:
    branches:
      - android-tv-native-multiplayer-v6
    paths:
      - 'pubspec.yaml'
      - 'lib/**'
      - '.github/scripts/apply_mpv_android_baseline_v4.py'
      - '.github/scripts/apply_android_native_multiplayer_v6.py'
      - '.github/workflows/build-android-tv-native-multiplayer-v6.yml'

permissions:
  contents: read

jobs:
  build-android-tv-native-v6:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout V6 branch
        uses: actions/checkout@v4
        with:
          ref: android-tv-native-multiplayer-v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Preserve V4 MPV fallback for non-live content
        run: python3 .github/scripts/apply_mpv_android_baseline_v4.py

      - name: Generate Android project
        run: flutter create --platforms=android .

      - name: Remove generated template test
        run: rm -f test/widget_test.dart

      - name: Apply native Android MultiPlayer engine
        run: python3 .github/scripts/apply_android_native_multiplayer_v6.py

      - name: Format patched Dart source
        run: dart format lib/screens/player_screen.dart lib/screens/android_native_player_launcher.dart lib/services/remote_provisioning_service.dart

      - name: Analyze source
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Verify V6 architecture markers
        shell: bash
        run: |
          grep -q "AndroidNativePlayerLauncher" lib/screens/player_screen.dart
          grep -q "tvfull/native_player" lib/screens/android_native_player_launcher.dart
          grep -q "android-tv-native-multiplayer-v6" lib/services/remote_provisioning_service.dart
          grep -q 'androidx.media3:media3-exoplayer:1.8.0' android/app/build.gradle.kts
          grep -q 'nextlib-media3ext:1.8.0-0.9.0' android/app/build.gradle.kts
          grep -q 'class TvFullNativePlayerActivity' android/app/src/main/kotlin/com/example/iptv_player/TvFullNativePlayerActivity.kt
          grep -q 'MediaPlayer()' android/app/src/main/kotlin/com/example/iptv_player/TvFullNativePlayerActivity.kt
          grep -q 'NextRenderersFactory' android/app/src/main/kotlin/com/example/iptv_player/TvFullNativePlayerActivity.kt
          grep -q 'setVideoSurfaceHolder' android/app/src/main/kotlin/com/example/iptv_player/TvFullNativePlayerActivity.kt
          grep -q 'setBufferDurationsMs(2_000, 4_000, 1_000, 1_000)' android/app/src/main/kotlin/com/example/iptv_player/TvFullNativePlayerActivity.kt
          grep -q 'com.tvfull.pro.tv.v6native' android/app/build.gradle.kts

      - name: Build split release APKs
        run: flutter build apk --release --split-per-abi --dart-define=TV_FULL_ANDROID_TV=true

      - name: Verify APK package and signatures
        shell: bash
        run: |
          BUILD_TOOLS="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          AAPT="$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            echo "===== $apk ====="
            "$AAPT" dump badging "$apk" | head -10
            "$APKSIGNER" verify --verbose "$apk"
          done

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p artifact
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk artifact/TV-FULL-PRO-V6-NATIVE-ARM32.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk artifact/TV-FULL-PRO-V6-NATIVE-ARM64.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk artifact/TV-FULL-PRO-V6-NATIVE-X86_64.apk
          sha256sum artifact/*.apk > artifact/SHA256.txt
          git rev-parse HEAD > artifact/COMMIT.txt

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: TV-FULL-PRO-V6-NATIVE-MultiPlayer
          path: artifact/
          retention-days: 30
