name: Apply TV FULL PRO Premium LIVE v27

on:
  push:
    branches:
      - android-tv-full-pro-clean-source
    paths:
      - '.github/apply-premium-live-v27.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout TV FULL PRO source
        uses: actions/checkout@v4
        with:
          ref: android-tv-full-pro-clean-source
          fetch-depth: 0

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply premium LIVE v27
        run: python3 .github/scripts/apply_tv_full_premium_live_v27.py

      - name: Resolve dependencies
        run: flutter pub get

      - name: Format touched Dart files
        run: >-
          dart format
          lib/services/live_channel_usage_service.dart
          lib/widgets/tv_full_premium_ui.dart
          lib/widgets/tv_live_premium_catalog.dart
          lib/screens/channel_list_screen.dart
          lib/screens/xtream_live_screen.dart
          lib/screens/android_media3_texture_player_screen.dart
          test/live_channel_usage_service_test.dart

      - name: Verify touched-file formatting
        run: >-
          dart format --output=none --set-exit-if-changed
          lib/services/live_channel_usage_service.dart
          lib/widgets/tv_full_premium_ui.dart
          lib/widgets/tv_live_premium_catalog.dart
          lib/screens/channel_list_screen.dart
          lib/screens/xtream_live_screen.dart
          lib/screens/android_media3_texture_player_screen.dart
          test/live_channel_usage_service_test.dart

      - name: Check patch whitespace
        run: git diff --check

      - name: Static analysis
        run: flutter analyze

      - name: Run automated tests
        run: flutter test

      - name: Compile Android TV debug validation
        run: flutter build apk --debug --dart-define=TV_FULL_ANDROID_TV=true --target-platform android-arm,android-arm64

      - name: Verify v27 premium LIVE and safety guardrails
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'version: 1.3.5+27' pubspec.yaml
          grep -q 'premium-live-ui-v27' pubspec.yaml
          grep -q 'class TvLivePremiumCatalog' lib/widgets/tv_live_premium_catalog.dart
          grep -q 'Canales destacados' lib/widgets/tv_live_premium_catalog.dart
          grep -q 'Partidos y deportes' lib/widgets/tv_live_premium_catalog.dart
          grep -q 'class LiveChannelUsageService' lib/services/live_channel_usage_service.dart
          grep -q 'isSportsChannel' lib/services/live_channel_usage_service.dart
          grep -q 'tvFullLiveRed' lib/widgets/tv_full_premium_ui.dart
          grep -q 'TvFullLiveBadge' lib/screens/android_media3_texture_player_screen.dart
          grep -q 'Color(0x00000000)' lib/screens/android_media3_texture_player_screen.dart
          grep -q 'cacheWidth: 124' lib/screens/android_media3_texture_player_screen.dart
          grep -q 'deadCooldown = Duration(minutes: 10)' lib/services/channel_health_service.dart
          grep -q 'lista_clasica_logo_index.json' lib/services/channel_logo_resolver_service.dart
          ! grep -q 'iptv-org.github.io/api/logos.json' lib/services/channel_logo_resolver_service.dart
          grep -q 'LIVE_STARTUP_NO_PROGRESS_MS = 9000L' android/app/src/main/kotlin/com/example/iptv_player/MainActivity.kt
          grep -q 'MAX_LIVE_ENDED_RECOVERIES = 5' android/app/src/main/kotlin/com/example/iptv_player/MainActivity.kt
          grep -q 'connectTimeout(4, TimeUnit.SECONDS)' android/app/src/main/kotlin/com/example/iptv_player/MainActivity.kt
          grep -qi '40de9b14a83adb7b070e316a241e7f5a7f5b1705fdc43b5f495b0e1e3fcab02a' .github/workflows/build-tv-full-pro-clean.yml

      - name: Commit TV FULL PRO 1.3.5+27
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/services/live_channel_usage_service.dart \
            lib/widgets/tv_full_premium_ui.dart \
            lib/widgets/tv_live_premium_catalog.dart \
            lib/screens/channel_list_screen.dart \
            lib/screens/xtream_live_screen.dart \
            lib/screens/android_media3_texture_player_screen.dart \
            test/live_channel_usage_service_test.dart \
            pubspec.yaml
          git commit -m "TV FULL PRO 1.3.5+27: premium lightweight LIVE UI" || true
          git pull --rebase origin android-tv-full-pro-clean-source
          git push origin HEAD:android-tv-full-pro-clean-source
