name: Build Android TV V5 Media3 HotPlayer Baseline

on:
  workflow_dispatch:
  push:
    branches:
      - android-tv-media3-hotplayer-v5
    paths:
      - '.github/workflows/build-android-tv-panel-link-v2.yml'
      - '.github/scripts/apply_android_media3_hotplayer_v5.py'
      - 'lib/**'
      - 'pubspec.yaml'

permissions:
  contents: read

jobs:
  build-android-tv-media3-v5:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout V5 branch
        uses: actions/checkout@v4
        with:
          ref: android-tv-media3-hotplayer-v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Generate Android project
        run: flutter create --platforms=android .

      - name: Remove generated template test
        run: rm -f test/widget_test.dart

      - name: Apply native Media3 HotPlayer-style engine
        run: python3 .github/scripts/apply_android_media3_hotplayer_v5.py

      - name: Format patched Dart source
        run: dart format lib/screens/player_screen.dart lib/screens/android_media3_player_screen.dart lib/services/remote_provisioning_service.dart

      - name: Analyze source
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Verify Media3 V5 markers
        shell: bash
        run: |
          grep -q "class PlayerScreen extends StatelessWidget" lib/screens/player_screen.dart
          grep -q "AndroidMedia3PlayerScreen" lib/screens/player_screen.dart
          grep -q "tvfull/media3_player" lib/screens/android_media3_player_screen.dart
          grep -q "android-tv-media3-hotplayer-v5" lib/services/remote_provisioning_service.dart
          grep -q 'androidx.media3:media3-exoplayer:1.8.0' android/app/build.gradle.kts
          grep -q 'androidx.media3:media3-exoplayer-hls:1.8.0' android/app/build.gradle.kts
          grep -q 'nextlib-media3ext:1.8.0-0.9.0' android/app/build.gradle.kts
          grep -q 'setEnableDecoderFallback(true)' android/app/src/main/kotlin/*/*/*/MainActivity.kt
          grep -q 'EXTENSION_RENDERER_MODE_ON' android/app/src/main/kotlin/*/*/*/MainActivity.kt
          grep -q 'setBufferDurationsMs(5000, 15000, 2500, 1000)' android/app/src/main/kotlin/*/*/*/MainActivity.kt

      - name: Build split release APKs
        run: flutter build apk --release --split-per-abi --dart-define=TV_FULL_ANDROID_TV=true

      - name: Verify APK package and signatures
        shell: bash
        run: |
          BUILD_TOOLS="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          AAPT="$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            echo "===== $apk ====="
            "$AAPT" dump badging "$apk" | head -10
            "$APKSIGNER" verify --verbose "$apk"
          done

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p artifact
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk artifact/TV-FULL-PRO-V5-MEDIA3-ARM32.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk artifact/TV-FULL-PRO-V5-MEDIA3-ARM64.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk artifact/TV-FULL-PRO-V5-MEDIA3-X86_64.apk
          sha256sum artifact/*.apk > artifact/SHA256.txt
          git rev-parse HEAD > artifact/COMMIT.txt

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: TV-FULL-PRO-V5-MEDIA3-HotPlayer-Baseline
          path: artifact/
          retention-days: 30
