name: Apply v41 single-player guard

on:
  push:
    branches:
      - v41-single-player-guard-patcher

permissions:
  contents: write

jobs:
  patch-working-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patcher branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve patch script
        run: cp .github/scripts/apply_single_player_guard.py /tmp/apply_single_player_guard.py

      - name: Checkout working branch
        run: |
          git fetch origin performance-engine-v38-hotplayer-baseline
          git checkout -B performance-engine-v38-hotplayer-baseline origin/performance-engine-v38-hotplayer-baseline

      - name: Apply single-player route guard
        run: python3 /tmp/apply_single_player_guard.py

      - name: Validate patch
        run: |
          git diff --check
          grep -q 'bool _openingPlayer = false;' lib/screens/channel_list_screen.dart
          grep -q 'if (_openingPlayer) return;' lib/screens/channel_list_screen.dart
          grep -q 'finally {' lib/screens/channel_list_screen.dart

      - name: Commit and push working branch
        run: |
          if git diff --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/screens/channel_list_screen.dart
          git commit -m 'Prevent duplicate player routes'
          git push origin HEAD:performance-engine-v38-hotplayer-baseline
