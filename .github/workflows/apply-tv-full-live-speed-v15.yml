name: Apply TV FULL PRO Live Speed v15

on:
  workflow_dispatch:
  push:
    branches:
      - android-tv-full-pro-clean-source
    paths:
      - '.github/apply-live-speed-v15.txt'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout TV FULL PRO source
        uses: actions/checkout@v4
        with:
          ref: android-tv-full-pro-clean-source

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply 1.2.3+15 live-speed changes
        run: python .github/scripts/apply_tv_full_live_speed_v15.py

      - name: Resolve dependencies
        run: flutter pub get

      - name: Format Dart source
        run: dart format lib

      - name: Static analysis
        run: flutter analyze

      - name: Compile Android debug APK
        run: >-
          flutter build apk --debug
          --dart-define=TV_FULL_ANDROID_TV=true
          --target-platform android-arm64

      - name: Verify intended architecture
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'version: 1.2.3+15' pubspec.yaml
          grep -q 'LIVE_STARTUP_DEADLINE_MS = 4500L' android/app/src/main/kotlin/com/example/iptv_player/MainActivity.kt
          grep -q 'MAX_LIVE_ENDED_RECOVERIES = 1' android/app/src/main/kotlin/com/example/iptv_player/MainActivity.kt
          grep -q 'WIFI_MODE_FULL_HIGH_PERF' android/app/src/main/kotlin/com/example/iptv_player/MainActivity.kt
          grep -q "'bufferForPlayback': 1000" lib/screens/android_media3_texture_player_screen.dart
          grep -q 'setAudioTrack' android/app/src/main/kotlin/com/example/iptv_player/MainActivity.kt
          grep -q 'setSubtitleTrack' android/app/src/main/kotlin/com/example/iptv_player/MainActivity.kt
          git diff --check

      - name: Commit optimized source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            pubspec.yaml \
            lib/screens/android_media3_texture_player_screen.dart \
            android/app/src/main/kotlin/com/example/iptv_player/MainActivity.kt
          git commit -m "TV FULL PRO 1.2.3+15: optimize live zapping" || true
          git push origin HEAD:android-tv-full-pro-clean-source
