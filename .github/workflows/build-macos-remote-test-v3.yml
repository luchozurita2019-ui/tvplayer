name: Build macOS Remote Test V3

on:
  push:
    branches:
      - mac-remote-provisioning-v1
    paths:
      - '.github/scripts/apply_macos_remote_reregister_v3.py'
      - '.github/workflows/build-macos-remote-test-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos-remote-v3:
    runs-on: macos-latest
    steps:
      - name: Checkout macOS remote branch
        uses: actions/checkout@v4
        with:
          ref: mac-remote-provisioning-v1

      - name: Apply automatic re-registration fix
        run: python3 .github/scripts/apply_macos_remote_reregister_v3.py

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Format changed Dart files
        run: dart format lib/services/remote_provisioning_service.dart lib/providers/iptv_provider.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze source
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Verify functional diff scope
        run: |
          CHANGED=$(git diff --name-only)
          echo "$CHANGED"
          BAD=$(echo "$CHANGED" | grep -vE '^(lib/services/remote_provisioning_service\.dart|lib/providers/iptv_provider\.dart)$' || true)
          if [ -n "$BAD" ]; then
            echo "Unexpected changed files:"
            echo "$BAD"
            exit 1
          fi

      - name: Commit functional V3 integration
        run: |
          if git diff --quiet; then
            echo "No functional source changes to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib/services/remote_provisioning_service.dart lib/providers/iptv_provider.dart
            git commit -m "Recover deleted macOS remote device registration"
            git push origin HEAD:mac-remote-provisioning-v1
          fi

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Generate native macOS project
        run: flutter create --platforms=macos .

      - name: Brand application as TV FULL PRO
        run: |
          CONFIG=macos/Runner/Configs/AppInfo.xcconfig
          sed -i '' 's/^PRODUCT_NAME = .*/PRODUCT_NAME = TV FULL PRO/' "$CONFIG" || true
          echo "App config:"
          cat "$CONFIG"

      - name: Enable outgoing Internet access
        run: |
          for file in macos/Runner/DebugProfile.entitlements macos/Runner/Release.entitlements; do
            /usr/libexec/PlistBuddy -c "Add :com.apple.security.network.client bool true" "$file" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :com.apple.security.network.client true" "$file"
          done

      - name: Set macOS deployment target
        run: |
          sed -i '' 's/MACOSX_DEPLOYMENT_TARGET = 10.14/MACOSX_DEPLOYMENT_TARGET = 10.15/g' macos/Runner.xcodeproj/project.pbxproj || true

      - name: Build release app
        run: flutter build macos --release

      - name: Prepare application
        run: |
          mkdir -p dist
          APP_PATH=$(find build/macos/Build/Products/Release -maxdepth 1 -name "*.app" | head -n 1)
          echo "Application: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "No macOS .app was produced"
            exit 1
          fi
          cp -R "$APP_PATH" "dist/TV FULL PRO.app"

      - name: Create real PKG installer
        run: |
          pkgbuild \
            --component "dist/TV FULL PRO.app" \
            --install-location /Applications \
            --identifier com.tvfull.pro.remote.test \
            --version 1.0.0 \
            "dist/TV-FULL-PRO-macOS-Remote-Test-V3.pkg"

      - name: Create drag-and-drop DMG fallback
        run: |
          mkdir -p dmg-root
          cp -R "dist/TV FULL PRO.app" dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create \
            -volname "TV FULL PRO" \
            -srcfolder dmg-root \
            -ov \
            -format UDZO \
            "dist/TV-FULL-PRO-macOS-Remote-Test-V3.dmg"

      - name: SHA-256
        run: |
          shasum -a 256 "dist/TV-FULL-PRO-macOS-Remote-Test-V3.pkg"
          shasum -a 256 "dist/TV-FULL-PRO-macOS-Remote-Test-V3.dmg"

      - name: Upload macOS V3 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TV-FULL-PRO-macOS-Remote-Test-V3
          path: |
            dist/TV-FULL-PRO-macOS-Remote-Test-V3.pkg
            dist/TV-FULL-PRO-macOS-Remote-Test-V3.dmg
          if-no-files-found: error
