name: Apply TV FULL PRO V37 Candidate Improvements

on:
  push:
    branches:
      - candidate/v37-complete-improvements
    paths:
      - '.github/v37-apply-request.txt'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: candidate/v37-complete-improvements
          fetch-depth: 0

      - name: Apply verified V37 patch
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .github/v37_core.patch.gz.b64 | gzip -d > /tmp/v37.patch
          patch -p1 < /tmp/v37.patch
          grep -qx 'version: 1.4.5+37' pubspec.yaml

      - name: Commit candidate implementation and trigger isolated build
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            'TV FULL PRO V37 candidate build requested.' \
            'base=9766496746e877421fb1dd0a11130d867fd035ab' \
            'version=1.4.5+37' \
            'stable_installer=untouched' \
            > .github/v37-build-request.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            android/app/src/main/kotlin/com/example/iptv_player/MainActivity.kt \
            android/app/src/main/kotlin/com/example/iptv_player/TvFullLiveLoadErrorPolicy.kt \
            lib/screens/android_media3_texture_player_screen.dart \
            lib/screens/xtream_live_screen.dart \
            lib/widgets/tv_live_premium_catalog.dart \
            pubspec.yaml \
            .github/v37-build-request.txt
          git commit -m 'TV FULL PRO 1.4.5+37 candidate improvements from exact V36'
          git push origin HEAD:candidate/v37-complete-improvements
