name: Fix V3.8 completed guard

on:
  push:
    branches:
      - performance-engine-v38-hotplayer-baseline
    paths:
      - tooling/fix_v38_completed_guard.py
      - .github/workflows/fix-v38-completed-guard.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: performance-engine-v38-hotplayer-baseline
          fetch-depth: 0

      - name: Apply guard fix
        run: python3 tooling/fix_v38_completed_guard.py

      - name: Commit player fix only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/player_screen.dart
          git commit -m "fix: preserve live EOF recovery while buffering"
          git push origin HEAD:performance-engine-v38-hotplayer-baseline
