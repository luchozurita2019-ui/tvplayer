name: Apply V3.8 HotPlayer baseline

on:
  push:
    branches:
      - performance-engine-v38-hotplayer-baseline
    paths:
      - tooling/apply_v38_hotplayer_baseline.py
      - tooling/apply_v38_hotplayer_followup.py
      - .github/workflows/apply-v38-hotplayer-baseline.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: performance-engine-v38-hotplayer-baseline
          fetch-depth: 0

      - name: Apply V3.8 baseline patch
        run: |
          python3 tooling/apply_v38_hotplayer_baseline.py
          python3 tooling/apply_v38_hotplayer_followup.py

      - name: Keep workflow files untouched in bot commit
        run: git restore .github/workflows/validate-feature-source.yml

      - name: Commit engine changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/player_screen.dart lib/services/m3u_fetcher.dart lib/services/xtream_service.dart
          git commit -m "perf: align live playback with HotPlayer baseline"
          git push origin HEAD:performance-engine-v38-hotplayer-baseline
