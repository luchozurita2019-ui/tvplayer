name: Build TV FULL PRO Final

# Final-only release. Normal development pushes never create a release APK.
on:
  workflow_dispatch:
  push:
    branches:
      - android-tv-full-pro-clean-source
    paths:
      - '.github/final-build-request.txt'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout clean source
        uses: actions/checkout@v4
        with:
          ref: android-tv-full-pro-clean-source

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib

      - name: Analyze clean source
        run: flutter analyze

      - name: Verify TV FULL PRO architecture
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'TV FULL PRO' android/app/src/main/AndroidManifest.xml
          grep -q 'userLandscape' android/app/src/main/AndroidManifest.xml
          grep -q 'EnableImpeller' android/app/src/main/AndroidManifest.xml
          grep -q 'tvfull/device_identity' android/app/src/main/kotlin/com/example/iptv_player/MainActivity.kt
          grep -q 'NextRenderersFactory' android/app/src/main/kotlin/com/example/iptv_player/MainActivity.kt
          grep -q 'setEnableDecoderFallback(true)' android/app/src/main/kotlin/com/example/iptv_player/MainActivity.kt
          grep -q 'TvLocalStore' lib/providers/iptv_provider.dart
          grep -q 'sqflite' pubspec.yaml
          grep -q "hwdec: 'no'" lib/screens/tv_full_vod_player_screen.dart
          grep -q 'AndroidMedia3TexturePlayerScreen' lib/screens/player_screen.dart
          grep -q 'TvFullVodPlayerScreen' lib/screens/player_screen.dart
          grep -q '_resolveDirect(connection.streamServer, directSource)' lib/services/xtream_vod_service.dart
          grep -q 'hasReleaseSigning' android/app/build.gradle.kts

      - name: Configure persistent release signing
        shell: bash
        env:
          TV_FULL_KEYSTORE_BASE64: ${{ secrets.TV_FULL_KEYSTORE_BASE64 }}
          TV_FULL_KEYSTORE_PASSWORD: ${{ secrets.TV_FULL_KEYSTORE_PASSWORD }}
          TV_FULL_KEY_ALIAS: ${{ secrets.TV_FULL_KEY_ALIAS }}
          TV_FULL_KEY_PASSWORD: ${{ secrets.TV_FULL_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$TV_FULL_KEYSTORE_BASE64" || { echo 'Missing TV_FULL_KEYSTORE_BASE64 secret'; exit 1; }
          test -n "$TV_FULL_KEYSTORE_PASSWORD" || { echo 'Missing TV_FULL_KEYSTORE_PASSWORD secret'; exit 1; }
          test -n "$TV_FULL_KEY_ALIAS" || { echo 'Missing TV_FULL_KEY_ALIAS secret'; exit 1; }
          test -n "$TV_FULL_KEY_PASSWORD" || { echo 'Missing TV_FULL_KEY_PASSWORD secret'; exit 1; }

          printf '%s' "$TV_FULL_KEYSTORE_BASE64" | base64 --decode > android/tvfull-release.jks
          cat > android/key.properties <<EOF
          storeFile=tvfull-release.jks
          storePassword=$TV_FULL_KEYSTORE_PASSWORD
          keyAlias=$TV_FULL_KEY_ALIAS
          keyPassword=$TV_FULL_KEY_PASSWORD
          EOF

      - name: Build universal ARM Android TV APK
        run: >-
          flutter build apk --release
          --dart-define=TV_FULL_ANDROID_TV=true
          --target-platform android-arm,android-arm64

      - name: Prepare and verify final artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          cp build/app/outputs/flutter-apk/app-release.apk artifact/TV-FULL-PRO.apk
          sha256sum artifact/TV-FULL-PRO.apk | awk '{print $1}' > artifact/SHA256.txt
          printf '%s\n' "$GITHUB_SHA" > artifact/COMMIT.txt
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER" || { echo 'apksigner not found'; exit 1; }
          "$APKSIGNER" verify --verbose --print-certs artifact/TV-FULL-PRO.apk > artifact/SIGNATURE.txt

      - name: Publish stable latest APK URL
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=tv-full-pro-latest
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifact/TV-FULL-PRO.apk --clobber
          else
            gh release create "$TAG" artifact/TV-FULL-PRO.apk \
              --title "TV FULL PRO latest" \
              --notes "Canal estable para actualización manual de TV FULL PRO."
          fi

      - name: Remove signing material from runner workspace
        if: always()
        shell: bash
        run: rm -f android/key.properties android/tvfull-release.jks

      - name: Upload TV FULL PRO APK
        uses: actions/upload-artifact@v4
        with:
          name: TV-FULL-PRO
          path: artifact/
          if-no-files-found: error
          retention-days: 30

      - name: Record final build id and status
        if: always()
        shell: bash
        run: |
          git fetch origin android-tv-full-pro-clean-source
          git checkout android-tv-full-pro-clean-source
          git reset --hard origin/android-tv-full-pro-clean-source
          mkdir -p .github
          printf 'run_id=%s\nsource_commit=%s\nstatus=%s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" "${{ job.status }}" > .github/tv-full-pro-build.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/tv-full-pro-build.txt
          git commit -m "Record TV FULL PRO final build ${GITHUB_RUN_ID}" || true
          git push origin HEAD:android-tv-full-pro-clean-source
