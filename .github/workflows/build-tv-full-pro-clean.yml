name: Build TV FULL PRO Clean
# Clean source normalized and cacheExtent API verified.

on:
  workflow_dispatch:
  push:
    branches:
      - android-tv-full-pro-clean-source
    paths:
      - '.github/workflows/build-tv-full-pro-clean.yml'
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout clean source
        uses: actions/checkout@v4
        with:
          ref: android-tv-full-pro-clean-source

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib

      - name: Analyze clean source
        run: flutter analyze --no-fatal-infos

      - name: Verify TV FULL PRO architecture
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'TV FULL PRO' android/app/src/main/AndroidManifest.xml
          grep -q 'userLandscape' android/app/src/main/AndroidManifest.xml
          grep -q 'EnableImpeller' android/app/src/main/AndroidManifest.xml
          grep -q 'tvfull/device_identity' android/app/src/main/kotlin/com/example/iptv_player/MainActivity.kt
          grep -q 'NextRenderersFactory' android/app/src/main/kotlin/com/example/iptv_player/MainActivity.kt
          grep -q 'setEnableDecoderFallback(true)' android/app/src/main/kotlin/com/example/iptv_player/MainActivity.kt
          grep -q 'TvLocalStore' lib/providers/iptv_provider.dart
          grep -q 'sqflite' pubspec.yaml
          grep -q "hwdec: 'no'" lib/screens/tv_full_vod_player_screen.dart
          grep -q 'AndroidMedia3TexturePlayerScreen' lib/screens/player_screen.dart
          grep -q 'TvFullVodPlayerScreen' lib/screens/player_screen.dart
          grep -q '_resolveDirect(connection.streamServer, directSource)' lib/services/xtream_vod_service.dart

      - name: Build universal ARM Android TV APK
        run: >-
          flutter build apk --release
          --dart-define=TV_FULL_ANDROID_TV=true
          --target-platform android-arm,android-arm64

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p artifact
          cp build/app/outputs/flutter-apk/app-release.apk artifact/TV-FULL-PRO.apk
          sha256sum artifact/TV-FULL-PRO.apk | awk '{print $1}' > artifact/SHA256.txt
          printf '%s\n' "${GITHUB_SHA}" > artifact/COMMIT.txt

      - name: Upload TV FULL PRO APK
        uses: actions/upload-artifact@v4
        with:
          name: TV-FULL-PRO
          path: artifact/
          if-no-files-found: error
          retention-days: 30

      - name: Record run id and status
        if: always()
        shell: bash
        run: |
          git fetch origin android-tv-full-pro-clean-source
          git checkout android-tv-full-pro-clean-source
          git reset --hard origin/android-tv-full-pro-clean-source
          mkdir -p .github
          printf 'run_id=%s\nsource_commit=%s\nstatus=%s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" "${{ job.status }}" > .github/tv-full-pro-build.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/tv-full-pro-build.txt
          git commit -m "Record TV FULL PRO build ${GITHUB_RUN_ID} status" || true
          git push origin HEAD:android-tv-full-pro-clean-source
