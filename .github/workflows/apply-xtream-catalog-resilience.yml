name: Apply Xtream catalog resilience

on:
  push:
    branches:
      - performance-engine-v38-hotplayer-baseline
    paths:
      - .github/workflows/apply-xtream-catalog-resilience.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: performance-engine-v38-hotplayer-baseline
          fetch-depth: 0
      - name: Apply catalog patch
        run: python3 .github/scripts/apply_xtream_catalog_resilience.py
      - name: Verify diff
        run: git diff --check && git status --short
      - name: Commit patch and remove helpers
        shell: bash
        run: |
          rm .github/workflows/apply-xtream-catalog-resilience.yml
          rm .github/scripts/apply_xtream_catalog_resilience.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/services/xtream_vod_service.dart lib/screens/xtream_movies_screen.dart lib/services/xtream_series_service.dart .github/workflows/apply-xtream-catalog-resilience.yml .github/scripts/apply_xtream_catalog_resilience.py
          git commit -m "Improve Xtream movie fallback and category resilience"
          git push origin HEAD:performance-engine-v38-hotplayer-baseline
