name: Apply Panel Service Validation V5

on:
  push:
    branches:
      - remote-provisioning-panel-v1
    paths:
      - '.github/scripts/apply_panel_service_validation_v5.py'
      - '.github/workflows/apply-panel-service-validation-v5.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-panel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout panel branch
        uses: actions/checkout@v4
        with:
          ref: remote-provisioning-panel-v1
          fetch-depth: 0

      - name: Apply service validation patch
        run: python3 .github/scripts/apply_panel_service_validation_v5.py

      - name: Validate panel JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          text=Path('panel/index.html').read_text(encoding='utf-8')
          m=re.search(r'<script type="module">(.*?)</script>', text, re.S)
          if not m:
              raise SystemExit('module script not found')
          Path('/tmp/panel.mjs').write_text(m.group(1), encoding='utf-8')
          PY
          node --check /tmp/panel.mjs
          grep -q "tvf-service-validate" panel/index.html
          grep -q 'data-action="validate-service"' panel/index.html
          grep -q 'validation_status' panel/index.html
          grep -q 'Validar y guardar' panel/index.html

      - name: Commit patched panel
        run: |
          if git diff --quiet -- panel/index.html; then
            echo 'Panel already patched'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add panel/index.html
          git commit -m 'Validate services before enabling them'
          git push origin HEAD:remote-provisioning-panel-v1
