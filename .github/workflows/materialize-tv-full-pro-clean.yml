name: Materialize TV FULL PRO clean source

on:
  workflow_dispatch:
  push:
    branches:
      - android-tv-full-pro-clean-source
    paths:
      - '.github/workflows/materialize-tv-full-pro-clean.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: android-tv-full-pro-clean-source
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        run: flutter create --platforms=android .
      - name: Apply stable LIVE baseline once
        run: |
          python3 .github/scripts/apply_android_media3_texture_v6.py
          python3 .github/scripts/apply_android_media3_vod_v8.py
          python3 .github/scripts/apply_android_tv_clean_v9.py
          python3 .github/scripts/fix_android_tv_clean_v9_compile.py
          python3 .github/scripts/apply_android_tv_v10.py
          python3 .github/scripts/fix_android_tv_v10_compile.py
      - name: Format materialized source
        run: dart format lib
      - name: Persist clean source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib android pubspec.yaml pubspec.lock
          git commit -m "Materialize stable Android TV source for TV FULL PRO" || exit 0
          git push origin HEAD:android-tv-full-pro-clean-source
