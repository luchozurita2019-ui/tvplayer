name: Patch M3U cache and playback priority

on:
  workflow_dispatch:
  push:
    branches: [android-tv-full-pro-clean-source]
    paths: ['.github/workflows/patch-m3u-network-priority.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: android-tv-full-pro-clean-source
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Apply M3U performance patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # M3U fetcher: restartable browsing client, no retry after playback cancels browsing.
          p = Path('lib/services/m3u_fetcher.dart')
          s = p.read_text()
          s = s.replace(
              '  static final http.Client _client = http.Client();\n',
              '''  static http.Client _client = http.Client();\n  static int _generation = 0;\n\n  static void cancelBrowsingRequests() {\n    final previous = _client;\n    _client = http.Client();\n    _generation++;\n    previous.close();\n  }\n'''
          )
          s = s.replace(
              '  }) async {\n    Object? lastError;\n\n    for (var attempt = 0; attempt <= maxRetries; attempt++) {\n',
              '''  }) async {\n    final generation = _generation;\n    Object? lastError;\n\n    for (var attempt = 0; attempt <= maxRetries; attempt++) {\n      if (generation != _generation) {\n        throw const _BrowsingCancelledException();\n      }\n'''
          )
          for needle in [
              '      } on _BodyDownloadException catch (e) {\n',
              '      } on TimeoutException {\n',
              '      } on SocketException {\n',
              '      } on HttpException {\n',
              '      } on http.ClientException {\n',
          ]:
              if needle not in s:
                  raise SystemExit(f'M3U catch block missing: {needle!r}')
              if 'catch (e)' in needle:
                  repl = needle + "        if (generation != _generation) throw const _BrowsingCancelledException();\n"
              else:
                  repl = needle + "        if (generation != _generation) throw const _BrowsingCancelledException();\n"
              s = s.replace(needle, repl, 1)
          s += '''\nclass _BrowsingCancelledException implements Exception {\n  const _BrowsingCancelledException();\n  @override\n  String toString() => 'La actualización M3U fue pausada para priorizar la reproducción.';\n}\n'''
          p.write_text(s)

          # SQLite exposes snapshot freshness without decoding the whole payload.
          p = Path('lib/services/tv_local_store.dart')
          s = p.read_text()
          marker = '  Future<void> clearServiceCatalogs(String serviceId) async {\n'
          method = '''  Future<DateTime?> loadSnapshotUpdatedAt(\n    String serviceId,\n    String kind,\n  ) async {\n    final db = await database;\n    final rows = await db.query(\n      'catalog_snapshots',\n      columns: ['updated_at'],\n      where: 'service_id = ? AND kind = ?',\n      whereArgs: [serviceId, kind],\n      limit: 1,\n    );\n    if (rows.isEmpty) return null;\n    final raw = rows.first['updated_at'];\n    final millis = raw is int ? raw : int.tryParse(raw?.toString() ?? '');\n    if (millis == null || millis <= 0) return null;\n    return DateTime.fromMillisecondsSinceEpoch(millis);\n  }\n\n'''
          if marker not in s:
              raise SystemExit('TvLocalStore marker missing')
          s = s.replace(marker, method + marker)
          p.write_text(s)

          # M3U catalog: one in-flight download, persistent + in-memory freshness throttle.
          p = Path('lib/services/section_catalog_service.dart')
          s = p.read_text()
          s = s.replace(
              '''  final Map<String, Future<Map<TvSectionKind, SectionCatalogSnapshot>>>\n      _pending = {};\n''',
              '''  static const Duration _defaultFreshFor = Duration(minutes: 5);\n\n  final Map<String, Future<Map<TvSectionKind, SectionCatalogSnapshot>>>\n      _pending = {};\n  final Map<String, DateTime> _lastNetworkRefresh = {};\n'''
          )
          s = s.replace(
              '''  Future<Map<TvSectionKind, SectionCatalogSnapshot>> refreshAll(\n    Playlist playlist,\n  ) =>\n      _refreshAll(playlist, force: true);\n\n  Future<Map<TvSectionKind, SectionCatalogSnapshot>> _refreshAll(\n    Playlist playlist, {\n    bool force = false,\n  }) async {\n    final key = '${playlist.id}|${playlist.source}';\n    if (!force) {\n      final existing = _pending[key];\n      if (existing != null) return existing;\n    }\n''',
              '''  Future<Map<TvSectionKind, SectionCatalogSnapshot>> refreshAll(\n    Playlist playlist,\n  ) =>\n      _refreshAll(playlist);\n\n  Future<Map<TvSectionKind, SectionCatalogSnapshot>?> refreshIfStale(\n    Playlist playlist, {\n    Duration freshFor = _defaultFreshFor,\n  }) async {\n    final key = '${playlist.id}|${playlist.source}';\n    final pending = _pending[key];\n    if (pending != null) return pending;\n\n    final now = DateTime.now();\n    final memory = _lastNetworkRefresh[key];\n    if (memory != null && now.difference(memory) < freshFor) return null;\n\n    DateTime? persisted;\n    for (final kind in TvSectionKind.values) {\n      persisted = await _store.loadSnapshotUpdatedAt(\n        playlist.id,\n        'm3u_${kind.name}',\n      );\n      if (persisted != null) break;\n    }\n    if (persisted != null && now.difference(persisted) < freshFor) {\n      _lastNetworkRefresh[key] = persisted;\n      return null;\n    }\n    return _refreshAll(playlist);\n  }\n\n  Future<Map<TvSectionKind, SectionCatalogSnapshot>> _refreshAll(\n    Playlist playlist,\n  ) async {\n    final key = '${playlist.id}|${playlist.source}';\n    final existing = _pending[key];\n    if (existing != null) return existing;\n'''
          )
          s = s.replace(
              '''    for (final kind in TvSectionKind.values) {\n      final channels = List<Channel>.unmodifiable(buckets[kind]!);\n''',
              '''    _lastNetworkRefresh['${playlist.id}|${playlist.source}'] = DateTime.now();\n\n    for (final kind in TvSectionKind.values) {\n      final channels = List<Channel>.unmodifiable(buckets[kind]!);\n'''
          )
          p.write_text(s)

          # Cached M3U screens only refresh when stale; same provider order is retained.
          for filename in [
              'lib/screens/xtream_live_screen.dart',
              'lib/screens/xtream_movies_screen.dart',
              'lib/screens/xtream_series_screen.dart',
          ]:
              p = Path(filename)
              s = p.read_text()
              old = '''      final all = await SectionCatalogService.instance.refreshAll(\n        widget.playlist,\n      );\n'''
              new = '''      final all = await SectionCatalogService.instance.refreshIfStale(\n        widget.playlist,\n      );\n      if (all == null) return;\n'''
              if old not in s:
                  raise SystemExit(f'refreshAll block missing in {filename}')
              s = s.replace(old, new, 1)
              p.write_text(s)

          # Playback always wins over background M3U + Xtream + artwork.
          p = Path('lib/screens/player_screen.dart')
          s = p.read_text()
          s = s.replace(
              "import '../services/artwork_cache_service.dart';\n",
              "import '../services/artwork_cache_service.dart';\nimport '../services/m3u_fetcher.dart';\n"
          )
          s = s.replace(
              '''    ArtworkCacheService.instance.pauseForPlayback();\n    XtreamHttpClient.cancelBrowsingRequests();\n''',
              '''    ArtworkCacheService.instance.pauseForPlayback();\n    XtreamHttpClient.cancelBrowsingRequests();\n    M3uFetcher.cancelBrowsingRequests();\n'''
          )
          p.write_text(s)
          PY
          flutter pub get
          dart format lib/services/m3u_fetcher.dart lib/services/tv_local_store.dart lib/services/section_catalog_service.dart lib/screens/xtream_live_screen.dart lib/screens/xtream_movies_screen.dart lib/screens/xtream_series_screen.dart lib/screens/player_screen.dart
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-m3u-network-priority.yml
          git add lib/services/m3u_fetcher.dart lib/services/tv_local_store.dart lib/services/section_catalog_service.dart lib/screens/xtream_live_screen.dart lib/screens/xtream_movies_screen.dart lib/screens/xtream_series_screen.dart lib/screens/player_screen.dart
          git commit -m "Prioritize playback and throttle M3U refreshes"
          git push origin HEAD:android-tv-full-pro-clean-source
