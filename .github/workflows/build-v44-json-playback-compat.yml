name: Build V45 JSON Playback Compatibility Test

on:
  push:
    branches:
      - experiment/json-playback-compat-v44
    paths:
      - 'tool/apply_transport_compat_v44.py'
      - '.github/workflows/build-v44-json-playback-compat.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  BUILD_NAME: '1.4.13'
  BUILD_NUMBER: '45'
  CERT_SHA256: '40de9b14a83adb7b070e316a241e7f5a7f5b1705fdc43b5f495b0e1e3fcab02a'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout experiment
        uses: actions/checkout@v4
        with:
          ref: experiment/json-playback-compat-v44
          fetch-depth: 0

      - name: Load JSON catalog URL
        shell: bash
        run: |
          set -euo pipefail
          test -s v43_json_catalog_url.txt
          value="$(tr -d '\r\n' < v43_json_catalog_url.txt)"
          test -n "$value"
          echo "TV_FULL_JSON_CATALOG_URL=$value" >> "$GITHUB_ENV"

      - name: Apply JSON catalog integration
        run: python3 tool/apply_json_remote_patch.py

      - name: Apply transport compatibility
        run: python3 tool/apply_transport_compat_v44.py

      - name: Add DASH module and improve source detection
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          gradle = Path('android/app/build.gradle.kts')
          text = gradle.read_text(encoding='utf-8')
          marker = '    implementation("androidx.media3:media3-exoplayer-hls:1.8.0")\n'
          if 'media3-exoplayer-dash:1.8.0' not in text:
              if marker not in text:
                  raise SystemExit('HLS dependency marker not found')
              text = text.replace(marker, marker + '    implementation("androidx.media3:media3-exoplayer-dash:1.8.0")\n', 1)
          gradle.write_text(text, encoding='utf-8')

          catalog = Path('lib/services/json_catalog_service.dart')
          text = catalog.read_text(encoding='utf-8')
          old = """        final cleanPath = parsed.path.toLowerCase();
          final streamType = cleanPath.endsWith('.mpd') || rawType == 'DASH'
              ? 'dash'
              : cleanPath.endsWith('.m3u8') || rawType == 'HLS'
                  ? 'hls'
                  : null;
          """
          new = """        final fullUrl = parsed.toString().toLowerCase();
          final streamType = fullUrl.contains('.mpd') || rawType == 'DASH'
              ? 'dash'
              : fullUrl.contains('.m3u8') || rawType == 'HLS'
                  ? 'hls'
                  : null;
          """
          if old not in text:
              raise SystemExit('stream detection marker not found')
          catalog.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Configure historical TV FULL signing
        shell: bash
        env:
          TV_FULL_KEYSTORE_BASE64: ${{ secrets.TV_FULL_KEYSTORE_BASE64 }}
          TV_FULL_KEYSTORE_PASSWORD: ${{ secrets.TV_FULL_KEYSTORE_PASSWORD }}
          TV_FULL_KEY_ALIAS: ${{ secrets.TV_FULL_KEY_ALIAS }}
          TV_FULL_KEY_PASSWORD: ${{ secrets.TV_FULL_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$TV_FULL_KEYSTORE_BASE64"
          test -n "$TV_FULL_KEYSTORE_PASSWORD"
          test -n "$TV_FULL_KEY_ALIAS"
          test -n "$TV_FULL_KEY_PASSWORD"
          printf '%s' "$TV_FULL_KEYSTORE_BASE64" | base64 --decode > android/tvfull-release.jks
          cat > android/key.properties <<EOF
          storeFile=tvfull-release.jks
          storePassword=$TV_FULL_KEYSTORE_PASSWORD
          keyAlias=$TV_FULL_KEY_ALIAS
          keyPassword=$TV_FULL_KEY_PASSWORD
          EOF

      - name: Build signed ARM32 and ARM64 APKs
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --release --split-per-abi \
            --target-platform android-arm,android-arm64 \
            --build-name="$BUILD_NAME" \
            --build-number="$BUILD_NUMBER" \
            --dart-define=TV_FULL_ANDROID_TV=true \
            --dart-define="TV_FULL_JSON_CATALOG_URL=$TV_FULL_JSON_CATALOG_URL"

      - name: Verify APK identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk artifact/TV-FULL-PRO-V45-ARM32.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk artifact/TV-FULL-PRO-V45-ARM64.apk
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          for apk in artifact/*.apk; do
            "$APKSIGNER" verify --verbose --print-certs "$apk" > "$apk.signature.txt"
            normalized="$(tr -d ':' < "$apk.signature.txt" | tr '[:upper:]' '[:lower:]')"
            printf '%s' "$normalized" | grep -q "$CERT_SHA256"
            "$AAPT" dump badging "$apk" > "$apk.badging.txt"
            grep -q "name='com.tvfull.pro.tv.v10safe'" "$apk.badging.txt"
            grep -q "versionName='1.4.13'" "$apk.badging.txt"
          done

      - name: Publish V45 experiment release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="tv-full-pro-v45-json-playback-${GITHUB_RUN_ID}"
          gh release create "$TAG" \
            artifact/TV-FULL-PRO-V45-ARM32.apk \
            artifact/TV-FULL-PRO-V45-ARM64.apk \
            --prerelease \
            --target experiment/json-playback-compat-v44 \
            --title 'TV FULL PRO 1.4.13+45 - DASH playback compatibility' \
            --notes 'Experimental compatibility build: adds the Media3 DASH module and improves HLS/DASH detection when the manifest extension is embedded in a generated URL. Installer is intentionally not changed.'

      - name: Remove signing material
        if: always()
        run: rm -f android/key.properties android/tvfull-release.jks

      - name: Upload verification bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TV-FULL-PRO-V45-JSON-PLAYBACK
          path: artifact/
          if-no-files-found: warn
          retention-days: 30
