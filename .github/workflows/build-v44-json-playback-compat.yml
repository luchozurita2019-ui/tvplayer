name: Build V46 Clean TV FULL

on:
  push:
    branches:
      - experiment/json-playback-compat-v44
    paths:
      - '.github/workflows/build-v44-json-playback-compat.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  BUILD_NAME: '1.4.14'
  BUILD_NUMBER: '46'
  CERT_SHA256: '40de9b14a83adb7b070e316a241e7f5a7f5b1705fdc43b5f495b0e1e3fcab02a'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout clean main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze clean build
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Configure historical TV FULL signing
        shell: bash
        env:
          TV_FULL_KEYSTORE_BASE64: ${{ secrets.TV_FULL_KEYSTORE_BASE64 }}
          TV_FULL_KEYSTORE_PASSWORD: ${{ secrets.TV_FULL_KEYSTORE_PASSWORD }}
          TV_FULL_KEY_ALIAS: ${{ secrets.TV_FULL_KEY_ALIAS }}
          TV_FULL_KEY_PASSWORD: ${{ secrets.TV_FULL_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$TV_FULL_KEYSTORE_BASE64"
          test -n "$TV_FULL_KEYSTORE_PASSWORD"
          test -n "$TV_FULL_KEY_ALIAS"
          test -n "$TV_FULL_KEY_PASSWORD"
          printf '%s' "$TV_FULL_KEYSTORE_BASE64" | base64 --decode > android/tvfull-release.jks
          cat > android/key.properties <<EOF
          storeFile=tvfull-release.jks
          storePassword=$TV_FULL_KEYSTORE_PASSWORD
          keyAlias=$TV_FULL_KEY_ALIAS
          keyPassword=$TV_FULL_KEY_PASSWORD
          EOF

      - name: Build signed ARM32 and ARM64 APKs
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --release --split-per-abi \
            --target-platform android-arm,android-arm64 \
            --build-name="$BUILD_NAME" \
            --build-number="$BUILD_NUMBER" \
            --dart-define=TV_FULL_ANDROID_TV=true

      - name: Verify APK identity
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk artifact/TV-FULL-PRO-V46-ARM32.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk artifact/TV-FULL-PRO-V46-ARM64.apk
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          for apk in artifact/*.apk; do
            "$APKSIGNER" verify --verbose --print-certs "$apk" > "$apk.signature.txt"
            normalized="$(tr -d ':' < "$apk.signature.txt" | tr '[:upper:]' '[:lower:]')"
            printf '%s' "$normalized" | grep -q "$CERT_SHA256"
            "$AAPT" dump badging "$apk" > "$apk.badging.txt"
            grep -q "name='com.tvfull.pro.tv.v10safe'" "$apk.badging.txt"
            grep -q "versionName='1.4.14'" "$apk.badging.txt"
          done
          echo "arm32_sha=$(sha256sum artifact/TV-FULL-PRO-V46-ARM32.apk | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "arm64_sha=$(sha256sum artifact/TV-FULL-PRO-V46-ARM64.apk | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "arm32_size=$(stat -c '%s' artifact/TV-FULL-PRO-V46-ARM32.apk)" >> "$GITHUB_OUTPUT"
          echo "arm64_size=$(stat -c '%s' artifact/TV-FULL-PRO-V46-ARM64.apk)" >> "$GITHUB_OUTPUT"

      - name: Publish V46 clean release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="tv-full-pro-v46-clean-${GITHUB_RUN_ID}"
          gh release create "$TAG" \
            artifact/TV-FULL-PRO-V46-ARM32.apk \
            artifact/TV-FULL-PRO-V46-ARM64.apk \
            --prerelease \
            --target main \
            --title 'TV FULL PRO 1.4.14+46 - Clean' \
            --notes 'Clean build from main. No Lista clasica 2, no temporary JSON catalog integration, and no experimental provider wiring.'

      - name: Remove signing material
        if: always()
        run: rm -f android/key.properties android/tvfull-release.jks

      - name: Upload verification bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TV-FULL-PRO-V46-CLEAN
          path: artifact/
          if-no-files-found: warn
          retention-days: 30
