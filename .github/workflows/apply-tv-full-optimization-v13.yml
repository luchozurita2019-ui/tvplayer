name: Apply TV FULL PRO +13 Optimization

on:
  workflow_dispatch:
  push:
    branches:
      - android-tv-full-pro-clean-source
    paths:
      - '.github/scripts/apply_tv_full_optimization_v13.py'
      - '.github/workflows/apply-tv-full-optimization-v13.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TV FULL PRO source
        uses: actions/checkout@v4
        with:
          ref: android-tv-full-pro-clean-source

      - name: Apply performance optimization
        run: python3 .github/scripts/apply_tv_full_optimization_v13.py

      - name: Verify prepared source markers
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'version: 1.2.1+13' pubspec.yaml
          grep -q 'class CatalogIndex' lib/services/catalog_index.dart
          grep -q 'getDeviceProfile' android/app/src/main/kotlin/com/example/iptv_player/MainActivity.kt
          grep -q 'DevicePerformanceService' lib/widgets/cached_artwork_image.dart
          grep -q 'loadSource' lib/services/catalog_file_store.dart
          grep -q '_decodeFileSource' lib/services/section_catalog_service.dart
          grep -q '_scheduleSearch' lib/screens/xtream_live_screen.dart
          grep -q '_scheduleSearch' lib/screens/xtream_movies_screen.dart
          grep -q '_scheduleSearch' lib/screens/xtream_series_screen.dart

      - name: Commit optimized source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Workflows are updated separately by the authorized connector. The
          # app bot only commits app/source files so GitHub never rejects push.
          git restore .github/workflows/build-tv-full-pro-clean.yml
          git add pubspec.yaml lib android/app/src/main/kotlin/com/example/iptv_player/MainActivity.kt
          git commit -m "Optimize TV FULL PRO catalogs artwork and low RAM profile" || true
          git push origin HEAD:android-tv-full-pro-clean-source
