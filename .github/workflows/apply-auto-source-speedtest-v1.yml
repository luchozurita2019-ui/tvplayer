name: Apply auto source and speed test v1

on:
  push:
    branches:
      - performance-engine-v38-hotplayer-baseline
    paths:
      - .github/workflows/apply-auto-source-speedtest-v1.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: performance-engine-v38-hotplayer-baseline
          fetch-depth: 0
      - name: Apply patch
        run: python3 tooling/apply_auto_source_speedtest_v1.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/providers/iptv_provider.dart lib/services/xtream_service.dart lib/screens/add_source_screen.dart lib/screens/playback_settings_screen.dart
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: auto detect Xtream links and add internet speed test"
          git push origin HEAD:performance-engine-v38-hotplayer-baseline
