name: Apply TV FULL PRO Live Stability v20

on:
  push:
    branches:
      - android-tv-full-pro-clean-source
    paths:
      - '.github/apply-live-stability-v20.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout TV FULL PRO source
        uses: actions/checkout@v4
        with:
          ref: android-tv-full-pro-clean-source

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply live stability v20
        run: python3 .github/scripts/apply_tv_full_live_stability_v20.py

      - name: Resolve dependencies
        run: flutter pub get

      - name: Format Dart source
        run: dart format lib

      - name: Static analysis
        run: flutter analyze

      - name: Compile Android debug validation
        run: flutter build apk --debug --dart-define=TV_FULL_ANDROID_TV=true --target-platform android-arm,android-arm64

      - name: Verify stability profile and architecture
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'version: 1.2.8+20' pubspec.yaml
          grep -q "'minBuffer': lowRam ? 4000 : 5000" lib/screens/android_media3_texture_player_screen.dart
          grep -q "'maxBuffer': lowRam ? 12000 : 15000" lib/screens/android_media3_texture_player_screen.dart
          grep -q "'bufferForPlayback': 1000" lib/screens/android_media3_texture_player_screen.dart
          grep -q "'bufferForPlaybackAfterRebuffer': lowRam ? 2200 : 2500" lib/screens/android_media3_texture_player_screen.dart
          grep -q 'LIVE_STARTUP_DEADLINE_MS = 4500L' android/app/src/main/kotlin/com/example/iptv_player/MainActivity.kt
          grep -q 'LIVE_RECOVERY_DEADLINE_MS = 4500L' android/app/src/main/kotlin/com/example/iptv_player/MainActivity.kt
          grep -q 'LIVE_BUFFER_STALL_MS = 6500L' android/app/src/main/kotlin/com/example/iptv_player/MainActivity.kt
          grep -q 'MAX_LIVE_STALL_RECOVERIES = 2' android/app/src/main/kotlin/com/example/iptv_player/MainActivity.kt
          grep -q 'setConnectTimeoutMs(if (isLive) 4000 else 12000)' android/app/src/main/kotlin/com/example/iptv_player/MainActivity.kt
          grep -q 'setReadTimeoutMs(if (isLive) 10000 else 30000)' android/app/src/main/kotlin/com/example/iptv_player/MainActivity.kt
          grep -q 'Soft reconnect' android/app/src/main/kotlin/com/example/iptv_player/MainActivity.kt
          grep -q 'setMediaSource(source)' android/app/src/main/kotlin/com/example/iptv_player/MainActivity.kt
          grep -q 'AndroidMedia3TexturePlayerScreen' lib/screens/player_screen.dart

      - name: Commit live stability v20
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib android/app/src/main/kotlin/com/example/iptv_player/MainActivity.kt pubspec.yaml pubspec.lock
          git commit -m "TV FULL PRO 1.2.8+20: improve live stability on weak servers" || true
          git push origin HEAD:android-tv-full-pro-clean-source
