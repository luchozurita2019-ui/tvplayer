name: Build TV FULL proveedor 2

on:
  push:
    branches:
      - feature/tvfull-proveedor-2-json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: dart analyze lib test

      - name: Tests
        run: flutter test --no-pub --reporter expanded

      - name: Build APK
        run: flutter build apk --release --dart-define=TV_FULL_ANDROID_TV=true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tvfull-proveedor-2-test-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
