name: Format TV FULL PRO Once

on:
  push:
    branches:
      - android-tv-full-pro-clean-source
    paths:
      - '.github/workflows/format-tv-full-pro-once.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout clean source
        uses: actions/checkout@v4
        with:
          ref: android-tv-full-pro-clean-source

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Format clean Dart source
        run: dart format lib

      - name: Persist formatting and remove formatter
        shell: bash
        run: |
          rm -f .github/workflows/format-tv-full-pro-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A lib .github/workflows/format-tv-full-pro-once.yml
          git diff --cached --check
          git commit -m "Format TV FULL PRO clean source with Dart 3.13"
          git push origin HEAD:android-tv-full-pro-clean-source
