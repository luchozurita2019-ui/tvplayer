name: Apply V3.7.1 live playback fix

on:
  push:
    branches:
      - performance-engine-v37-compatibility
    paths:
      - tooling/apply_v371_live_fix.py
      - .github/workflows/apply-v371-live-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: performance-engine-v37-compatibility

      - name: Apply V3.7.1 patch
        run: python3 tooling/apply_v371_live_fix.py

      - name: Commit fixes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/widgets/live_video_view.dart lib/screens/channel_list_screen.dart lib/screens/player_screen.dart
          git commit -m "fix: separate live timeline and avoid replay after stalls"
          git push origin performance-engine-v37-compatibility
