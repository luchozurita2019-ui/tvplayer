name: Deploy TV FULL Panel

on:
  push:
    branches:
      - remote-provisioning-panel-v1
    paths:
      - 'panel/**'
      - '.github/scripts/apply_panel_customer_delete_v4.py'
      - '.github/scripts/apply_panel_service_validation_v5.py'
      - '.github/scripts/apply_panel_payment_status_v6.py'
      - '.github/scripts/apply_panel_update_v8.py'
      - '.github/workflows/deploy-tv-full-panel.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: tv-full-panel-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout panel branch
        uses: actions/checkout@v6

      - name: Enable customer deletion
        run: python3 .github/scripts/apply_panel_customer_delete_v4.py

      - name: Enable service validation
        run: python3 .github/scripts/apply_panel_service_validation_v5.py

      - name: Enable payment status
        run: python3 .github/scripts/apply_panel_payment_status_v6.py

      - name: Add TV FULL PRO update control
        run: python3 .github/scripts/apply_panel_update_v8.py

      - name: Validate panel JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          text=Path('panel/index.html').read_text(encoding='utf-8')
          m=re.search(r'<script type="module">(.*?)</script>', text, re.S)
          if not m:
              raise SystemExit('module script not found in panel/index.html')
          Path('/tmp/panel.mjs').write_text(m.group(1), encoding='utf-8')
          PY
          node --check /tmp/panel.mjs
          grep -q 'data-action="delete-customer"' panel/index.html
          grep -q 'data-action="validate-service"' panel/index.html
          grep -q 'tvf-service-validate' panel/index.html
          grep -q 'Validar y guardar' panel/index.html
          grep -q 'access_status' panel/index.html
          grep -q 'access_state' panel/index.html
          grep -q 'Falta de pago' panel/index.html
          grep -q 'deviceStatusBadge' panel/index.html
          grep -q 'data-route="updates"' panel/index.html
          grep -q 'function renderUpdates' panel/index.html
          grep -q 'tvf-update' panel/index.html
          grep -q 'Mostrar actualización' panel/index.html
          if grep -q 'Validador de listas' panel/index.html; then
            echo 'Playlist validator must not be deployed'
            exit 1
          fi
          if grep -q 'data-route="tivimate"' panel/index.html; then
            echo 'TiviMate route must not be deployed'
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload panel artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './panel'

      - name: Deploy panel
        id: deployment
        uses: actions/deploy-pages@v4
