name: Deploy TV FULL Panel

on:
  push:
    branches:
      - remote-provisioning-panel-v1
    paths:
      - 'panel/**'
      - '.github/scripts/apply_panel_customer_delete_v4.py'
      - '.github/scripts/apply_panel_service_validation_v5.py'
      - '.github/scripts/apply_panel_payment_status_v6.py'
      - '.github/scripts/apply_panel_update_v8.py'
      - '.github/scripts/apply_panel_service_expiry_v9.py'
      - '.github/workflows/deploy-tv-full-panel.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: tv-full-panel-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout panel branch
        uses: actions/checkout@v6

      - name: Enable customer deletion
        run: python3 .github/scripts/apply_panel_customer_delete_v4.py

      - name: Enable service validation
        run: python3 .github/scripts/apply_panel_service_validation_v5.py

      - name: Enable payment status
        run: python3 .github/scripts/apply_panel_payment_status_v6.py

      - name: Add TV FULL PRO update control
        run: python3 .github/scripts/apply_panel_update_v8.py

      - name: Add automatic service expiry warnings
        run: python3 .github/scripts/apply_panel_service_expiry_v9.py

      - name: Validate panel JavaScript and guardrails
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('panel/index.html')
          text = path.read_text(encoding='utf-8')
          module = re.search(r'<script type="module">(.*?)</script>', text, re.S)
          if not module:
              raise SystemExit('module script not found in panel/index.html')
          Path('/tmp/panel.mjs').write_text(module.group(1), encoding='utf-8')

          required = {
              'customer deletion': 'data-action="delete-customer"',
              'service validation action': 'data-action="validate-service"',
              'service validation backend': 'tvf-service-validate',
              'service save validation': 'Validar y guardar',
              'expiry helper': 'function serviceExpiryInfo(service)',
              'expiry warning copy': 'Las listas que vencen dentro de 7 días',
              'automatic expiry copy': 'se completa automáticamente',
              'expired row style': 'service-row-expired',
              'payment access column': 'access_status',
              'payment selector': 'access_state',
              'payment due copy': 'Falta de pago',
              'device payment badge': 'deviceStatusBadge',
              'updates route': 'data-route="updates"',
              'updates renderer': 'function renderUpdates',
              'update backend': 'tvf-update',
              'update control': 'Mostrar actualización',
          }
          missing = [label for label, marker in required.items() if marker not in text]
          if missing:
              raise SystemExit('Missing panel guardrails: ' + ', '.join(missing))

          forbidden = {
              'playlist validator navigation': 'Validador de listas',
              'TiviMate route': 'data-route="tivimate"',
          }
          present = [label for label, marker in forbidden.items() if marker in text]
          if present:
              raise SystemExit('Forbidden panel modules present: ' + ', '.join(present))
          if Path('panel/validator.html').exists():
              raise SystemExit('validator.html must not be deployed')
          PY
          node --check /tmp/panel.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload panel artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './panel'

      - name: Deploy panel
        id: deployment
        uses: actions/deploy-pages@v4
