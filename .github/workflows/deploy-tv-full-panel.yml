name: Deploy TV FULL Panel

on:
  push:
    branches:
      - remote-provisioning-panel-v1
    paths:
      - 'panel/**'
      - '.github/workflows/deploy-tv-full-panel.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: tv-full-panel-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout panel branch
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload panel artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './panel'

      - name: Deploy panel
        id: deployment
        uses: actions/deploy-pages@v4
