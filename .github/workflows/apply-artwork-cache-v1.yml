name: Apply artwork cache experiment

on:
  push:
    branches:
      - performance-engine-v38-hotplayer-baseline
    paths:
      - tooling/apply_artwork_cache_v1.py
      - .github/workflows/apply-artwork-cache-v1.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: performance-engine-v38-hotplayer-baseline
          fetch-depth: 0

      - name: Apply artwork cache experiment
        run: python3 tooling/apply_artwork_cache_v1.py

      - name: Commit code changes only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/services/artwork_cache_service.dart \
                  lib/widgets/cached_artwork_image.dart \
                  lib/widgets/channel_tile.dart \
                  lib/screens/channel_list_screen.dart \
                  lib/screens/player_screen.dart \
                  lib/screens/home_screen.dart
          git commit -m "perf: cache artwork and pause image traffic during playback"
          git push origin HEAD:performance-engine-v38-hotplayer-baseline
