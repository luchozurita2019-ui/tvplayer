name: Apply Xtream idle timeout and artwork fix

on:
  push:
    branches:
      - performance-engine-v38-hotplayer-baseline
    paths:
      - .github/workflows/apply-xtream-idle-timeout-artwork-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: performance-engine-v38-hotplayer-baseline
          fetch-depth: 0

      - name: Apply fix
        run: python3 .github/scripts/apply_xtream_idle_timeout_artwork_fix.py

      - name: Verify intended changes
        run: |
          git diff --check
          git diff -- lib/services/xtream_vod_service.dart lib/widgets/cached_artwork_image.dart lib/screens/xtream_movies_screen.dart

      - name: Commit fix and remove temporary helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/services/xtream_vod_service.dart lib/widgets/cached_artwork_image.dart lib/screens/xtream_movies_screen.dart
          git rm .github/scripts/apply_xtream_idle_timeout_artwork_fix.py
          git rm .github/workflows/apply-xtream-idle-timeout-artwork-fix.yml
          git commit -m "Fix Xtream idle timeout and empty movie details"
          git push origin HEAD:performance-engine-v38-hotplayer-baseline
