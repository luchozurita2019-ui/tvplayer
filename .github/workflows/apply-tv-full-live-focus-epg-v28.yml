name: Apply TV FULL PRO LIVE Focus EPG v28

on:
  push:
    branches:
      - android-tv-full-pro-clean-source
    paths:
      - '.github/apply-live-focus-epg-v28.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout TV FULL PRO source
        uses: actions/checkout@v4
        with:
          ref: android-tv-full-pro-clean-source
          fetch-depth: 0

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply focused LIVE and lazy EPG v28
        run: python3 .github/scripts/apply_tv_full_live_focus_epg_v28.py

      - name: Resolve dependencies
        run: flutter pub get

      - name: Format touched Dart files
        run: >-
          dart format
          lib/services/live_epg_service.dart
          lib/widgets/tv_live_premium_catalog.dart
          lib/screens/xtream_live_screen.dart
          test/live_epg_service_test.dart

      - name: Verify formatting
        run: >-
          dart format --output=none --set-exit-if-changed
          lib/services/live_epg_service.dart
          lib/widgets/tv_live_premium_catalog.dart
          lib/screens/xtream_live_screen.dart
          test/live_epg_service_test.dart

      - name: Check patch whitespace
        run: git diff --check

      - name: Static analysis
        run: flutter analyze

      - name: Run automated tests
        run: flutter test

      - name: Compile Android TV debug validation
        run: flutter build apk --debug --dart-define=TV_FULL_ANDROID_TV=true --target-platform android-arm,android-arm64

      - name: Verify v28 UI, EPG and performance guardrails
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'version: 1.3.6+28' pubspec.yaml
          grep -q 'live-focus-now-next-v28' pubspec.yaml
          ! grep -q 'Canales destacados' lib/widgets/tv_live_premium_catalog.dart
          ! grep -q 'Agregar a favoritos' lib/widgets/tv_live_premium_catalog.dart
          grep -q "'AHORA'" lib/widgets/tv_live_premium_catalog.dart
          grep -q "'DESPUÉS'" lib/widgets/tv_live_premium_catalog.dart
          grep -q 'programGuideLoader' lib/widgets/tv_live_premium_catalog.dart
          grep -q 'get_short_epg' lib/services/live_epg_service.dart
          grep -q "'limit': '2'" lib/services/live_epg_service.dart
          grep -q 'Duration(milliseconds: 220)' lib/widgets/tv_live_premium_catalog.dart
          grep -q 'live_epg_service.dart' lib/screens/xtream_live_screen.dart
          grep -q 'loadXtreamNowNext' lib/screens/xtream_live_screen.dart
          grep -q 'deadCooldown = Duration(minutes: 10)' lib/services/channel_health_service.dart
          grep -q 'LIVE_STARTUP_NO_PROGRESS_MS = 9000L' android/app/src/main/kotlin/com/example/iptv_player/MainActivity.kt
          grep -q 'MAX_LIVE_ENDED_RECOVERIES = 5' android/app/src/main/kotlin/com/example/iptv_player/MainActivity.kt
          grep -q 'connectTimeout(4, TimeUnit.SECONDS)' android/app/src/main/kotlin/com/example/iptv_player/MainActivity.kt
          ! grep -q 'iptv-org.github.io/api/logos.json' lib/services/channel_logo_resolver_service.dart
          ! grep -q 'package:http' lib/services/channel_logo_resolver_service.dart

      - name: Commit TV FULL PRO 1.3.6+28
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/services/live_epg_service.dart \
            lib/widgets/tv_live_premium_catalog.dart \
            lib/screens/xtream_live_screen.dart \
            test/live_epg_service_test.dart \
            pubspec.yaml
          git commit -m "TV FULL PRO 1.3.6+28: simplify LIVE and add lazy now-next EPG" || true
          git pull --rebase origin android-tv-full-pro-clean-source
          git push origin HEAD:android-tv-full-pro-clean-source
