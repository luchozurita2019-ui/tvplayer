name: Apply V38 Clean Performance Once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-v38-clean-performance-once.yml'

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact trigger commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove product base is approved V37
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin stable/v37-approved-exact:refs/remotes/origin/stable/v37-approved-exact
          unexpected="$(git diff --name-only origin/stable/v37-approved-exact "$GITHUB_SHA" | grep -v '^\.github/' || true)"
          if [ -n "$unexpected" ]; then
            echo 'ERROR: main product differs from approved V37 before V38 patch:'
            echo "$unexpected"
            exit 1
          fi

      - name: Normalize one intentional two-match replacement
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/apply_v38_clean_performance.py')
          s = p.read_text()
          old = """    count = text.count(old)\n    if count != 1:\n        raise SystemExit(f'{label}: expected exactly 1 match, found {count}')\n    file.write_text(text.replace(old, new, 1))\n"""
          new = """    count = text.count(old)\n    if label == 'live transfer retry keeps generation':\n        if count != 2:\n            raise SystemExit(f'{label}: expected exactly 2 matches, found {count}')\n        file.write_text(text.replace(old, new, 2))\n        return\n    if label == 'live body retry keeps generation' and count == 0:\n        return\n    if count != 1:\n        raise SystemExit(f'{label}: expected exactly 1 match, found {count}')\n    file.write_text(text.replace(old, new, 1))\n"""
          if old not in s:
              raise SystemExit('patch runner helper shape changed unexpectedly')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Apply deterministic V38 patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/apply_v38_clean_performance.py
          git restore --source="$GITHUB_SHA" -- .github/scripts/apply_v38_clean_performance.py

      - name: Enforce performance-only scope
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only "$GITHUB_SHA" | sort)
          printf '%s\n' "${changed[@]}"
          allowed='^(android/app/src/main/kotlin/com/example/iptv_player/MainActivity\.kt|android/app/src/main/kotlin/com/example/iptv_player/TvFullLiveLoadErrorPolicy\.kt|lib/screens/android_media3_texture_player_screen\.dart|lib/services/live_playback_error_policy\.dart|lib/services/xtream_http_client\.dart|lib/services/xtream_fast_catalog_service\.dart|lib/services/xtream_live_fast_service\.dart|pubspec\.yaml|test/live_playback_error_policy_test\.dart|test/xtream_http_client_generation_test\.dart)$'
          for file in "${changed[@]}"; do
            if ! [[ "$file" =~ $allowed ]]; then
              echo "ERROR: out-of-scope file changed: $file"
              exit 1
            fi
          done
          if printf '%s\n' "${changed[@]}" | grep -Eq '(^lib/widgets/|source_content_screen|dashboard|cinematic|filtered|tv_full_installer|assets/)'; then
            echo 'ERROR: UI/installer/assets change detected.'
            exit 1
          fi
          grep -q '^version: 1.4.6+38$' pubspec.yaml
          git diff --check

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Format only changed Dart files
        run: |
          dart format \
            lib/screens/android_media3_texture_player_screen.dart \
            lib/services/live_playback_error_policy.dart \
            lib/services/xtream_http_client.dart \
            lib/services/xtream_fast_catalog_service.dart \
            lib/services/xtream_live_fast_service.dart \
            test/live_playback_error_policy_test.dart \
            test/xtream_http_client_generation_test.dart
          git diff --check

      - name: Flutter analyze
        run: flutter analyze

      - name: Full test suite
        run: flutter test

      - name: Android debug build ARM split
        run: flutter build apk --debug --split-per-abi

      - name: Final scope proof after formatting/build
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only "$GITHUB_SHA" | sort)
          printf '%s\n' "${changed[@]}"
          allowed='^(android/app/src/main/kotlin/com/example/iptv_player/MainActivity\.kt|android/app/src/main/kotlin/com/example/iptv_player/TvFullLiveLoadErrorPolicy\.kt|lib/screens/android_media3_texture_player_screen\.dart|lib/services/live_playback_error_policy\.dart|lib/services/xtream_http_client\.dart|lib/services/xtream_fast_catalog_service\.dart|lib/services/xtream_live_fast_service\.dart|pubspec\.yaml|test/live_playback_error_policy_test\.dart|test/xtream_http_client_generation_test\.dart)$'
          for file in "${changed[@]}"; do
            if ! [[ "$file" =~ $allowed ]]; then
              echo "ERROR: final out-of-scope file changed: $file"
              exit 1
            fi
          done
          if printf '%s\n' "${changed[@]}" | grep -Eq '(^lib/widgets/|source_content_screen|dashboard|cinematic|filtered|tv_full_installer|assets/)'; then
            echo 'ERROR: final UI/installer/assets change detected.'
            exit 1
          fi

      - name: Commit validated V38 product files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            android/app/src/main/kotlin/com/example/iptv_player/MainActivity.kt \
            android/app/src/main/kotlin/com/example/iptv_player/TvFullLiveLoadErrorPolicy.kt \
            lib/screens/android_media3_texture_player_screen.dart \
            lib/services/live_playback_error_policy.dart \
            lib/services/xtream_http_client.dart \
            lib/services/xtream_fast_catalog_service.dart \
            lib/services/xtream_live_fast_service.dart \
            pubspec.yaml \
            test/live_playback_error_policy_test.dart \
            test/xtream_http_client_generation_test.dart
          git diff --cached --name-only
          git commit -m 'TV FULL PRO 1.4.6+38 performance and playback reliability'
          git push origin HEAD:main

      - name: Upload V38 test APKs
        uses: actions/upload-artifact@v4
        with:
          name: TV-FULL-PRO-V38-CLEAN-DEBUG
          path: |
            build/app/outputs/flutter-apk/app-armeabi-v7a-debug.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
          retention-days: 14
