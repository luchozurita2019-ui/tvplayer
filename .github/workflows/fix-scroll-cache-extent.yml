name: Fix Scroll Cache Extent

on:
  workflow_dispatch:
  push:
    branches:
      - android-tv-full-pro-clean-source
    paths:
      - '.github/workflows/fix-scroll-cache-extent.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout clean source
        uses: actions/checkout@v4
        with:
          ref: android-tv-full-pro-clean-source

      - name: Apply Flutter 3.47 scroll cache API
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [
              'lib/screens/android_media3_texture_player_screen.dart',
              'lib/screens/channel_list_screen.dart',
              'lib/screens/xtream_live_screen.dart',
              'lib/screens/xtream_movies_screen.dart',
              'lib/screens/xtream_series_screen.dart',
          ]

          for name in files:
              path = Path(name)
              text = path.read_text()
              if "package:flutter/rendering.dart" not in text:
                  marker = "import 'package:flutter/material.dart';\n"
                  if marker not in text:
                      raise SystemExit(f'Missing material import in {name}')
                  text = text.replace(
                      marker,
                      marker + "import 'package:flutter/rendering.dart';\n",
                      1,
                  )
              text, count = re.subn(
                  r'cacheExtent:\s*([0-9]+(?:\.[0-9]+)?),',
                  r'scrollCacheExtent: const ScrollCacheExtent.pixels(\1),',
                  text,
              )
              if count == 0:
                  raise SystemExit(f'No cacheExtent found in {name}')
              path.write_text(text)
          PY

      - name: Remove one-off fixer and commit
        shell: bash
        run: |
          rm -f .github/workflows/fix-scroll-cache-extent.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens .github/workflows/fix-scroll-cache-extent.yml
          git commit -m "Use Flutter 3.47 scrollCacheExtent API"
          git push origin HEAD:android-tv-full-pro-clean-source
