name: Apply Xtream series episode resolver v1

on:
  push:
    branches:
      - performance-engine-v38-hotplayer-baseline
    paths:
      - tooling/fix_xtream_series_episode_source_v1.py
      - .github/workflows/apply-xtream-series-episode-source-v1.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: performance-engine-v38-hotplayer-baseline
      - name: Apply patch
        run: python tooling/fix_xtream_series_episode_source_v1.py
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/services/xtream_series_service.dart
          git commit -m "fix: honor Xtream series direct source and container"
          git push
