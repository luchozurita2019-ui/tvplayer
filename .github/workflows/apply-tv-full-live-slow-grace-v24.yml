name: Apply TV FULL PRO Live Slow Grace v24

on:
  push:
    branches:
      - android-tv-full-pro-clean-source
    paths:
      - '.github/apply-live-slow-grace-v24.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout TV FULL PRO source
        uses: actions/checkout@v4
        with:
          ref: android-tv-full-pro-clean-source
          fetch-depth: 0

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply LIVE slow-grace detector v24
        run: python3 .github/scripts/apply_tv_full_live_slow_grace_v24.py

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify Dart formatting
        run: dart format --output=none --set-exit-if-changed lib

      - name: Static analysis
        run: flutter analyze

      - name: Run automated tests
        run: flutter test

      - name: Compile Android TV debug validation
        run: flutter build apk --debug --dart-define=TV_FULL_ANDROID_TV=true --target-platform android-arm,android-arm64

      - name: Verify LIVE slow-grace guardrails
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'version: 1.3.2+24' pubspec.yaml
          grep -q 'LIVE_STARTUP_SLOW_SIGNAL_MS = 5500L' android/app/src/main/kotlin/com/example/iptv_player/MainActivity.kt
          grep -q 'LIVE_STARTUP_NO_PROGRESS_MS = 9000L' android/app/src/main/kotlin/com/example/iptv_player/MainActivity.kt
          grep -q 'MAX_LIVE_ENDED_RECOVERIES = 5' android/app/src/main/kotlin/com/example/iptv_player/MainActivity.kt
          grep -q 'tracks.groups.isNotEmpty()' android/app/src/main/kotlin/com/example/iptv_player/MainActivity.kt
          grep -q 'MAX_LIVE_STALL_RECOVERIES = 2' android/app/src/main/kotlin/com/example/iptv_player/MainActivity.kt
          grep -q 'connectTimeout(4, TimeUnit.SECONDS)' android/app/src/main/kotlin/com/example/iptv_player/MainActivity.kt

      - name: Commit TV FULL PRO 1.3.2+24
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/kotlin/com/example/iptv_player/MainActivity.kt pubspec.yaml
          git commit -m "TV FULL PRO 1.3.2+24: tolerate slow live startup" || true
          git pull --rebase origin android-tv-full-pro-clean-source
          git push origin HEAD:android-tv-full-pro-clean-source
