name: Apply TV FULL guide copy fix

on:
  push:
    branches:
      - android-tv-full-pro-clean-source
    paths:
      - '.github/guide-copy-fix-request.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout TV FULL PRO source
        uses: actions/checkout@v4
        with:
          ref: android-tv-full-pro-clean-source

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply guide copy fix
        run: python .github/scripts/apply_tv_full_guide_copy_fix.py

      - name: Resolve dependencies
        run: flutter pub get

      - name: Format touched file
        run: dart format lib/widgets/tv_live_premium_catalog.dart

      - name: Static analysis
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Verify wording
        run: |
          ! grep -q 'Programación no disponible' lib/widgets/tv_live_premium_catalog.dart
          grep -q 'Guía no informada' lib/widgets/tv_live_premium_catalog.dart
          grep -q 'La señal se puede reproducir normalmente.' lib/widgets/tv_live_premium_catalog.dart

      - name: Commit copy fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/widgets/tv_live_premium_catalog.dart
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Clarify LIVE guide unavailable state'
          git push origin HEAD:android-tv-full-pro-clean-source
