name: Cleanup final project refs once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cleanup-final-project-refs-once.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete obsolete test releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for id in 387294370 387248981 384251293; do
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$id" || true
          done

      - name: Delete obsolete test tags and redundant work branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/tv-full-pro-v38-performance-test-34640551951" || true
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/tv-full-pro-logo-test-34632048330" || true
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/tv-full-pro-interface-37-34149600271" || true
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/work/v37-approved-clean" || true

      - name: Verify final branches and tags
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/branches?per_page=100" --paginate --jq '.[].name' | sort | tee /tmp/branches.txt
          cat > /tmp/branches.expected <<'EOF'
          android-tv-full-pro-clean-source
          main
          stable/v37-approved-exact
          EOF
          diff -u /tmp/branches.expected /tmp/branches.txt

          gh api "repos/$GITHUB_REPOSITORY/git/refs/tags" --jq '.[].ref' | sed 's#refs/tags/##' | sort | tee /tmp/tags.txt
          cat > /tmp/tags.expected <<'EOF'
          tv-full-installer-latest
          tv-full-pro-latest
          EOF
          diff -u /tmp/tags.expected /tmp/tags.txt
