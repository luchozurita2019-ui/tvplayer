name: Prueba TV V52 corregida a V53 JSON

on:
  push:
    branches:
      - codex/prueba-tv-json-v53-20261009
    paths:
      - pubspec.yaml
      - .github/workflows/build-json-update-tv-test.yml
      - scripts/verify_tv_update_apk.py
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: tv-json-update-v53
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout de la fuente corregida
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Conservar todos los cambios de V52 corregida
        run: |
          set -euo pipefail
          git diff --exit-code ecb7e29deb8d567a72fe8a007cccd9fd2df994a2 HEAD -- lib android assets test pubspec.lock
          grep -q '^version: 1.4.21+3053$' pubspec.yaml

      - name: Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter 3.47.2 de la compilación original
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Dependencias bloqueadas
        run: |
          flutter pub get
          git diff --exit-code -- pubspec.lock

      - name: Analizar y probar la app
        run: |
          dart analyze lib test
          flutter test --no-pub --reporter expanded

      - name: Firma histórica
        shell: bash
        env:
          TV_FULL_KEYSTORE_BASE64: ${{ secrets.TV_FULL_KEYSTORE_BASE64 }}
          TV_FULL_KEYSTORE_PASSWORD: ${{ secrets.TV_FULL_KEYSTORE_PASSWORD }}
          TV_FULL_KEY_ALIAS: ${{ secrets.TV_FULL_KEY_ALIAS }}
          TV_FULL_KEY_PASSWORD: ${{ secrets.TV_FULL_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$TV_FULL_KEYSTORE_BASE64"
          test -n "$TV_FULL_KEYSTORE_PASSWORD"
          test -n "$TV_FULL_KEY_ALIAS"
          test -n "$TV_FULL_KEY_PASSWORD"
          umask 077
          printf '%s' "$TV_FULL_KEYSTORE_BASE64" | base64 --decode > android/tvfull-release.jks
          cat > android/key.properties <<EOF
          storeFile=tvfull-release.jks
          storePassword=$TV_FULL_KEYSTORE_PASSWORD
          keyAlias=$TV_FULL_KEY_ALIAS
          keyPassword=$TV_FULL_KEY_PASSWORD
          EOF

      - name: Compilar V53 universal
        run: flutter build apk --release --dart-define=TV_FULL_ANDROID_TV=true

      - name: Recuperar la última V52 corregida para instalar primero
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 37905308209 --repo "$GITHUB_REPOSITORY" --name tvfull-proveedor-2-signed-apk --dir baseline
          test "$(tr -d '\r\n' < baseline/COMMIT.txt)" = "ecb7e29deb8d567a72fe8a007cccd9fd2df994a2"
          test "$(sha256sum baseline/TV-FULL-PRO-proveedor-2.apk | cut -d ' ' -f 1)" = "6759f541352f1eba4d633ecfa63c18d20eb692be97e9427cf84e51070518fb10"
          mkdir -p release
          cp baseline/TV-FULL-PRO-proveedor-2.apk release/TV-FULL-PRO-V52-REMOTA-JSON.apk
          cp build/app/outputs/flutter-apk/app-release.apk release/TV-FULL-PRO-V53-REMOTA-JSON.apk

      - name: Comprobar versión, paquete, firma y URL dentro de las APK
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          for VERSION in 52 53; do
            APK="release/TV-FULL-PRO-V$VERSION-REMOTA-JSON.apk"
            "$APKSIGNER" verify --verbose --print-certs "$APK" > "release/SIGNATURE-V$VERSION.txt"
            grep -qi '40de9b14a83adb7b070e316a241e7f5a7f5b1705fdc43b5f495b0e1e3fcab02a' "release/SIGNATURE-V$VERSION.txt"
            "$AAPT" dump badging "$APK" > "release/BADGING-V$VERSION.txt"
            grep -q "name='com.tvfull.pro.tv.v10safe'" "release/BADGING-V$VERSION.txt"
            CODE=$((3000 + VERSION))
            grep -q "versionCode='$CODE'" "release/BADGING-V$VERSION.txt"
            python scripts/verify_tv_update_apk.py "$APK"
            sha256sum "$APK" > "release/SHA256-V$VERSION.txt"
          done
          printf '%s\n' "$GITHUB_SHA" > release/COMMIT-V53.txt

      - name: Publicar las APK para la prueba del canal JSON
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for VERSION in 52 53; do
            TAG="tv-full-pro-v$VERSION-remota-json-$((3000 + VERSION))-test"
            APK="release/TV-FULL-PRO-V$VERSION-REMOTA-JSON.apk"
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              mkdir -p "published-v$VERSION"
              gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$(basename "$APK")" --dir "published-v$VERSION"
              cmp "$APK" "published-v$VERSION/$(basename "$APK")"
            else
              gh release create "$TAG" "$APK" "release/SHA256-V$VERSION.txt" "release/SIGNATURE-V$VERSION.txt" \
                --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false \
                --title "TV FULL PRO V$VERSION - M3U remota y actualización JSON (prueba TV)" \
                --notes "Canal de prueba basado en la última rama v52-lista-remota-correcta (ecb7e29). V52 es la APK original de esa compilación; V53 conserva exactamente lib/android/assets/test y cambia únicamente a 1.4.21+3053. Ambas incluyen lista_clasica.m3u remota y el actualizador directo auto-update-json-test/update.json. Paquete y certificado históricos verificados. Instalar V52 primero y usar el cartel para subir a V53. Este flujo no modifica el canal estable ni activa el JSON."
            fi
          done

      - name: Eliminar material de firma
        if: always()
        run: rm -f android/key.properties android/tvfull-release.jks

      - name: Guardar comprobaciones de la prueba
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: TV-FULL-PRO-V53-json-tv-test
          path: release/*
          if-no-files-found: error
          retention-days: 30
