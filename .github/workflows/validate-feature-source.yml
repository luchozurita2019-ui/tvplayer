name: Validate source portal feature

on:
  push:
    branches:
      - feature-source-types-v1
  workflow_dispatch:

jobs:
  validate-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Enable macOS
        run: flutter config --enable-macos-desktop

      - name: Generate macOS project
        run: flutter create --platforms=macos .

      - name: Allow outgoing Internet
        run: |
          for file in macos/Runner/DebugProfile.entitlements macos/Runner/Release.entitlements; do
            /usr/libexec/PlistBuddy -c "Add :com.apple.security.network.client bool true" "$file" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :com.apple.security.network.client true" "$file"
          done

      - name: Adjust deployment target
        run: |
          sed -i '' 's/MACOSX_DEPLOYMENT_TARGET = 10.14/MACOSX_DEPLOYMENT_TARGET = 10.15/g' macos/Runner.xcodeproj/project.pbxproj || true

      - name: Refresh dependencies
        run: flutter pub get

      - name: Build macOS
        run: flutter build macos --release

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Package DMG
        run: |
          mkdir -p dist
          APP_PATH=$(find build/macos/Build/Products/Release -maxdepth 1 -name "*.app" | head -n 1)
          echo "Aplicación encontrada: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No se encontró ninguna aplicación .app"
            exit 1
          fi

          create-dmg \
            --volname "TV FULL" \
            --window-size 600 400 \
            --icon-size 100 \
            --app-drop-link 450 200 \
            "dist/TV-FULL-Installer.dmg" \
            "$APP_PATH"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: TV-FULL-Installer
          path: dist/TV-FULL-Installer.dmg
          if-no-files-found: error
