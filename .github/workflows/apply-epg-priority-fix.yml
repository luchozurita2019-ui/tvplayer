name: Apply EPG playback priority fix

on:
  push:
    branches:
      - fix/playback-priority-cancellation
    paths:
      - '.github/workflows/apply-epg-priority-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/playback-priority-cancellation
      - name: Patch EPG negative cache and playback gate
        shell: python
        run: |
          from pathlib import Path
          p = Path('lib/services/live_epg_service.dart')
          s = p.read_text()

          s = s.replace(
            """  static const Duration _cacheFreshFor = Duration(minutes: 3);\n  static const int _maxCacheEntries = 24;""",
            """  static const Duration _cacheFreshFor = Duration(minutes: 3);\n  static const Duration _negativeFreshFor = Duration(seconds: 20);\n  static const int _maxCacheEntries = 24;""", 1)
          s = s.replace(
            """  final Map<String, Future<LiveProgramGuide?>> _pending =\n      <String, Future<LiveProgramGuide?>>{};""",
            """  final Map<String, Future<LiveProgramGuide?>> _pending =\n      <String, Future<LiveProgramGuide?>>{};\n  final Map<String, DateTime> _negativeCache = <String, DateTime>{};""", 1)

          old = """    final existing = _pending[key];\n    if (existing != null) return existing;\n\n    final future = _fetchXtream(source, streamId);"""
          new = """    final negativeAt = _negativeCache[key];\n    if (negativeAt != null) {\n      if (DateTime.now().difference(negativeAt) < _negativeFreshFor) return null;\n      _negativeCache.remove(key);\n    }\n\n    // Durante apertura/zapping/rebuffering no nace ninguna consulta EPG nueva.\n    // La caché positiva de arriba sigue disponible sin consumir red.\n    if (XtreamHttpClient.browsingSuspended) return null;\n\n    final existing = _pending[key];\n    if (existing != null) return existing;\n\n    final future = _fetchXtream(source, streamId);"""
          assert old in s
          s = s.replace(old, new, 1)

          old = """      if (guide != null && guide.hasPrograms) {\n        _remember(key, guide);\n      }\n      return guide;"""
          new = """      if (guide != null && guide.hasPrograms) {\n        _negativeCache.remove(key);\n        _remember(key, guide);\n      } else {\n        _negativeCache[key] = DateTime.now();\n      }\n      return guide;"""
          assert old in s
          s = s.replace(old, new, 1)

          old = """    _cache.removeWhere((key, value) => key.startsWith(prefix));\n    _pending.removeWhere((key, value) => key.startsWith(prefix));"""
          new = """    _cache.removeWhere((key, value) => key.startsWith(prefix));\n    _negativeCache.removeWhere((key, value) => key.startsWith(prefix));\n    _pending.removeWhere((key, value) => key.startsWith(prefix));"""
          assert old in s
          s = s.replace(old, new, 1)

          old = """  ) async {\n    try {\n      var connection = await XtreamFastCatalogService.instance\n          .connectionForPlaylist(playlistUrl);"""
          new = """  ) async {\n    try {\n      if (XtreamHttpClient.browsingSuspended) return null;\n      var connection = await XtreamFastCatalogService.instance\n          .connectionForPlaylist(playlistUrl);"""
          # Limit replacement to _fetchXtream occurrence by finding nearby signature.
          pos = s.index('  Future<LiveProgramGuide?> _fetchXtream(')
          tail = s[pos:]
          assert old in tail
          tail = tail.replace(old, new, 1)
          s = s[:pos] + tail

          old = """      for (var attempt = 0; attempt < 2; attempt++) {\n        try {"""
          new = """      for (var attempt = 0; attempt < 2; attempt++) {\n        if (XtreamHttpClient.browsingSuspended) return null;\n        try {"""
          assert old in s
          s = s.replace(old, new, 1)

          old = """    for (final action in actions) {\n      try {"""
          new = """    for (final action in actions) {\n      if (XtreamHttpClient.browsingSuspended) return null;\n      try {"""
          assert old in s
          s = s.replace(old, new, 1)

          p.write_text(s)
      - name: Remove one-shot workflow
        run: git rm .github/workflows/apply-epg-priority-fix.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/services/live_epg_service.dart .github/workflows/apply-epg-priority-fix.yml
          git commit -m "fix: gate EPG behind playback priority and cache empty results"
          git push origin HEAD:fix/playback-priority-cancellation
