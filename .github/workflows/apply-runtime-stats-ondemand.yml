name: Apply runtime stats optimization

on:
  push:
    branches:
      - performance-engine-v38-hotplayer-baseline

jobs:
  patch:
    if: github.event.head_commit.message == 'ci: apply runtime stats optimization'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: performance-engine-v38-hotplayer-baseline

      - name: Apply patch
        run: python3 tooling/apply_runtime_stats_ondemand.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/player_screen.dart
          git commit -m "perf: make runtime stats on demand"
          git push origin HEAD:performance-engine-v38-hotplayer-baseline
