name: Build V38 Performance Test to Installer

on:
  push:
    branches:
      - android-tv-full-pro-clean-source
    paths:
      - '.github/v38-performance-installer-request.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      VALIDATED_V38_SHA: 21ff7417d11acfaf27c1a30b0df2b83db05fe49e
      V37_BASE_SHA: c14e3bd878ea083ab0b8df6617f15d4d781c3f21
      CERT_SHA256: 40de9b14a83adb7b070e316a241e7f5a7f5b1705fdc43b5f495b0e1e3fcab02a

    steps:
      - name: Checkout exact validated V38 source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.VALIDATED_V38_SHA }}
          fetch-depth: 0

      - name: Prove exact source identity and version
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$VALIDATED_V38_SHA"
          grep -q '^version: 1.4.6+38$' pubspec.yaml
          git cat-file -e "$V37_BASE_SHA^{commit}"
          echo "Building validated V38 source: $VALIDATED_V38_SHA"

      - name: Reconfirm no interface changes versus V37
        shell: bash
        run: |
          set -euo pipefail
          FORBIDDEN="$(git diff --name-only "$V37_BASE_SHA" "$VALIDATED_V38_SHA" -- \
            lib/screens/home_screen.dart \
            lib/screens/source_content_screen.dart \
            lib/widgets/tv_cinematic_home.dart \
            lib/widgets/tv_full_brand.dart \
            lib/widgets/tv_full_clean_ui.dart \
            lib/widgets/tv_full_premium_ui.dart \
            lib/widgets/tv_full_section_shell.dart \
            lib/widgets/tv_live_premium_catalog.dart \
            lib/widgets/tv_live_theater.dart \
            android/app/src/main/res || true)"
          if [ -n "$FORBIDDEN" ]; then
            echo 'Interface/resource changes detected; refusing installer promotion:'
            echo "$FORBIDDEN"
            exit 1
          fi

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze and test exact V38
        shell: bash
        run: |
          set -euo pipefail
          flutter analyze
          flutter test

      - name: Configure historical release signing
        shell: bash
        env:
          TV_FULL_KEYSTORE_BASE64: ${{ secrets.TV_FULL_KEYSTORE_BASE64 }}
          TV_FULL_KEYSTORE_PASSWORD: ${{ secrets.TV_FULL_KEYSTORE_PASSWORD }}
          TV_FULL_KEY_ALIAS: ${{ secrets.TV_FULL_KEY_ALIAS }}
          TV_FULL_KEY_PASSWORD: ${{ secrets.TV_FULL_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$TV_FULL_KEYSTORE_BASE64"
          test -n "$TV_FULL_KEYSTORE_PASSWORD"
          test -n "$TV_FULL_KEY_ALIAS"
          test -n "$TV_FULL_KEY_PASSWORD"
          printf '%s' "$TV_FULL_KEYSTORE_BASE64" | base64 --decode > android/tvfull-release.jks
          cat > android/key.properties <<EOF
          storeFile=tvfull-release.jks
          storePassword=$TV_FULL_KEYSTORE_PASSWORD
          keyAlias=$TV_FULL_KEY_ALIAS
          keyPassword=$TV_FULL_KEY_PASSWORD
          EOF

      - name: Build signed ARM32 and ARM64 APKs
        run: >-
          flutter build apk --release --split-per-abi
          --dart-define=TV_FULL_ANDROID_TV=true
          --target-platform android-arm,android-arm64

      - name: Verify APK identity, signature and metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk artifact/TV-FULL-PRO-V38-ARM32.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk artifact/TV-FULL-PRO-V38-ARM64.apk
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          for apk in artifact/TV-FULL-PRO-V38-ARM32.apk artifact/TV-FULL-PRO-V38-ARM64.apk; do
            "$APKSIGNER" verify --verbose --print-certs "$apk" > "$apk.signature.txt"
            grep -qi "$CERT_SHA256" "$apk.signature.txt"
            "$AAPT" dump badging "$apk" > "$apk.badging.txt"
            grep -q "package: name='com.tvfull.pro.tv.v10safe' versionCode='38' versionName='1.4.6'" "$apk.badging.txt"
          done
          ARM32_SHA="$(sha256sum artifact/TV-FULL-PRO-V38-ARM32.apk | awk '{print $1}')"
          ARM64_SHA="$(sha256sum artifact/TV-FULL-PRO-V38-ARM64.apk | awk '{print $1}')"
          ARM32_SIZE="$(stat -c '%s' artifact/TV-FULL-PRO-V38-ARM32.apk)"
          ARM64_SIZE="$(stat -c '%s' artifact/TV-FULL-PRO-V38-ARM64.apk)"
          echo "arm32_sha=$ARM32_SHA" >> "$GITHUB_OUTPUT"
          echo "arm64_sha=$ARM64_SHA" >> "$GITHUB_OUTPUT"
          echo "arm32_size=$ARM32_SIZE" >> "$GITHUB_OUTPUT"
          echo "arm64_size=$ARM64_SIZE" >> "$GITHUB_OUTPUT"

      - name: Publish isolated V38 performance test APKs
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="tv-full-pro-v38-performance-test-${GITHUB_RUN_ID}"
          cp artifact/TV-FULL-PRO-V38-ARM32.apk artifact/TV-FULL-PRO-ARM32.apk
          cp artifact/TV-FULL-PRO-V38-ARM64.apk artifact/TV-FULL-PRO-ARM64.apk
          gh release create "$TAG" \
            artifact/TV-FULL-PRO-ARM32.apk \
            artifact/TV-FULL-PRO-ARM64.apk \
            --prerelease \
            --target "$VALIDATED_V38_SHA" \
            --title 'TV FULL PRO 1.4.6+38 - prueba de rendimiento' \
            --notes "V38 performance-only. Sin cambios de interfaz. Fuente validada: $VALIDATED_V38_SHA. Firma histórica verificada."
          echo "base=https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}" >> "$GITHUB_OUTPUT"

      - name: Point official installer only to V38 test binaries
        env:
          PUBLIC_BASE: ${{ steps.publish.outputs.base }}
          ARM32_SHA: ${{ steps.meta.outputs.arm32_sha }}
          ARM64_SHA: ${{ steps.meta.outputs.arm64_sha }}
          ARM32_SIZE: ${{ steps.meta.outputs.arm32_size }}
          ARM64_SIZE: ${{ steps.meta.outputs.arm64_size }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin android-tv-full-pro-clean-source
          git checkout -B installer-v38-performance-test origin/android-tv-full-pro-clean-source
          cat > tv_full_installer/latest.json <<EOF
          {
            "versionName": "1.4.6",
            "versionCode": 38,
            "packageName": "com.tvfull.pro.tv.v10safe",
            "certificateSha256": "$CERT_SHA256",
            "arm32": {
              "url": "$PUBLIC_BASE/TV-FULL-PRO-ARM32.apk",
              "sha256": "$ARM32_SHA",
              "size": $ARM32_SIZE
            },
            "arm64": {
              "url": "$PUBLIC_BASE/TV-FULL-PRO-ARM64.apk",
              "sha256": "$ARM64_SHA",
              "size": $ARM64_SIZE
            }
          }
          EOF
          printf '%s\n' \
            'TV FULL PRO 1.4.6+38 performance-only test is active in installer.' \
            "source_commit=$VALIDATED_V38_SHA" \
            "build_run=$GITHUB_RUN_ID" \
            "arm32_sha256=$ARM32_SHA" \
            "arm64_sha256=$ARM64_SHA" \
            > .github/v38-performance-test-installer.txt
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tv_full_installer/latest.json .github/v38-performance-test-installer.txt
          git commit -m 'Point installer to V38 performance-only test'
          git push origin HEAD:android-tv-full-pro-clean-source

      - name: Verify public installer manifest
        env:
          ARM32_SHA: ${{ steps.meta.outputs.arm32_sha }}
          ARM64_SHA: ${{ steps.meta.outputs.arm64_sha }}
        shell: bash
        run: |
          set -euo pipefail
          URL='https://raw.githubusercontent.com/luchozurita2019-ui/tvplayer/android-tv-full-pro-clean-source/tv_full_installer/latest.json'
          for attempt in $(seq 1 20); do
            BODY="$(curl -L --fail --silent --show-error "$URL" || true)"
            if printf '%s' "$BODY" | grep -q '"versionCode": 38' && \
               printf '%s' "$BODY" | grep -q '"versionName": "1.4.6"' && \
               printf '%s' "$BODY" | grep -q "$ARM32_SHA" && \
               printf '%s' "$BODY" | grep -q "$ARM64_SHA"; then
              echo 'V38 performance-only test is live in official installer.'
              exit 0
            fi
            sleep 5
          done
          echo 'Installer manifest did not become observable as V38.'
          exit 1

      - name: Remove signing material
        if: always()
        run: rm -f android/key.properties android/tvfull-release.jks

      - name: Upload V38 verification artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TV-FULL-PRO-V38-PERFORMANCE-INSTALLER
          path: artifact/
          if-no-files-found: error
          retention-days: 30
