name: Apply TV FULL PRO Classic Asset v26

on:
  push:
    branches:
      - android-tv-full-pro-clean-source
    paths:
      - '.github/apply-classic-asset-v26.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout TV FULL PRO source
        uses: actions/checkout@v4
        with:
          ref: android-tv-full-pro-clean-source
          fetch-depth: 0

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply classic asset and logo performance v26
        run: python3 .github/scripts/apply_tv_full_classic_asset_v26.py

      - name: Resolve dependencies
        run: flutter pub get

      - name: Format touched Dart files
        run: >-
          dart format
          lib/providers/iptv_provider.dart
          lib/services/m3u_fetcher.dart
          lib/services/channel_logo_resolver_service.dart
          test/builtin_classic_playlist_test.dart
          test/channel_logo_resolver_test.dart

      - name: Verify touched-file formatting
        run: >-
          dart format --output=none --set-exit-if-changed
          lib/providers/iptv_provider.dart
          lib/services/m3u_fetcher.dart
          lib/services/channel_logo_resolver_service.dart
          test/builtin_classic_playlist_test.dart
          test/channel_logo_resolver_test.dart

      - name: Check patch whitespace
        run: git diff --check

      - name: Validate bundled classic playlist
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/playlists/lista_clasica.m3u
          test -s assets/playlists/lista_clasica_logo_index.json
          test "$(grep -c '^#EXTINF:' assets/playlists/lista_clasica.m3u)" -gt 100
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('assets/playlists/lista_clasica_logo_index.json').read_text(encoding='utf-8'))
          assert len(data) > 50, len(data)
          print(f'classic_logo_keys={len(data)}')
          PY

      - name: Static analysis
        run: flutter analyze

      - name: Run automated tests
        run: flutter test

      - name: Compile Android TV debug validation
        run: flutter build apk --debug --dart-define=TV_FULL_ANDROID_TV=true --target-platform android-arm,android-arm64

      - name: Verify v26 performance and signing guardrails
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'version: 1.3.4+26' pubspec.yaml
          grep -q 'assets/playlists/' pubspec.yaml
          grep -q "tvf_builtin_classic" lib/providers/iptv_provider.dart
          grep -q "Lista clásica" lib/providers/iptv_provider.dart
          grep -q "asset://assets/playlists/lista_clasica.m3u" lib/providers/iptv_provider.dart
          grep -q "rootBundle.loadString" lib/services/m3u_fetcher.dart
          grep -q "lista_clasica_logo_index.json" lib/services/channel_logo_resolver_service.dart
          ! grep -q "iptv-org.github.io/api/logos.json" lib/services/channel_logo_resolver_service.dart
          ! grep -q "package:http" lib/services/channel_logo_resolver_service.dart
          grep -q 'deadCooldown = Duration(minutes: 10)' lib/services/channel_health_service.dart
          grep -q 'LIVE_STARTUP_NO_PROGRESS_MS = 9000L' android/app/src/main/kotlin/com/example/iptv_player/MainActivity.kt
          grep -q 'MAX_LIVE_ENDED_RECOVERIES = 5' android/app/src/main/kotlin/com/example/iptv_player/MainActivity.kt
          grep -q 'connectTimeout(4, TimeUnit.SECONDS)' android/app/src/main/kotlin/com/example/iptv_player/MainActivity.kt
          grep -qi '40de9b14a83adb7b070e316a241e7f5a7f5b1705fdc43b5f495b0e1e3fcab02a' .github/workflows/build-tv-full-pro-clean.yml

      - name: Commit TV FULL PRO 1.3.4+26
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            assets/playlists/lista_clasica.m3u \
            assets/playlists/lista_clasica_logo_index.json \
            lib/providers/iptv_provider.dart \
            lib/services/m3u_fetcher.dart \
            lib/services/channel_logo_resolver_service.dart \
            test/builtin_classic_playlist_test.dart \
            pubspec.yaml
          git commit -m "TV FULL PRO 1.3.4+26: bundle classic list and lighten logos" || true
          git pull --rebase origin android-tv-full-pro-clean-source
          git push origin HEAD:android-tv-full-pro-clean-source
