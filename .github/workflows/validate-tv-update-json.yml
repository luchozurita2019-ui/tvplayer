name: Validar actualización directa JSON

on:
  pull_request:
    paths:
      - update.json
      - scripts/validate_tv_update_json.mjs
      - .github/workflows/validate-tv-update-json.yml
  push:
    branches:
      - auto-update-json-test
    paths:
      - update.json
      - scripts/validate_tv_update_json.mjs
      - .github/workflows/validate-tv-update-json.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Comprobar contrato y APK publicada
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/validate_tv_update_json.mjs --online
