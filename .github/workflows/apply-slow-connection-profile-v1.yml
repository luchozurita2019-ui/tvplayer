name: Apply slow connection profile v1

on:
  push:
    branches:
      - performance-engine-v38-hotplayer-baseline
    paths:
      - tooling/apply_slow_connection_profile_v1.py
      - .github/workflows/apply-slow-connection-profile-v1.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: performance-engine-v38-hotplayer-baseline
      - name: Apply patch
        run: python tooling/apply_slow_connection_profile_v1.py
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/playback_settings_screen.dart lib/screens/player_screen.dart
          git commit -m "feat: prioritize playback on slow connections"
          git push
