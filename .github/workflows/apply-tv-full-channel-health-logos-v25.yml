name: Apply TV FULL PRO Channel Health and Logos v25

on:
  push:
    branches:
      - android-tv-full-pro-clean-source
    paths:
      - '.github/apply-channel-health-logos-v25.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout TV FULL PRO source
        uses: actions/checkout@v4
        with:
          ref: android-tv-full-pro-clean-source
          fetch-depth: 0

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply channel health and logo fallback v25
        run: python3 .github/scripts/apply_tv_full_channel_health_logos_v25.py

      - name: Format touched Dart files
        run: >-
          dart format
          lib/services/channel_health_service.dart
          lib/services/channel_logo_resolver_service.dart
          lib/services/tv_local_store.dart
          lib/widgets/channel_logo_image.dart
          lib/widgets/channel_tile.dart
          lib/screens/android_media3_texture_player_screen.dart
          lib/screens/channel_list_screen.dart
          lib/screens/xtream_live_screen.dart
          test/channel_logo_resolver_test.dart

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Check patch whitespace
        run: git diff --check

      - name: Static analysis
        run: flutter analyze

      - name: Run automated tests
        run: flutter test

      - name: Compile Android TV debug validation
        run: flutter build apk --debug --dart-define=TV_FULL_ANDROID_TV=true --target-platform android-arm,android-arm64

      - name: Verify v25 guardrails and signing continuity
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'version: 1.3.3+25' pubspec.yaml
          grep -q 'deadCooldown = Duration(minutes: 10)' lib/services/channel_health_service.dart
          grep -q 'channel_health' lib/services/tv_local_store.dart
          grep -q 'channel_logo_cache' lib/services/tv_local_store.dart
          grep -q 'iptv-org.github.io/api/logos.json' lib/services/channel_logo_resolver_service.dart
          grep -q 'ChannelLogoImage' lib/screens/android_media3_texture_player_screen.dart
          grep -q '_nextPlayableIndex' lib/screens/android_media3_texture_player_screen.dart
          grep -q "TVFULL_NO_PROGRESS" android/app/src/main/kotlin/com/example/iptv_player/MainActivity.kt
          grep -q 'LIVE_STARTUP_NO_PROGRESS_MS = 9000L' android/app/src/main/kotlin/com/example/iptv_player/MainActivity.kt
          grep -q 'MAX_LIVE_ENDED_RECOVERIES = 5' android/app/src/main/kotlin/com/example/iptv_player/MainActivity.kt
          grep -q 'connectTimeout(4, TimeUnit.SECONDS)' android/app/src/main/kotlin/com/example/iptv_player/MainActivity.kt
          grep -qi '40de9b14a83adb7b070e316a241e7f5a7f5b1705fdc43b5f495b0e1e3fcab02a' .github/workflows/build-tv-full-pro-clean.yml

      - name: Commit TV FULL PRO 1.3.3+25
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/services/channel_health_service.dart \
            lib/services/channel_logo_resolver_service.dart \
            lib/services/tv_local_store.dart \
            lib/widgets/channel_logo_image.dart \
            lib/widgets/channel_tile.dart \
            lib/screens/android_media3_texture_player_screen.dart \
            lib/screens/channel_list_screen.dart \
            lib/screens/xtream_live_screen.dart \
            test/channel_logo_resolver_test.dart \
            pubspec.yaml
          git commit -m "TV FULL PRO 1.3.3+25: skip dead channels and restore logos" || true
          git pull --rebase origin android-tv-full-pro-clean-source
          git push origin HEAD:android-tv-full-pro-clean-source
