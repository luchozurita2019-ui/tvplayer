name: Build TV FULL Native Stability V4.2 CLEAN

on:
  workflow_dispatch:
  push:
    branches:
      - tvfull-native-tv-stability-v42-clean
    paths:
      - 'native-tv-complete/**'
      - '.github/scripts/apply_native_tv_professional_v2.py'
      - '.github/scripts/apply_native_tv_stability_v3.py'
      - '.github/scripts/apply_native_tv_premium_ui_v3.py'
      - '.github/scripts/apply_native_tv_stability_v42_clean.py'
      - '.github/workflows/build-tvfull-native-complete.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Apply Professional V2 base
        run: python3 .github/scripts/apply_native_tv_professional_v2.py

      - name: Apply Stability V3 proven engine
        run: python3 .github/scripts/apply_native_tv_stability_v3.py

      - name: Apply Premium V3 interface
        run: python3 .github/scripts/apply_native_tv_premium_ui_v3.py

      - name: Apply V4.2 clean targeted fixes
        run: python3 .github/scripts/apply_native_tv_stability_v42_clean.py

      - name: Verify clean V3 lifecycle and V4.2 fixes
        shell: bash
        run: |
          set -euo pipefail
          TV='native-tv-complete/app/src/main/java/com/tvfull/pro/TvHomeActivity.kt'
          REMOTE='native-tv-complete/app/src/main/java/com/tvfull/pro/RemoteProvisioning.kt'
          PROV='native-tv-complete/app/src/main/java/com/tvfull/pro/ProvisioningActivity.kt'

          # Proven V3 / Professional features stay present.
          grep -q 'showPlaybackOptions' "$TV"
          grep -q 'TrackSelectionOverride' "$TV"
          grep -q 'RESIZE_MODE_ZOOM' "$TV"
          grep -q 'videoResolutionLabel' "$TV"
          grep -q 'MAX_VOD_RECOVERIES = 4' "$TV"
          grep -q 'DefaultLoadErrorHandlingPolicy' "$TV"
          grep -q 'scheduleVodRecovery' "$TV"
          grep -q 'lastKnownPositionMs' "$TV"
          grep -q 'DIAGNÓSTICO DE REPRODUCCIÓN' "$TV"
          grep -q 'premiumSurface' "$TV"
          grep -q 'NATIVE TV' "$TV"
          grep -q 'PAYMENT_DUE' "$REMOTE"
          grep -q 'payment_due' "$REMOTE"
          grep -q 'SERVICIO SUSPENDIDO' "$PROV"

          # Critical: restore the proven V3 Activity/player lifecycle.
          grep -q 'if (::playerView.isInitialized && player == null) initPlayer()' "$TV"
          ! grep -q 'created lazily only after the user' "$TV"
          ! grep -q 'player?.release().*lastPlayed = null' "$TV"

          # V4.2 CLEAN targeted changes only.
          grep -q 'no automatic TS -> HLS switch' "$TV"
          grep -q 'return item.url' "$TV"
          grep -q 'if (isLiveLike(item)) LIVE_START_TIMEOUT else 30_000L' "$TV"
          grep -q 'visibility = View.GONE' "$TV"
          grep -q "4.2-native-tv-stability-clean" native-tv-complete/app/build.gradle

      - name: Build release APK
        working-directory: native-tv-complete
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK='native-tv-complete/app/build/outputs/apk/release/app-release.apk'
          test -f "$APK"
          ls -lh "$APK"
          TOOLS="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$ANDROID_HOME/build-tools/$TOOLS/aapt" dump badging "$APK" | head -25
          "$ANDROID_HOME/build-tools/$TOOLS/apksigner" verify --verbose --print-certs "$APK"
          mkdir -p artifact
          cp "$APK" artifact/TV-FULL-PRO-NATIVE-TV-STABILITY-V4-2-CLEAN.apk
          sha256sum artifact/TV-FULL-PRO-NATIVE-TV-STABILITY-V4-2-CLEAN.apk > artifact/SHA256.txt
          stat -c '%s' artifact/TV-FULL-PRO-NATIVE-TV-STABILITY-V4-2-CLEAN.apk > artifact/SIZE_BYTES.txt
          git rev-parse HEAD > artifact/COMMIT.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TV-FULL-PRO-NATIVE-TV-STABILITY-V4-2-CLEAN
          path: artifact/
          retention-days: 30
