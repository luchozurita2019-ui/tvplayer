name: Build TV FULL Native Professional V2

on:
  workflow_dispatch:
  push:
    branches:
      - tvfull-native-tv-professional-v2
    paths:
      - 'native-tv-complete/**'
      - '.github/scripts/apply_native_tv_professional_v2.py'
      - '.github/workflows/build-tvfull-native-complete.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Apply professional TV V2 interface
        run: python3 .github/scripts/apply_native_tv_professional_v2.py

      - name: Verify professional TV markers
        shell: bash
        run: |
          set -euo pipefail
          TV='native-tv-complete/app/src/main/java/com/tvfull/pro/TvHomeActivity.kt'
          REMOTE='native-tv-complete/app/src/main/java/com/tvfull/pro/RemoteProvisioning.kt'
          PROV='native-tv-complete/app/src/main/java/com/tvfull/pro/ProvisioningActivity.kt'
          grep -q 'showPlaybackOptions' "$TV"
          grep -q 'TrackSelectionOverride' "$TV"
          grep -q 'RESIZE_MODE_ZOOM' "$TV"
          grep -q 'videoResolutionLabel' "$TV"
          grep -q 'infoPanel.visibility = View.GONE' "$TV"
          grep -q 'PAYMENT_DUE' "$REMOTE"
          grep -q 'payment_due' "$REMOTE"
          grep -q 'SERVICIO SUSPENDIDO' "$PROV"
          grep -q "2.0-native-tv-professional" native-tv-complete/app/build.gradle

      - name: Build release APK
        working-directory: native-tv-complete
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Verify APK
        shell: bash
        run: |
          APK='native-tv-complete/app/build/outputs/apk/release/app-release.apk'
          test -f "$APK"
          ls -lh "$APK"
          TOOLS="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$ANDROID_HOME/build-tools/$TOOLS/aapt" dump badging "$APK" | head -25
          "$ANDROID_HOME/build-tools/$TOOLS/apksigner" verify --verbose --print-certs "$APK"
          mkdir -p artifact
          cp "$APK" artifact/TV-FULL-PRO-NATIVE-TV-PROFESSIONAL-V2.apk
          sha256sum artifact/TV-FULL-PRO-NATIVE-TV-PROFESSIONAL-V2.apk > artifact/SHA256.txt
          stat -c '%s' artifact/TV-FULL-PRO-NATIVE-TV-PROFESSIONAL-V2.apk > artifact/SIZE_BYTES.txt
          git rev-parse HEAD > artifact/COMMIT.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TV-FULL-PRO-NATIVE-TV-PROFESSIONAL-V2
          path: artifact/
          retention-days: 30
