name: Build TV FULL Native Stability V4.1

on:
  workflow_dispatch:
  push:
    branches:
      - tvfull-native-tv-stability-v4
    paths:
      - 'native-tv-complete/**'
      - '.github/scripts/apply_native_tv_professional_v2.py'
      - '.github/scripts/apply_native_tv_stability_v3.py'
      - '.github/scripts/apply_native_tv_premium_ui_v3.py'
      - '.github/scripts/apply_native_tv_stability_v4.py'
      - '.github/scripts/fix_native_tv_stability_v4_strings.py'
      - '.github/scripts/apply_native_tv_provisioning_safe_v41.py'
      - '.github/workflows/build-tvfull-native-complete.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Apply Professional V2 base
        run: python3 .github/scripts/apply_native_tv_professional_v2.py

      - name: Apply Stability V3 engine
        run: python3 .github/scripts/apply_native_tv_stability_v3.py

      - name: Apply Premium V3 interface
        run: python3 .github/scripts/apply_native_tv_premium_ui_v3.py

      - name: Apply Stability V4 targeted fixes
        run: python3 .github/scripts/apply_native_tv_stability_v4.py

      - name: Fix V4 Kotlin string escaping
        run: python3 .github/scripts/fix_native_tv_stability_v4_strings.py

      - name: Apply V4.1 safe provisioning screen
        run: python3 .github/scripts/apply_native_tv_provisioning_safe_v41.py

      - name: Verify V4.1 markers and preserved features
        shell: bash
        run: |
          set -euo pipefail
          TV='native-tv-complete/app/src/main/java/com/tvfull/pro/TvHomeActivity.kt'
          REMOTE='native-tv-complete/app/src/main/java/com/tvfull/pro/RemoteProvisioning.kt'
          PROV='native-tv-complete/app/src/main/java/com/tvfull/pro/ProvisioningActivity.kt'

          # Existing features remain untouched.
          grep -q 'showPlaybackOptions' "$TV"
          grep -q 'TrackSelectionOverride' "$TV"
          grep -q 'RESIZE_MODE_ZOOM' "$TV"
          grep -q 'videoResolutionLabel' "$TV"
          grep -q 'PAYMENT_DUE' "$REMOTE"
          grep -q 'payment_due' "$REMOTE"
          grep -q 'SERVICIO SUSPENDIDO' "$PROV"
          grep -q 'premiumSurface' "$TV"
          grep -q 'NATIVE TV' "$TV"

          # Stability V4 engine stays intact.
          grep -q 'created lazily only after the user' "$TV"
          grep -q 'VOD_START_TIMEOUT = 30_000L' "$TV"
          grep -q 'HLS_LEARN_STABLE_MS = 90_000L' "$TV"
          grep -q 'prepareOrUseHlsFallback' "$TV"
          grep -q 'probeHlsPlaylist' "$TV"
          grep -q 'HLS probe descartado' "$TV"
          grep -q 'regreso inmediato a TS directo' "$TV"
          grep -q 'setKeepContentOnPlayerReset(true)' "$TV"
          grep -q 'DefaultBandwidthMeter' "$TV"
          grep -q 'buffer=.*red≈' "$TV"

          # V4.1: safe activation screen. No dynamic ScrollView/screen-width layout.
          grep -q 'setPadding(dp(36), dp(18), dp(36), dp(18))' "$PROV"
          grep -q 'TV FULL PRO' "$PROV"
          grep -q 'GENERANDO CÓDIGO' "$PROV"
          grep -q 'ViewGroup.LayoutParams.MATCH_PARENT' "$PROV"
          ! grep -q 'screenWidthDp' "$PROV"
          ! grep -q 'isFillViewport' "$PROV"
          grep -q "4.1-native-tv-stability-safe-provisioning" native-tv-complete/app/build.gradle

      - name: Build release APK
        working-directory: native-tv-complete
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK='native-tv-complete/app/build/outputs/apk/release/app-release.apk'
          test -f "$APK"
          ls -lh "$APK"
          TOOLS="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$ANDROID_HOME/build-tools/$TOOLS/aapt" dump badging "$APK" | head -25
          "$ANDROID_HOME/build-tools/$TOOLS/apksigner" verify --verbose --print-certs "$APK"
          mkdir -p artifact
          cp "$APK" artifact/TV-FULL-PRO-NATIVE-TV-STABILITY-V4-1.apk
          sha256sum artifact/TV-FULL-PRO-NATIVE-TV-STABILITY-V4-1.apk > artifact/SHA256.txt
          stat -c '%s' artifact/TV-FULL-PRO-NATIVE-TV-STABILITY-V4-1.apk > artifact/SIZE_BYTES.txt
          git rev-parse HEAD > artifact/COMMIT.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TV-FULL-PRO-NATIVE-TV-STABILITY-V4-1
          path: artifact/
          retention-days: 30
