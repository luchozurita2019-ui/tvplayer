name: Build TV FULL Native Complete

on:
  workflow_dispatch:
  push:
    branches:
      - tvfull-native-complete-v1
    paths:
      - 'native-tv-complete/**'
      - '.github/workflows/build-tvfull-native-complete.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build release APK
        working-directory: native-tv-complete
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Verify APK
        shell: bash
        run: |
          APK='native-tv-complete/app/build/outputs/apk/release/app-release.apk'
          test -f "$APK"
          ls -lh "$APK"
          TOOLS="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$ANDROID_HOME/build-tools/$TOOLS/aapt" dump badging "$APK" | head -25
          "$ANDROID_HOME/build-tools/$TOOLS/apksigner" verify --verbose --print-certs "$APK"
          mkdir -p artifact
          cp "$APK" artifact/TV-FULL-PRO-NATIVE-COMPLETE.apk
          sha256sum artifact/TV-FULL-PRO-NATIVE-COMPLETE.apk > artifact/SHA256.txt
          stat -c '%s' artifact/TV-FULL-PRO-NATIVE-COMPLETE.apk > artifact/SIZE_BYTES.txt
          git rev-parse HEAD > artifact/COMMIT.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TV-FULL-PRO-NATIVE-COMPLETE
          path: artifact/
          retention-days: 30
