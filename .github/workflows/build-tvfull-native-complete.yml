name: Build TV FULL Native V6 Clean Final

on:
  workflow_dispatch:
  push:
    branches: [ tvfull-native-tv-v6-clean-final ]
    paths:
      - 'native-tv-complete/**'
      - '.github/scripts/apply_native_tv_professional_v2.py'
      - '.github/scripts/apply_native_tv_stability_v3.py'
      - '.github/scripts/apply_native_tv_premium_ui_v3.py'
      - '.github/scripts/prepare_native_tv_v6.py'
      - '.github/scripts/apply_native_tv_v6_clean_final.py'
      - '.github/scripts/fix_native_tv_v6_compile.py'
      - '.github/workflows/build-tvfull-native-complete.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Apply Professional V2 base
        run: python3 .github/scripts/apply_native_tv_professional_v2.py
      - name: Apply Stability V3 base
        run: python3 .github/scripts/apply_native_tv_stability_v3.py
      - name: Apply Premium V3 interface
        run: python3 .github/scripts/apply_native_tv_premium_ui_v3.py
      - name: Prepare obsolete V3 playback state
        run: python3 .github/scripts/prepare_native_tv_v6.py
      - name: Apply V6 clean final
        run: python3 .github/scripts/apply_native_tv_v6_clean_final.py
      - name: Fix V6 Kotlin compatibility
        run: python3 .github/scripts/fix_native_tv_v6_compile.py

      - name: Verify V6 architecture and regression guards
        shell: bash
        run: |
          set -euo pipefail
          TV='native-tv-complete/app/src/main/java/com/tvfull/pro/TvHomeActivity.kt'
          VLC='native-tv-complete/app/src/main/java/com/tvfull/pro/StableVlcPlayer.kt'
          FALLBACK='native-tv-complete/app/src/main/java/com/tvfull/pro/FallbackPlaylistResolver.kt'
          CAT='native-tv-complete/app/src/main/java/com/tvfull/pro/CatalogRepository.kt'
          PROV='native-tv-complete/app/src/main/java/com/tvfull/pro/ProvisioningActivity.kt'
          REMOTE='native-tv-complete/app/src/main/java/com/tvfull/pro/RemoteProvisioning.kt'
          GRADLE='native-tv-complete/app/build.gradle'

          grep -q 'PAYMENT_DUE' "$REMOTE"
          grep -q 'payment_due' "$REMOTE"
          grep -q 'SERVICIO SUSPENDIDO' "$PROV"
          grep -q 'premiumSurface' "$TV"
          grep -q 'NATIVE TV' "$TV"
          grep -q 'RESIZE_MODE_ZOOM' "$TV"
          grep -q 'videoResolutionLabel' "$TV"
          grep -q 'DIAGNÓSTICO DE REPRODUCCIÓN' "$TV"

          grep -q 'class StableVlcPlayer' "$VLC"
          grep -q -- '--network-caching=8000' "$VLC"
          grep -q -- '--file-caching=15000' "$VLC"
          ! grep -q -- '--drop-late-frames' "$VLC"
          ! grep -q -- '--skip-frames' "$VLC"
          grep -q 'VLC SINGLE OPEN' "$TV"
          grep -q 'stablePlayer.play(item.url' "$TV"
          grep -q 'isPlaybackPlaying()' "$TV"
          ! grep -q 'VOD cambia Media3 -> VLC' "$TV"
          ! grep -q 'startVlcPlayback' "$TV"
          grep -q 'lastPlayed?.id == item.id && isPlaybackPlaying()' "$TV"
          ! grep -q 'lastPlayed?.id == item.id && player?.isPlaying == true' "$TV"

          grep -q 'class FallbackPlaylistResolver' "$FALLBACK"
          grep -q 'fallbackResolver.streamUrl(ContentSection.LIVE, id)' "$CAT"
          grep -q 'fallbackResolver.streamUrl(ContentSection.MOVIES, id)' "$CAT"
          grep -q 'fallbackResolver.seriesEpisodes(series.name)' "$CAT"
          grep -q 'fun loadSeriesEpisodes(series: ContentItem)' "$CAT"
          grep -q 'fun loadSeriesEpisodes(seriesId: String)' "$CAT"
          grep -q 'repository.loadSeriesEpisodes(series)' "$TV"

          grep -q 'widthDp = (dm.widthPixels / dm.density).toInt()' "$PROV"
          grep -Fq 'TV FULL.\nLas listas y servicios' "$PROV"
          ! grep -q 'LinearLayout.LayoutParams(dp(820)' "$PROV"
          ! grep -q 'LinearLayout.LayoutParams(dp(760)' "$PROV"
          ! grep -q 'LinearLayout.LayoutParams(dp(680)' "$PROV"

          grep -q "org.videolan.android:libvlc-all:3.6.0" "$GRADLE"
          grep -q "6.0-native-tv-clean-single-engine" "$GRADLE"

      - name: Build ARM64 release APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          cd native-tv-complete
          gradle --no-daemon --stacktrace clean :app:assembleRelease -PtvAbi=arm64-v8a
          cp app/build/outputs/apk/release/app-release.apk ../artifact/TV-FULL-PRO-NATIVE-TV-V6-CLEAN-ARM64.apk

      - name: Build ARM32 release APK
        shell: bash
        run: |
          set -euo pipefail
          cd native-tv-complete
          gradle --no-daemon --stacktrace clean :app:assembleRelease -PtvAbi=armeabi-v7a
          cp app/build/outputs/apk/release/app-release.apk ../artifact/TV-FULL-PRO-NATIVE-TV-V6-CLEAN-ARM32.apk

      - name: Verify APKs
        shell: bash
        run: |
          set -euo pipefail
          TOOLS="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          for APK in artifact/*.apk; do
            test -f "$APK"
            echo "==== $APK ===="
            ls -lh "$APK"
            "$ANDROID_HOME/build-tools/$TOOLS/aapt" dump badging "$APK" | head -25
            "$ANDROID_HOME/build-tools/$TOOLS/apksigner" verify --verbose --print-certs "$APK"
            sha256sum "$APK"
          done
          sha256sum artifact/*.apk > artifact/SHA256.txt
          stat -c '%n %s' artifact/*.apk > artifact/SIZE_BYTES.txt
          git rev-parse HEAD > artifact/COMMIT.txt

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: TV-FULL-PRO-NATIVE-TV-V6-CLEAN-FINAL
          path: artifact/
          retention-days: 30
