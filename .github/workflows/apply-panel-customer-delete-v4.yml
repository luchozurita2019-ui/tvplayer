name: Apply Panel Customer Delete V4

on:
  push:
    branches:
      - remote-provisioning-panel-v1
    paths:
      - '.github/scripts/apply_panel_customer_delete_v4.py'
      - '.github/workflows/apply-panel-customer-delete-v4.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-panel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout panel branch
        uses: actions/checkout@v4
        with:
          ref: remote-provisioning-panel-v1
          fetch-depth: 0

      - name: Apply customer deletion patch
        run: python3 .github/scripts/apply_panel_customer_delete_v4.py

      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          text=Path('panel/index.html').read_text(encoding='utf-8')
          m=re.search(r'<script type="module">(.*?)</script>', text, re.S)
          if not m:
              raise SystemExit('module script not found')
          Path('/tmp/panel.mjs').write_text(m.group(1), encoding='utf-8')
          PY
          node --check /tmp/panel.mjs
          grep -q 'data-action="delete-customer"' panel/index.html
          grep -q 'async function deleteCustomer(id)' panel/index.html

      - name: Commit patched panel
        run: |
          if git diff --quiet -- panel/index.html; then
            echo 'Panel already patched'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add panel/index.html
          git commit -m 'Allow deleting customers from panel'
          git push origin HEAD:remote-provisioning-panel-v1
