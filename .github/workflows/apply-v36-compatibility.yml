name: Apply V3.6 compatibility engine

on:
  push:
    branches:
      - performance-engine-v3-network-fix-v36
    paths:
      - '.github/workflows/apply-v36-compatibility.yml'
      - 'tooling/apply_v36_patch.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: performance-engine-v3-network-fix-v36
          fetch-depth: 0

      - name: Apply V3.6 patch
        run: python3 tooling/apply_v36_patch.py

      - name: Remove temporary helpers
        run: rm tooling/apply_v36_patch.py .github/workflows/apply-v36-compatibility.yml

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/player_screen.dart tooling/apply_v36_patch.py .github/workflows/apply-v36-compatibility.yml
          git commit -m "feat: adaptive IPTV server compatibility engine"
          git push origin HEAD:performance-engine-v3-network-fix-v36
