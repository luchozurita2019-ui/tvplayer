name: Build V48 provider JSON resolver

on:
  push:
    branches:
      - feature/local-provider-json-clearkey
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: provider-json-release-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_NAME: '1.4.16'
  BUILD_NUMBER: '3048'
  RELEASE_NUMBER: '48'
  CERT_SHA256: '40de9b14a83adb7b070e316a241e7f5a7f5b1705fdc43b5f495b0e1e3fcab02a'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout the exact release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install tested Flutter version
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Resolve locked dependencies
        run: |
          flutter pub get
          git diff --exit-code -- pubspec.lock

      - name: Enable provider ClearKey HLS compatibility
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/enable_provider_clearkey_hls.py
          if grep -q 'ClearKey con HLS no está soportado' android/app/src/main/kotlin/com/example/iptv_player/MainActivity.kt; then
            echo 'Legacy ClearKey/HLS rejection is still present.' >&2
            exit 1
          fi
          git diff --check

      - name: Analyze application and tests
        run: dart analyze lib test

      - name: Run application tests
        run: flutter test --no-pub --reporter expanded

      - name: Prepare provider resolver configuration
        shell: bash
        env:
          OFFICIAL_PROVIDER_CONFIG: ${{ secrets.TV_FULL_DYNAMIC_SOURCE_JSON }}
        run: |
          set -euo pipefail
          if [[ -n "${OFFICIAL_PROVIDER_CONFIG:-}" ]]; then
            config="$OFFICIAL_PROVIDER_CONFIG"
            mode='official'
          else
            # Laboratorio autorizado: reutiliza el contrato y valores temporales
            # de compatibilidad que ya fueron usados por las builds V41/V42.
            git fetch --quiet origin feature/dynamic-stream-resolver-v40-protocol-final
            xhash="$(git show FETCH_HEAD:v41_xhash.txt | tr -d '\r\n\t ')"
            xdid="$(git show FETCH_HEAD:v42_xdid.txt | tr -d '\r\n\t ')"
            test -n "$xhash"
            test -n "$xdid"
            echo "::add-mask::$xhash"
            echo "::add-mask::$xdid"
            export TVFULL_LAB_XHASH="$xhash"
            export TVFULL_LAB_XDID="$xdid"
            config="$(python3 - <<'PY'
          import json, os
          xhash = os.environ['TVFULL_LAB_XHASH']
          xdid = os.environ['TVFULL_LAB_XDID']
          print(json.dumps({
              'name': 'TV FULL · Proveedor',
              'server': 'http://tv.m3uts.xyz',
              'username': 'm',
              'password': 'm',
              'catalogHeaders': {'User-Agent': 'Dalvik/2.1.0'},
              'resolver': {
                  'path': '/stream/gen/{id}',
                  'method': 'POST',
                  'form': {
                      'id': '{id}',
                      'cast': 'false',
                      'device': xdid,
                      'code': ''
                  }
              },
              'playbackHeaders': {
                  'X-App': 'di',
                  'X-Version': '10/1.0.9',
                  'X-Did': xdid,
                  'User-Agent': 'Magma Player/10'
              },
              'xHash': xhash
          }, separators=(',', ':')))
          PY
            )"
            mode='authorized-lab-fallback'
          fi

          test -n "$config"
          export CONFIG_TO_VERIFY="$config"
          python3 - <<'PY'
          import json, os
          value = json.loads(os.environ['CONFIG_TO_VERIFY'])
          assert isinstance(value, dict)
          server = str(value.get('server', '')).strip()
          resolver = value.get('resolver')
          assert server.startswith(('http://', 'https://'))
          assert isinstance(resolver, dict)
          assert str(resolver.get('path', '')).strip()
          print('Provider resolver configuration is structurally valid.')
          PY

          {
            echo 'TV_FULL_DYNAMIC_SOURCE_JSON_RUNTIME<<TVFULL_CONFIG_EOF'
            printf '%s\n' "$config"
            echo 'TVFULL_CONFIG_EOF'
            echo "TV_FULL_PROVIDER_CONFIG_MODE=$mode"
          } >> "$GITHUB_ENV"
          echo "Resolver configuration mode: $mode"

      - name: Configure historical TV FULL signing
        shell: bash
        env:
          TV_FULL_KEYSTORE_BASE64: ${{ secrets.TV_FULL_KEYSTORE_BASE64 }}
          TV_FULL_KEYSTORE_PASSWORD: ${{ secrets.TV_FULL_KEYSTORE_PASSWORD }}
          TV_FULL_KEY_ALIAS: ${{ secrets.TV_FULL_KEY_ALIAS }}
          TV_FULL_KEY_PASSWORD: ${{ secrets.TV_FULL_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$TV_FULL_KEYSTORE_BASE64"
          test -n "$TV_FULL_KEYSTORE_PASSWORD"
          test -n "$TV_FULL_KEY_ALIAS"
          test -n "$TV_FULL_KEY_PASSWORD"
          umask 077
          printf '%s' "$TV_FULL_KEYSTORE_BASE64" | base64 --decode > android/tvfull-release.jks
          cat > android/key.properties <<EOF
          storeFile=tvfull-release.jks
          storePassword=$TV_FULL_KEYSTORE_PASSWORD
          keyAlias=$TV_FULL_KEY_ALIAS
          keyPassword=$TV_FULL_KEY_PASSWORD
          EOF

      - name: Build signed ARM32 and ARM64 APKs
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TV_FULL_DYNAMIC_SOURCE_JSON_RUNTIME"
          flutter build apk --release --split-per-abi \
            --target-platform android-arm,android-arm64 \
            --build-name="$BUILD_NAME" \
            --build-number="$BUILD_NUMBER" \
            --dart-define=TV_FULL_ANDROID_TV=true \
            --dart-define="TV_FULL_DYNAMIC_SOURCE_JSON=$TV_FULL_DYNAMIC_SOURCE_JSON_RUNTIME"

      - name: Verify certificate, package, version and architectures
        run: python3 .github/scripts/verify_provider_apks.py

      - name: Publish verified APKs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="tv-full-pro-v${RELEASE_NUMBER}-provider-json-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cat > artifact/release-notes.md <<EOF
          TV FULL · Proveedor conserva el catálogo provider.json completo y lo entrega sin reescrituras al parser.
          Los streams directos siguen reproduciendo de forma directa.
          Las rutas Flow usan la ruta original live/c... para obtener un host/token temporal del motor suministrado por el proveedor justo al pulsar Play.
          Los metadatos de reproducción, headers y ClearKey suministrados por el proveedor permanecen disponibles para Media3.
          ClearKey se habilita también para HLS cuando el catálogo autorizado del proveedor lo indica.
          HTTP 401/403 permite renovación acotada de la sesión/token antes de marcar un canal como no disponible; 404/410 siguen siendo terminales.
          El motor dinámico mantiene compatibilidad con el resolver tradicional de stream_id para las fuentes que realmente usan ese protocolo.
          Esta build fue compilada en modo de configuración: ${TV_FULL_PROVIDER_CONFIG_MODE}.
          La URL temporal final nunca se guarda en el catálogo.
          M3U, Xtream y Stalker mantienen su flujo existente.
          ARM32 y ARM64 conservan el paquete y certificado históricos de TV FULL PRO.
          EOF
          gh release create "$TAG" \
            artifact/TV-FULL-PRO-V48-ARM32.apk \
            artifact/TV-FULL-PRO-V48-ARM64.apk \
            artifact/latest.json \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "TV FULL PRO ${BUILD_NAME}+${BUILD_NUMBER} - provider resolver" \
            --notes-file artifact/release-notes.md

      - name: Remove signing material
        if: always()
        run: rm -f android/key.properties android/tvfull-release.jks

      - name: Upload APK verification bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TV-FULL-PRO-V48-PROVIDER-RESOLVER
          path: artifact/
          if-no-files-found: warn
          retention-days: 30
