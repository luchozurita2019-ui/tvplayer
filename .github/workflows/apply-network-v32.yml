name: Apply Network V3.2 Patch

on:
  push:
    branches: [performance-engine-v3-network-fix]

permissions:
  contents: write

jobs:
  apply-network-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar rama
        uses: actions/checkout@v4
        with:
          ref: performance-engine-v3-network-fix
          fetch-depth: 0

      - name: Aplicar optimización de red V3.2
        run: python tools/apply_network_v32.py

      - name: Retirar herramientas temporales
        run: |
          rm -f tools/apply_network_v32.py
          rm -f .github/workflows/apply-network-v32.yml

      - name: Guardar cambios en la rama
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/player_screen.dart tools/apply_network_v32.py .github/workflows/apply-network-v32.yml
          git commit -m "perf: network prefetch, fast reconnect and live indicator"
          git push origin HEAD:performance-engine-v3-network-fix
