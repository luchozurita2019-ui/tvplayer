plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.tvfull.pro'
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'com.tvfull.pro'
        minSdk 21
        targetSdk 34
        versionCode 23
        versionName '7.2-stable-ui-fast-fail'
    }

    signingConfigs {
        debug {}
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    sourceSets {
        main {
            // Keep the source-built IJK/FFmpeg stack in the APK while it remains
            // isolated from the production route for controlled device testing.
            java.srcDirs += ['src/main/ijkplayer-java']
            jniLibs.srcDirs += ['src/main/jniLibs']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // Media3 is the production playback path again because it preserves the
    // mature TV UI and the working video renderer. IJK remains available only
    // as an isolated test path until its Surface behavior is validated on TVs.
    implementation 'androidx.media3:media3-exoplayer:1.8.0'
    implementation 'androidx.media3:media3-exoplayer-hls:1.8.0'
    implementation 'androidx.media3:media3-exoplayer-dash:1.8.0'
    implementation 'androidx.media3:media3-ui:1.8.0'
}
