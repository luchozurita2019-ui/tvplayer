name: iptv_player
description: Reproductor de listas IPTV M3U rápido, fluido y multiplataforma.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- Reproducción de video/audio ---
  # V2 TV congela exactamente las versiones usadas por la V1 probada para que
  # la comparación de rendimiento no cambie el motor por una actualización.
  media_kit: 1.2.6
  media_kit_video: 1.3.1
  media_kit_libs_video: 1.0.7

  # --- Estado de la app ---
  provider: ^6.1.2

  # --- Red / descarga de listas M3U ---
  http: ^1.2.2

  # --- Persistencia local (listas, favoritos, última posición) ---
  shared_preferences: ^2.3.2

  # --- Utilidades ---
  crypto: ^3.0.6
  path_provider: ^2.1.4
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
